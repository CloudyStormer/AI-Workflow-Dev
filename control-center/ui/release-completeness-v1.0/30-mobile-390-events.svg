<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="cc-mobile-390-events-title cc-mobile-390-events-desc">
  <title id="cc-mobile-390-events-title">AI 工作流控制中心390移动事件审计设计</title>
  <desc id="cc-mobile-390-events-desc">390独立移动重排的事件审计页面，正文不小于16像素，辅助文字不小于14像素。</desc>
  <rect width="390" height="844" fill="#F3F5F8"/>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style><rect width="390" height="68" fill="#171B4B"/><text x="16" y="25" font-size="17" font-weight="720" fill="#FFFFFF" text-anchor="start" dominant-baseline="middle" >AI 工作流控制中心</text><text x="16" y="49" font-size="14" font-weight="500" fill="#C9D2FF" text-anchor="start" dominant-baseline="middle" >事件审计</text><rect x="268" y="19" width="106" height="30" rx="15" fill="#EAF2FF" stroke="#EAF2FF" /><text x="321" y="35" font-size="14" font-weight="650" fill="#2563EB" text-anchor="middle" dominant-baseline="middle" >部分可用</text><rect x="12" y="82" width="366" height="58" rx="10" fill="#FFF4E8" stroke="#8A3F00" stroke-width="1.5"/><text x="34" y="111" font-size="21" font-weight="700" fill="#8A3F00" text-anchor="start" dominant-baseline="middle" >△</text><text x="64" y="102" font-size="16" font-weight="750" fill="#17201D" text-anchor="start" dominant-baseline="middle" >目标态演示 · 部分可用</text><text x="64" y="122" font-size="14" font-weight="500" fill="#5E6A66" text-anchor="start" dominant-baseline="middle" >示例状态 · 非当前事实</text><rect x="16" y="156" width="358" height="220" rx="12" fill="#FFFFFF" stroke="#D8DFE3" /><text x="32" y="182" font-size="17" font-weight="720" fill="#17201D" text-anchor="start" dominant-baseline="middle" >事件时间线</text><text x="36" y="208" font-size="14" font-weight="500" fill="#5E6A66" text-anchor="start" dominant-baseline="middle" >核心证据保持可见</text><rect x="32" y="226" width="326" height="36" rx="7" fill="#EEF1F5" stroke="#D8DFE3" /><text x="44" y="244" font-size="16" font-weight="600" fill="#17201D" text-anchor="start" dominant-baseline="middle" >可解析事件保留</text><rect x="32" y="270" width="326" height="36" rx="7" fill="#EEF1F5" stroke="#D8DFE3" /><text x="44" y="288" font-size="16" font-weight="600" fill="#17201D" text-anchor="start" dominant-baseline="middle" >损坏行显示位置</text><rect x="32" y="314" width="326" height="36" rx="7" fill="#EEF1F5" stroke="#D8DFE3" /><text x="44" y="332" font-size="16" font-weight="600" fill="#17201D" text-anchor="start" dominant-baseline="middle" >稳定排序可追溯</text><rect x="16" y="392" width="358" height="202" rx="12" fill="#FFFFFF" stroke="#D8DFE3" /><text x="32" y="418" font-size="17" font-weight="720" fill="#17201D" text-anchor="start" dominant-baseline="middle" >组合筛选</text><text x="36" y="444" font-size="14" font-weight="500" fill="#5E6A66" text-anchor="start" dominant-baseline="middle" >状态、来源与恢复动作</text><text x="36" y="462" font-size="16" font-weight="500" fill="#5E6A66" text-anchor="start" dominant-baseline="middle" >• 项目与时间</text><text x="36" y="494" font-size="16" font-weight="500" fill="#5E6A66" text-anchor="start" dominant-baseline="middle" >• 角色与类型</text><text x="36" y="526" font-size="16" font-weight="500" fill="#5E6A66" text-anchor="start" dominant-baseline="middle" >• 变更与结果</text><rect x="32" y="542" width="157" height="44" rx="22" fill="#EAF2FF" stroke="#EAF2FF" /><text x="110.5" y="565" font-size="16" font-weight="650" fill="#2563EB" text-anchor="middle" dominant-baseline="middle" >查看详情</text><rect x="201" y="542" width="157" height="44" rx="22" fill="#EEF1F5" stroke="#EEF1F5" /><text x="279.5" y="565" font-size="16" font-weight="650" fill="#3347B8" text-anchor="middle" dominant-baseline="middle" >导出查询</text><rect x="16" y="610" width="358" height="134" rx="12" fill="#FFF4E8" stroke="#8A3F00" /><text x="32" y="636" font-size="17" font-weight="720" fill="#8A3F00" text-anchor="start" dominant-baseline="middle" >只读监管 · 零写</text><text x="32" y="674" font-size="16" font-weight="500" fill="#17201D" text-anchor="start" dominant-baseline="middle" >无批准、发布、修复或 Git 写入口。</text><text x="32" y="708" font-size="14" font-weight="500" fill="#5E6A66" text-anchor="start" dominant-baseline="middle" >触控目标至少 44×44。</text><rect x="0" y="774" width="390" height="70" rx="0" fill="#FFFFFF" stroke="#D8DFE3" /><g role="img" aria-label="总览" data-m