<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768" role="img" aria-labelledby="cc-tablet-1024-title cc-tablet-1024-desc">
  <title id="cc-tablet-1024-title">AI 工作流控制中心平板项目详情降级设计</title>
  <desc id="cc-tablet-1024-desc">1024平板项目详情，展示单项目失败时的降级可用、七页签、来源和证据。</desc>
  <rect width="1024" height="768" fill="#F3F5F8"/>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style><rect width="72" height="768" fill="#171B4B"/><g role="img" aria-label="总览" data-primary-label="总览"><rect x="16" y="76" width="40" height="40" rx="10" fill="#171B4B" stroke="#171B4B" /><text x="36" y="96" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle" >总</text></g><g role="img" aria-label="项目与阶段" data-primary-label="项目与阶段"><rect x="16" y="134" width="40" height="40" rx="10" fill="#35458E" stroke="#35458E" /><text x="36" y="154" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle" >项</text></g><g role="img" aria-label="角色协作" data-primary-label="角色协作"><rect x="16" y="192" width="40" height="40" rx="10" fill="#171B4B" stroke="#171B4B" /><text x="36" y="212" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle" >角</text></g><g role="img" aria-label="质量与复测" data-primary-label="质量与复测"><rect x="16" y="250" width="40" height="40" rx="10" fill="#171B4B" stroke="#171B4B" /><text x="36" y="270" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle" >质</text></g><g role="img" aria-label="迭代与发布" data-primary-label="迭代与发布"><rect x="16" y="308" width="40" height="40" rx="10" fill="#171B4B" stroke="#171B4B" /><text x="36" y="328" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle" >发</text></g><g role="img" aria-label="成熟度与治理" data-primary-label="成熟度与治理"><rect x="16" y="366" width="40" height="40" rx="10" fill="#171B4B" stroke="#171B4B" /><text x="36" y="386" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle" >治</text></g><text x="96" y="32" font-size="26" font-weight="760" fill="#17201D" text-anchor="start" dominant-baseline="middle" >项目证据详情</text><text x="96" y="60" font-size="12" font-weight="650" fill="#5E6A66" text-anchor="start" dominant-baseline="middle" >一级：项目与阶段 · 次级：项目证据详情</text><rect x="834" y="22" width="166" height="34" rx="17" fill="#EEF1F5" stroke="#EEF1F5" /><text x="917" y="40" font-size="13" font-weight="650" fill="#3347B8" text-anchor="middle" dominant-baseline="middle" >只读监管 · 零写</text><rect x="96" y="76" width="904" height="58" rx="10" fill="#FFF4E8" stroke="#8A3F00" stroke-width="1.5"/><text x="118" y="105" font-size="21" font-weight="700" fill="#8A3F00" text-anchor="start" dominant-baseline="middle" >△</text><text x="148" y="96" font-size="15" font-weight="750" fill="#17201D" text-anchor="start" dominant-baseline="middle" >目标态演示 · 降级可用</text><text x="148" y="116" font-size="12" font-weight="500" fill="#5E6A66" text-anchor="start" dominant-baseline="middle" >示例：单项目读取失败，其余项目保留；非当前运行事实</text><rect x="96" y="140" width="92" height="34" rx="17" fill="#DDE4FF" stroke="#DDE4FF" /><text x="142" y="158" font-size="13" font-weight="650" fill="#3347B8" text-anchor="middle" dominant-baseline="middle" >概况</text><rect x="198" y="140" width="92" height="34" rx="17" fill="#FFFFFF" stroke="#FFFFFF" /><text x="244" y="158" font-size="13" font-weight="650" fill="#5E6A66" text-anchor="middle" dominant-baseline="middle" >审批</text><rect x="300" y="140" width="92" height="34" rx="17" fill="#FFFFFF" stroke="#FFFFFF" /><text x="346" y="158" font-size="13" font-weight="650" fill="#5E6A66" text-anchor="middle" dominant-baseline="middle" >产物</text><rect x="402" y="140" width="92" height="34" rx="17" fill="#FFFFFF" stroke="#FFFFFF" /><text x="448" y="158" font-size="13" font-weight="650" fill="#5E6A66" text-anchor="middle" dominant-baseline="middle" >事件</text><rect x="504" y="140" width="92" height="34" rx="17" fill="#FFFFFF" stroke="#FFFFFF" /><text x="550" y="158" font-size="13" font-weight="650" fill="#5E6A66" text-anchor="middle" dominant-baseline="middle" >问题</text><rect x="606" y="140" width="92" height="34" rx="17" fill="#FFFFFF" stroke="#FFFFFF" /><text x="652" y="158" font-size="13" font-weight="650" fill="#5E6A66" text-anchor="middle" dominant-baseline="middle" >发布</text><rect x="708" y="140" width="92" height="34" rx="17" fill="#FFFFFF" stroke="#FFFFFF" /><text x="754" y="158" font-size="13" font-weight="650" fill="#5E6A66" text-anchor="middle" dominant-baseline="middle" >来源</text><rect x="96" y="194" width="560" height="246" rx="12" fill="#FFFFFF" stroke="#D8DFE3" /><text x="114" y="219" font-size="17" font-weight="720" fill="#17201D" text-anchor="start" dominant-baseline="middle" >单项目阶段轨道</text><text x="118" y="245" font-size="12" font-weight="500" fill="#5E6A66" text-anchor="start" dominant-baseline="middle" >只画已登记节点</text><line x1="152" y1="298" x2="224" y2="298" stroke="#3347B8" stroke-width="3" /><circle cx="152" cy="298" r="9" fill="#087E68"/><text x="152" y="326" font-size="12" font-weight="600" fill="#5E6A66" text-anchor="middle" dominant-baseline="middle" >市场</text><line x1="244" y1="298" x2="316" y2="298" stroke="#3347B8" stroke-width="3" /><circle cx="244" cy="298" r="9" fill="#087E68"/><text x="244" y="326" font-size="12" font-weight="600" fill="#5E6A66" text-anchor="middle" dominant-baseline="middle" >初始化</text><line x1="336" y1="298" x2="408" y2="298" stroke="#3347B8" stroke-width="3" /><circle cx="336" cy="298" r="9" fill="#087E68"/><text x="336" y="326" font-size="12" font-weight="600" fill="#5E6A66" text-anchor="middle" dominant-baseline="middle" >产品</text><line x1="428" y1="298" x2="500" y2="298" stroke="#3347B8" stroke-width="3" /><circle cx="428" cy="298" r="9" fill="#8A3F00"/><text x="428" y="326" font-size="12" font-weight="600" fill="#5E6A66" text-anchor="middle" dominant-baseline="middle" >UI/UX</text><line x1="520" y1="298" x2="592" y2="298" stroke="#D8DFE3" stroke-width="3" /><circle cx="520" cy="298" r="9" fill="#475467"/><text x="520" y="326" font-size="12" font-weight="600" fill="#5E6A66" text-anchor="middle" dominant-baseline="middle" >架构</text><line x1="612" y1="298" x2="684" y2="298" stroke="#D8DFE3" stroke-width="3" /><circle cx="612" cy="298" r="9" fill="#475467"/><text x="612" y="326" font-size="12" font-weight="600" fill="#5E6A66" text-anchor="middle" dominant-baseline="middle" >开发</text><text x="114" y="382" font-size="13" font-weight="600" fill="#8A3F00" text-anchor="start" dominant-baseline="middle" >工作副本有未提交修改；批准事实仍以审批记录为准。</text><rect x="672" y="194" width="328" height="246" rx="12" fill="#FFFFFF" stroke="#D8DFE3" /><text x="690" y="219" font-size="17" font-weight="720" fill="#17201D" text-anchor="start" dominant-baseline="middle" >项目真实性四轨</text><text x="694" y="245" font-size="12" font-weight="500" fill="#5E6A66" text-anchor="start" dominant-baseline="middle" >前端、后端、真实数据、生产独立</text><text x="690" y="267" font-size="12" font-weight="650" fill="#17201D" text-anchor="start" dominant-baseline="middle" >前端</text><rect x="774" y="253" width="104" height="26" rx="13" fill="#F3EEFF" stroke="#F3EEFF" /><text x="826" y="267" font-size="13" font-weight="650" fill="#6D28D9" text-anchor="middle" dominant-baseline="middle" >演示可浏览</text><text x="690" y="305" font-size="12" font-weight="650" fill="#17201D" text-anchor="start" dominant-baseline="middle" >后端</text><rect x="774" y="291" width="104" height="26" rx="13" fill="#EEF1F5" stroke="#EEF1F5" /><text x="826" y="305" font-size="13" font-weight="650" fill="#475467" text-anchor="middle" dominant-baseline="middle" >未实现</text><text x="690" y="343" font-size="12" font-weight="650" fill="#17201D" text-anchor="start" dominant-baseline="middle" >真实数据</text><rect x="774" y="329" width="104" height="26" rx="13" fill="#EAF2FF" stroke="#EAF2FF" /><text x="826" y="343" font-size="13" font-weight="650" fill="#2563EB" text-anchor="middle" dominant-baseline="middle" >未就绪</text><text x="690" y="381" font-size="12" font-weight="650" fill="#17201D" text-anchor="start" dominant-baseline="middle" >生产</text><rect x="774" y="367" width="104" height="26" rx="13" fill="#EEF1F5" stroke="#EEF1F5" /><text x="826" y="381" font-size="13" font-weight="650" fill="#475467" text-anchor="middle" dominant-baseline="middle" >未授权</text><rect x="96" y="456" width="430" height="272" rx="12" fill="#FFFFFF" stroke="#D8DFE3" /><text x="114" y="481" font-size="17" font-weight="720" fill="#17201D" text-anchor="start" dominant-baseline="middle" >来源、覆盖与新鲜度</text><text x="118" y="507" font-size="12" font-weight="500" fill="#5E6A66" text-anchor="start" dominant-baseline="middle" >源更新时间与本次观测时间分开展示</text><text x="114" y="520" font-size="12" font-weight="650" fill="#17201D" text-anchor="start" dominant-baseline="middle" data-source-row="项目" data-source-row-y="520">项目</text><text x="200" y="520" font-size="12" font-weight="600" fill="#6D28D9" text-anchor="start" dominant-baseline="middle" >上次快照</text><text x="508" y="520" font-size="12" font-weight="500" fill="#5E6A66" text-anchor="end" dominant-baseline="middle" class="mono">16:40</text><line x1="114" y1="536" x2="508" y2="536" stroke="#EDF0F2" stroke-width="1" /><text x="114" y="551" font-size="12" font-weight="650" fill="#17201D" text-anchor="start" dominant-baseline="middle" data-source-row="角色" data-source-row-y="551">角色</text><text x="200" y="551" font-size="12" font-weight="600" fill="#6D28D9" text-anchor="start" dominant-baseline="middle" >上次快照</text><text x="508" y="551" font-size="12" font-weight="500" fill="#5E6A66" text-anchor="end" dominant-baseline="middle" class="mono">16:40</text><line x1="114" y1="567" x2="508" y2="567" stroke="#EDF0F2" stroke-width="1" /><text x="114" y="582" font-size="12" font-weight="650" fill="#17201D" text-anchor="start" dominant-baseline="middle" data-source-row="审批" data-source-row-y="582">审批</text><text x="200" y="582" font-size="12" font-weight="600" fill="#6D28D9" text-anchor="start" dominant-baseline="middle" >上次快照</text><text x="508" y="582" font-size="12" font-weight="500" fill="#5E6A66" text-anchor="end" dominant-baseline="middle" class="mono">16:40</text><line x1="114" y1="598" x2="508" y2="598" stroke="#EDF0F2" stroke-width="1" /><text x="114" y="613" font-size="12" font-weight="650" fill="#17201D" text-anchor="start" dominant-baseline="middle" data-source-row="产物" data-source-row-y="613">产物</text><text x="200" y="613" font-size="12" font-weight="600" fill="#6D28D9" text-anchor="start" dominant-baseline="middle" >上次快照</text><text x="508" y="613" font-size="12" font-weight="500" fill="#5E6A66" text-anchor="end" dominant-baseline="middle" class="mono">16:40</text><line x1="114" y1="629" x2="508" y2="629" stroke="#EDF0F2" stroke-width="1" /><text x="114" y="644" font-size="12" font-weight="650" fill="#17201D" text-anchor="start" dominant-baseline="middle" data-source-row="事件" data-source-row-y="644">事件</text><text x="200" y="644" font-size="12" font-weight="600" fill="#6D28D9" text-anchor="start" dominant-baseline="middle" >覆盖不可用</text><text x="508" y="644" font-size="12" font-weight="500" fill="#5E6A66" text-anchor="end" dominant-baseline="middle" class="mono">16:40</text><line x1="114" y1="660" x2="508" y2="660" stroke="#EDF0F2" stroke-width="1" /><text x="114" y="675" font-size="12" font-weight="650" fill="#17201D" text-anchor="start" dominant-baseline="middle" data-source-row="问题" data-source-row-y="675">问题</text><text x="200" y="675" font-size="12" font-weight="600" fill="#6D28D9" text-anchor="start" dominant-baseline="middle" >覆盖不可用</text><text x="508" y="675" font-size="12" font-weight="500" fill="#5E6A66" text-anchor="end" dominant-baseline="middle" class="mono">16:40</text><line x1="114" y1="691" x2="508" y2="691" stroke="#EDF0F2" stroke-width="1" /><text x="114" y="706" font-size="12" font-weight="650" fill="#17201D" text-anchor="start" dominant-baseline="middle" data-source-row="发布" data-source-row-y="706">发布</text><text x="200" y="706" font-size="12" font-weight="600" fill="#6D28D9" text-anchor="start" dominant-baseline="middle" >覆盖不可用</text><text x="508" y="706" font-size="12" font-weight="500" fill="#5E6A66" text-anchor="end" dominant-baseline="middle" class="mono">16:40</text><rect x="542" y="456" width="458" height="250" rx="12" fill="#FFFFFF" stroke="#D8DFE3" /><text x="560" y="481" font-size="17" font-weight="720" fill="#17201D" text-anchor="start" dominant-baseline="middle" >失败范围与恢复</text><text x="564" y="507" font-size="12" font-weight="500" fill="#5E6A66" text-anchor="start" dominant-baseline="middle" >只读重新读取不会修复源文件</text><text x="560" y="526" font-size="12" font-weight="500" fill="#5E6A66" text-anchor="start" dominant-baseline="middle" >错误码：来源解析失败（SOURCE_PARSE_FAILED）</text><text x="560" y="556" font-size="12" font-weight="500" fill="#5E6A66" text-anchor="start" dominant-baseline="middle" >影响：项目、审批、事件</text><text x="560" y="586" font-size="12" font-weight="650" fill="#6D28D9" text-anchor="start" dominant-baseline="middle" >仍可用：其余示例项目</text><text x="560" y="616" font-size="12" font-weight="500" fill="#5E6A66" text-anchor="start" dominant-baseline="middle" >最近成功：示例时间</text><text x="560" y="646" font-size="12" font-weight="500" fill="#5E6A66" text-anchor="start" dominant-baseline="middle" >根仓提交：示例哈希</text></svg>
