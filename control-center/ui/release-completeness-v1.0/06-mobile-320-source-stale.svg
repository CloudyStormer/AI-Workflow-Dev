<svg xmlns="http://www.w3.org/2000/svg" width="320" height="720" viewBox="0 0 320 720" role="img" aria-labelledby="cc-mobile-320-source-stale-title cc-mobile-320-source-stale-desc">
  <title id="cc-mobile-320-source-stale-title">AI 工作流控制中心320移动来源、成熟度与系统状态设计</title>
  <desc id="cc-mobile-320-source-stale-desc">320移动端独立重排，覆盖来源、覆盖与新鲜度、成熟度与治理、系统状态与恢复三个目的页并显示当前失败原因。</desc>
  <rect width="320" height="720" fill="#F3F5F8"/>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style><rect width="320" height="68" fill="#171B4B"/><text x="16" y="25" font-size="17" font-weight="720" fill="#FFFFFF" text-anchor="start" dominant-baseline="middle" >AI 工作流控制中心</text><text x="16" y="49" font-size="14" font-weight="500" fill="#C9D2FF" text-anchor="start" dominant-baseline="middle" >治理状态组合</text><rect x="198" y="19" width="106" height="30" rx="15" fill="#F3EEFF" stroke="#F3EEFF" /><text x="251" y="35" font-size="14" font-weight="650" fill="#6D28D9" text-anchor="middle" dominant-baseline="middle" >上次快照</text><rect x="12" y="82" width="296" height="58" rx="10" fill="#F3EEFF" stroke="#6D28D9" stroke-width="1.5"/><text x="34" y="111" font-size="21" font-weight="700" fill="#6D28D9" text-anchor="start" dominant-baseline="middle" >◷</text><text x="64" y="102" font-size="16" font-weight="750" fill="#17201D" text-anchor="start" dominant-baseline="middle" >目标态演示 · 数据已过期</text><text x="64" y="122" font-size="14" font-weight="500" fill="#5E6A66" text-anchor="start" dominant-baseline="middle" >来源解析失败 · 非实时</text><rect x="12" y="156" width="296" height="132" rx="12" fill="#FFFFFF" stroke="#D8DFE3" /><text x="28" y="181" font-size="17" font-weight="720" fill="#17201D" text-anchor="start" dominant-baseline="middle" >监管状态条</text><text x="32" y="207" font-size="14" font-weight="500" fill="#5E6A66" text-anchor="start" dominant-baseline="middle" >同一真相态配对</text><text x="28" y="234" font-size="16" font-weight="650" fill="#17201D" text-anchor="start" dominant-baseline="middle" >进程健康</text><text x="292" y="234" font-size="16" font-weight="700" fill="#475467" text-anchor="end" dominant-baseline="middle" >健康未知</text><text x="28" y="258" font-size="16" font-weight="650" fill="#17201D" text-anchor="start" dominant-baseline="middle" >数据就绪</text><text x="292" y="258" font-size="16" font-weight="700" fill="#8A3F00" text-anchor="end" dominant-baseline="middle" >降级可用</text><text x="28" y="282" font-size="16" font-weight="650" fill="#17201D" text-anchor="start" dominant-baseline="middle" >来源模式</text><text x="292" y="282" font-size="16" font-weight="700" fill="#6D28D9" text-anchor="end" dominant-baseline="middle" >上次快照</text><rect x="12" y="304" width="296" height="170" rx="12" fill="#FFFFFF" stroke="#D8DFE3" /><text x="28" y="329" font-size="17" font-weight="720" fill="#17201D" text-anchor="start" dominant-baseline="middle" >来源与失败范围</text><text x="32" y="355" font-size="14" font-weight="500" fill="#5E6A66" text-anchor="start" dominant-baseline="middle" >源时间和观测时间分开</text><text x="28" y="379" font-size="14" font-weight="500" fill="#5E6A66" text-anchor="start" dominant-baseline="middle" >来源：工作流治理文件</text><text x="28" y="400" font-size="14" font-weight="500" fill="#5E6A66" text-anchor="start" dominant-baseline="middle" >快照：目标态示例时间</text><text x="28" y="421" font-size="14" font-weight="650" fill="#8A3F00" text-anchor="start" dominant-baseline="middle" >当前失败：来源解析失败</text><text x="28" y="443" font-size="14" font-weight="600" fill="#5E6A66" text-anchor="start" dominant-baseline="middle" class="mono" data-machine-value="true">错误码：SOURCE_PARSE_FAILED</text><text x="28" y="463" font-size="14" font-weight="500" fill="#5E6A66" text-anchor="start" dominant-baseline="middle" >影响：审批、事件、问题</text><rect x="12" y="486" width="296" height="160" rx="12" fill="#FFFFFF" stroke="#D8DFE3" /><text x="28" y="508" font-size="17" font-weight="720" fill="#17201D" text-anchor="start" dominant-baseline="middle" data-mobile-maturity-line="0">成熟度与治理</text><text x="28" y="534" font-size="14" font-weight="600" fill="#17201D" text-anchor="start" dominant-baseline="middle" data-mobile-maturity-line="1">角色职责 · 阶段审批 · 产物追溯</text><text x="28" y="556" font-size="14" font-weight="600" fill="#17201D" text-anchor="start" dominant-baseline="middle" data-mobile-maturity-line="2">自动执行 · 测试评测 · 可观测成本</text><text x="28" y="580" font-size="14" font-weight="650" fill="#8A3F00" text-anchor="start" dominant-baseline="middle" data-mobile-maturity-line="3">规则：R1 · 样本：0 · 缺失：6</text><text x="28" y="604" font-size="14" font-weight="600" fill="#5E6A66" text-anchor="start" dominant-baseline="middle" data-mobile-maturity-line="4">证据不足不计算 · 系统仅只读恢复</text><text x="28" y="628" font-size="14" font-weight="650" fill="#8A3F00" text-anchor="start" dominant-baseline="middle" data-mobile-maturity-line="5">零写：无批准、发布、修复或 Git 写入</text><rect x="0" y="650" width="320" height="70" rx="0" fill="#FFFFFF" stroke="#D8DFE3" /><g role="img" aria-label="总览" data-mobile-nav-label="总览"><circle cx="40" cy="674" r="5" fill="#475467"/><text x="40" y="697" font-size="14" font-weight="500" fill="#5E6A66" text-anchor="middle" dominant-baseline="middle" >总览</text></g><g role="img" aria-label="项目" data-mobile-nav-label="项目"><circle cx="120" cy="674" r="5" fill="#475467"/><text x="120" y="697" font-size="14" font-weight="500" fill="#5E6A66" text-anchor="middle" dominant-baseline="middle" >项目</text></g><g role="img" aria-label="质量" data-mobile-nav-label="质量"><circle cx="200" cy="674" r="5" fill="#475467"/><text x="200" y="697" font-size="14" font-weight="500" fill="#5E6A66" text-anchor="middle" dominant-baseline="middle" >质量</text></g><g role="img" aria-label="更多" data-mobile-nav-label="更多" aria-current="page"><circle cx="280" cy="674" r="5" fill="#3347B8"/><text x="280" y="697" font-size="14" font-weight="700" fill="#3347B8" text-anchor="middle" dominant-baseline="middle" >更多</text></g></svg>
