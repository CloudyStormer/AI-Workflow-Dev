<svg xmlns="http://www.w3.org/2000/svg" width="320" height="720" viewBox="0 0 320 720" role="img" aria-labelledby="cc-mobile-320-issues-title cc-mobile-320-issues-desc">
  <title id="cc-mobile-320-issues-title">AI 工作流控制中心320移动问题、Bug 与复测设计</title>
  <desc id="cc-mobile-320-issues-desc">320独立移动重排的问题、Bug 与复测页面，正文不小于16像素，辅助文字不小于14像素。</desc>
  <rect width="320" height="720" fill="#F3F5F8"/>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style><rect width="320" height="68" fill="#171B4B"/><text x="16" y="25" font-size="17" font-weight="720" fill="#FFFFFF" text-anchor="start" dominant-baseline="middle" >AI 工作流控制中心</text><text x="16" y="49" font-size="14" font-weight="500" fill="#C9D2FF" text-anchor="start" dominant-baseline="middle" >问题、Bug 与复测</text><rect x="198" y="19" width="106" height="30" rx="15" fill="#EAF2FF" stroke="#EAF2FF" /><text x="251" y="35" font-size="14" font-weight="650" fill="#2563EB" text-anchor="middle" dominant-baseline="middle" >未知</text><rect x="12" y="82" width="296" height="58" rx="10" fill="#EEF1F5" stroke="#475467" stroke-width="1.5"/><text x="34" y="111" font-size="21" font-weight="700" fill="#475467" text-anchor="start" dominant-baseline="middle" >?</text><text x="64" y="102" font-size="16" font-weight="750" fill="#17201D" text-anchor="start" dominant-baseline="middle" >未知</text><text x="64" y="122" font-size="14" font-weight="500" fill="#5E6A66" text-anchor="start" dominant-baseline="middle" >当前不补造数字或成功状态</text><rect x="12" y="156" width="296" height="220" rx="12" fill="#FFFFFF" stroke="#D8DFE3" /><text x="28" y="182" font-size="17" font-weight="720" fill="#17201D" text-anchor="start" dominant-baseline="middle" >问题覆盖</text><text x="32" y="208" font-size="14" font-weight="500" fill="#5E6A66" text-anchor="start" dominant-baseline="middle" >核心证据保持可见</text><rect x="28" y="226" width="264" height="36" rx="7" fill="#EEF1F5" stroke="#D8DFE3" /><text x="40" y="244" font-size="16" font-weight="600" fill="#17201D" text-anchor="start" dominant-baseline="middle" >覆盖不可用不显示 0</text><rect x="28" y="270" width="264" height="36" rx="7" fill="#EEF1F5" stroke="#D8DFE3" /><text x="40" y="288" font-size="16" font-weight="600" fill="#17201D" text-anchor="start" dominant-baseline="middle" >严重度与状态分开</text><rect x="28" y="314" width="264" height="36" rx="7" fill="#EEF1F5" stroke="#D8DFE3" /><text x="40" y="332" font-size="16" font-weight="600" fill="#17201D" text-anchor="start" dominant-baseline="middle" >重复记录保留来源</text><rect x="12" y="392" width="296" height="202" rx="12" fill="#FFFFFF" stroke="#D8DFE3" /><text x="28" y="418" font-size="17" font-weight="720" fill="#17201D" text-anchor="start" dominant-baseline="middle" >复测证据</text><text x="32" y="444" font-size="14" font-weight="500" fill="#5E6A66" text-anchor="start" dominant-baseline="middle" >状态、来源与恢复动作</text><text x="32" y="462" font-size="16" font-weight="500" fill="#5E6A66" text-anchor="start" dominant-baseline="middle" >• 通过：—</text><text x="32" y="494" font-size="16" font-weight="500" fill="#5E6A66" text-anchor="start" dominant-baseline="middle" >• 失败：—</text><text x="32" y="526" font-size="16" font-weight="500" fill="#5E6A66" text-anchor="start" dominant-baseline="middle" >• 未执行：—</text><rect x="28" y="542" width="126" height="44" rx="22" fill="#EAF2FF" stroke="#EAF2FF" /><text x="91" y="565" font-size="16" font-weight="650" fill="#2563EB" text-anchor="middle" dominant-baseline="middle" >查看详情</text><rect x="166" y="542" width="126" height="44" rx="22" fill="#EEF1F5" stroke="#EEF1F5" /><text x="229" y="565" font-size="16" font-weight="650" fill="#3347B8" text-anchor="middle" dominant-baseline="middle" >导出查询</text><rect x="12" y="602" width="296" height="40" rx="10" fill="#FFF4E8" stroke="#8A3F00" /><text x="24" y="622" font-size="14" font-weight="650" fill="#8A3F00" text-anchor="start" dominant-baseline="middle" >零写：无批准、发布、修复或 Git 写入口</text><rect x="0" y="650" width="320" height="70" rx="0" fill="#FFFFFF" stroke="#D8DFE3" /><g role="img" aria-label="总览" data-mobile-nav-label="总览"><circle cx="40" cy="674" r="5" fill="#475467"/><text x="40" y="697" font-size="14" font-weight="500" fill="#5E6A66" text-anchor="middle" dominant-baseline="middle" >总览</text></g><g role="img" aria-label="项目" data-mobile-nav-label="项目"><circle cx="120" cy="6