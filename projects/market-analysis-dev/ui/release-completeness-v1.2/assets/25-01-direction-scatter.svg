<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc" ><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}*{shape-rendering:geometricPrecision;text-rendering:optimizeLegibility}</style><title id="title">25-01-direction-scatter.svg</title><desc id="desc">Frontend Career Radar CR-UI-002 v1.2 机器可复核设计原型</desc><rect x="0" y="0" width="1440" height="1024" rx="0" fill="#F6F8FA" stroke="#F6F8FA" /><text x="32" y="24" font-size="28" fill="#17212B" font-weight="800" text-anchor="start" dominant-baseline="hanging" >图表 01 · 方向坐标图</text><text x="32" y="62" font-size="14" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >页面 01 · 解释方向差异</text><rect x="32" y="96" width="1376" height="48" rx="8" fill="#FDECEF" stroke="#FDECEF" /><text x="52" y="111" font-size="14" fill="#B4233C" font-weight="750" text-anchor="start" dominant-baseline="hanging" >研究清单已批准 · 来源 0 · connector 0 · 招聘实例 0</text><text x="1400" y="111" font-size="13" fill="#B4233C" font-weight="700" text-anchor="end" dominant-baseline="hanging" >CR-UI-002 v1.2</text><rect x="32" y="164" width="345" height="30" rx="15" fill="#EAF1FF" stroke="#EAF1FF" /><text x="204.5" y="171" font-size="13" fill="#1D4ED8" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >方向：全部；证据截止：2026-08-03</text><rect x="32" y="210" width="1376" height="84" rx="10" fill="#FFFFFF" stroke="#C8D0DA" /><text x="50" y="226" font-size="17" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >坐标、单位与图例</text><text x="50" y="255" font-size="13" fill="#475467" font-weight="450" text-anchor="start" dominant-baseline="hanging" >X=协作深度；Y=专项深度；单位=解释坐标　｜　圆大小=证据数；描边=置信度</text><rect x="54" y="300" width="820" height="350" rx="8" fill="#FBFCFD" stroke="#C8D0DA" /><text x="72" y="316" font-size="14" fill="#475467" font-weight="700" text-anchor="start" dominant-baseline="hanging" >图形区</text><line x1="134" y1="600" x2="834" y2="600" stroke="#475467" stroke-width="2" /><line x1="134" y1="600" x2="134" y2="370" stroke="#475467" stroke-width="2" /><circle cx="304" cy="520" r="14" fill="#FFFFFF" stroke="#0B6B63" stroke-width="3" /><circle cx="534" cy="430" r="19" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="3" /><circle cx="724" cy="490" r="11" fill="#FFFFFF" stroke="#8A4B08" stroke-width="3" /><rect x="900" y="300" width="508" height="350" rx="10" fill="#FFFFFF" stroke="#C8D0DA" /><text x="918" y="316" font-size="17" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >空态</text><text x="918" y="345" font-size="13" fill="#475467" font-weight="450" text-anchor="start" dominant-baseline="hanging" >相同筛选下必须有独立空态，不用 0 冒充未知</text><rect x="924" y="372" width="460" height="126" rx="8" fill="#EEF1F4" stroke="#C8D0DA" /><text x="1154" y="396" font-size="16" fill="#17212B" font-weight="750" text-anchor="middle" dominant-baseline="hanging" >当前条件下无可绘制数据</text><text x="1154" y="432" font-size="14" fill="#475467" font-weight="550" text-anchor="middle" dominant-baseline="hanging" >显示筛选、样本集合、来源覆盖与重置入口</text><rect x="1078" y="516" width="152" height="48" rx="8" fill="#FFFFFF" stroke="#C8D0DA" data-touch-target="true" data-touch-height="48"/><text x="1154" y="533" font-size="14" fill="#17212B" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >重置筛选</text><rect x="32" y="680" width="1376" height="294" rx="10" fill="#FFFFFF" stroke="#C8D0DA" /><text x="50" y="696" font-size="17" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >完整等价表</text><text x="50" y="725" font-size="13" fill="#475467" font-weight="450" text-anchor="start" dominant-baseline="hanging" >字段、关键值、状态和限制均可键盘读取；表格不是只写“查看数据表”的占位</text><text x="54" y="750" font-size="13" fill="#475467" font-weight="750" text-anchor="start" dominant-baseline="hanging" >方向</text><text x="318" y="750" font-size="13" fill="#475467" font-