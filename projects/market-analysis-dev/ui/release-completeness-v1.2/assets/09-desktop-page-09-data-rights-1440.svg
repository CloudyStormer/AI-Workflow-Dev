<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc" ><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}*{shape-rendering:geometricPrecision;text-rendering:optimizeLegibility}</style><title id="title">09-desktop-page-09-data-rights-1440.svg</title><desc id="desc">Frontend Career Radar CR-UI-002 v1.2 机器可复核设计原型</desc><rect x="0" y="0" width="1440" height="1024" rx="0" fill="#F6F8FA" stroke="#F6F8FA" /><text x="32" y="24" font-size="28" fill="#17212B" font-weight="800" text-anchor="start" dominant-baseline="hanging" >09 账号与数据权利</text><text x="32" y="62" font-size="14" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >目标态演示 · 当前未接通；账号边界、双导出和跨账号零可见性必须显式可见。</text><rect x="32" y="96" width="1376" height="48" rx="8" fill="#FDECEF" stroke="#FDECEF" /><text x="52" y="111" font-size="14" fill="#B4233C" font-weight="750" text-anchor="start" dominant-baseline="hanging" >演示数据 · 用户提供 · 目标态演示 · 当前未接通</text><text x="1400" y="111" font-size="13" fill="#B4233C" font-weight="700" text-anchor="end" dominant-baseline="hanging" >CR-UI-002 v1.2</text><rect x="32" y="166" width="430" height="300" rx="10" fill="#FFFFFF" stroke="#C8D0DA" /><text x="50" y="182" font-size="17" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >登录与退出状态</text><text x="50" y="211" font-size="13" fill="#475467" font-weight="450" text-anchor="start" dominant-baseline="hanging" >游客只读公共研究；登录后才有私有能力</text><text x="54" y="238" font-size="16" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >游客</text><text x="150" y="238" font-size="14" fill="#475467" font-weight="600" text-anchor="start" dominant-baseline="hanging" >私有数据不可见</text><rect x="54" y="280" width="150" height="48" rx="8" fill="#0B6B63" stroke="#0B6B63" data-touch-target="true" data-touch-height="48"/><text x="129" y="297" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >登录账号</text><text x="54" y="350" font-size="15" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >当前账号 A · user-a@example.test</text><rect x="54" y="390" width="150" height="48" rx="8" fill="#FFFFFF" stroke="#C8D0DA" data-touch-target="true" data-touch-height="48"/><text x="129" y="407" font-size="14" fill="#17212B" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >退出登录</text><rect x="482" y="166" width="454" height="300" rx="10" fill="#FFFFFF" stroke="#C8D0DA" /><text x="500" y="182" font-size="17" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >A / B 账号切换</text><text x="500" y="211" font-size="13" fill="#475467" font-weight="450" text-anchor="start" dominant-baseline="hanging" >切换前显示影响；私有内容不跨账号泄露</text><rect x="504" y="238" width="210" height="30" rx="15" fill="#E7F5EE" stroke="#E7F5EE" /><text x="609" y="245" font-size="13" fill="#067647" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >账号 A · 3 条私有证据</text><rect x="504" y="286" width="176" height="48" rx="8" fill="#FFFFFF" stroke="#C8D0DA" data-touch-target="true" data-touch-height="48"/><text x="592" y="303" font-size="14" fill="#17212B" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >切换到账号 B</text><rect x="504" y="354" width="410" height="84" rx="8" fill="#FDECEF" stroke="#B4233C" data-cross-account-proof="zero-visible"/><text x="524" y="370" font-size="16" fill="#B4233C" font-weight="800" text-anchor="start" dominant-baseline="hanging" >账号 B 私有可见记录：0</text><text x="524" y="400" font-size="14" fill="#B4233C" font-weight="650" text-anchor="start" dominant-baseline="hanging" >账号 A 的 3 条记录在 B 中不可见</text><rect x="956" y="166" width="452" height="300" rx="10" fill="#FFFFFF" stroke="#C8D0DA" /><text x="974" y="182" font-size="17" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >设备与同步</text><text x="974" y="211" font-size="13" fill="#475467" font-weight="450" text-anchor="start" dominant-baseline="hanging" >目标态能力，不代表当前服务已接通</text><text x="978" y="238" font-size="15" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >设备：Mac A / Windows B</text><text x="978" y="278" font-size="14" fill="#475467" font-weight="600" text-anchor="start" dominant-baseline="hanging" >最近成功同步：—</text><rect x="978" y="318" width="160" height="30" rx="15" fill="#FDECEF" stroke="#FDECEF" /><text x="1058" y="325" font-size="13" fill="#B4233C" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >同步尚未接通</text><text x="978" y="366" font-size="14" fill="#475467" font-weight="550" text-anchor="start" dominant-baseline="hanging" >目标：两在线设备下一次成功同步后 10 秒内收敛</text><rect x="32" y="490" width="904" height="250" rx="10" fill="#FFFFFF" stroke="#C8D0DA" /><text x="50" y="506" font-size="17" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >两种导出必须同时可获得</text><text x="50" y="535" font-size="13" fill="#475467" font-weight="450" text-anchor="start" dominant-baseline="hanging" >不是互斥单选；两个独立下载入口可分别触发</text><rect x="54" y="566" width="410" height="122" rx="8" fill="#FFFFFF" stroke="#C8D0DA" /><text x="74" y="586" font-size="16" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >人类可读摘要</text><text x="74" y="618" font-size="14" fill="#475467" font-weight="550" text-anchor="start" dominant-baseline="hanging" >PDF/HTML · 范围、版本、生成时间</text><rect x="252" y="626" width="192" height="48" rx="8" fill="#0B6B63" stroke="#0B6B63" data-touch-target="true" data-touch-height="48"/><text x="348" y="643" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >下载人类可读摘要</text><rect x="484" y="566" width="430" height="122" rx="8" fill="#FFFFFF" stroke="#C8D0DA" /><text x="504" y="586" font-size="16" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >机器可读数据</text><text x="504" y="618" font-size="14" fill="#475467" font-weight="550" text-anchor="start" dominant-baseline="hanging" >JSON/CSV · 字段说明与版本</text><rect x="704" y="626" width="190" height="48" rx="8" fill="#FFFFFF" stroke="#C8D0DA" data-touch-target="true" data-touch-height="48"/><text x="799" y="643" font-size="14" fill="#17212B" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >下载机器可读数据</text><rect x="956" y="490" width="452" height="250" rx="10" fill="#FFFFFF" stroke="#C8D0DA" /><text x="974" y="506" font-size="17" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >第三方处理记录</text><text x="974" y="535" font-size="13" fill="#475467" font-weight="450" text-anchor="start" dominant-baseline="hanging" >未授权时发送次数为 0</text><text x="978" y="570" font-size="15" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >接收方：无</text><text x="978" y="606" font-size="15" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >已发送字段：0</text><text x="978" y="642" font-size="14" fill="#475467" font-weight="600" text-anchor="start" dominant-baseline="hanging" >本次明确同意：未提供</text><rect x="32" y="764" width="1376" height="216" rx="10" fill="#FFFFFF" stroke="#C8D0DA" /><text x="50" y="780" font-size="17" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >删除与恢复语义</text><text x="50" y="809" font-size="13" fill="#475467" font-weight="450" text-anchor="start" dominant-baseline="hanging" >单条证据删除先展示重算影响；账号删除为独立危险流程，默认焦点在取消</text><text x="54" y="838" font-size="15" fill="#B4233C" font-weight="700" text-anchor="start" dominant-baseline="hanging" >活动数据目标 24 小时内删除 · 备份最长 30 天到期 · 删除后登录立即失效</text><rect x="54" y="888" width="180" height="48" rx="8" fill="#FFFFFF" stroke="#C8D0DA" data-touch-target="true" data-touch-height="48"/><text x="144" y="905" font-size="14" fill="#17212B" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >取消（默认焦点）</text><rect x="250" y="888" width="166" height="48" rx="8" fill="#FFFFFF" stroke="#C8D0DA" data-touch-target="true" data-touch-height="48"/><text x="333" y="905" font-size="14" fill="#17212B" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >删除单条证据</text><rect x="432" y="888" width="150" height="48" rx="8" fill="#FFFFFF" stroke="#C8D0DA" data-touch-target="true" data-touch-height="48"/><text x="507" y="905" font-size="14" fill="#17212B" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >删除账号…</text></svg>