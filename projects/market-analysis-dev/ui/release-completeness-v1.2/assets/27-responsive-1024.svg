</style><title id="title">27-responsive-1024.svg</title><desc id="desc">Frontend Career Radar CR-UI-002 v1.2 可复核设计原型</desc><rect x="0" y="0" width="1440" height="1024" rx="0" fill="#F6F8FA" stroke="#F6F8FA" /><text x="32" y="24" font-size="28" fill="#17212B" font-weight="780" text-anchor="start" dominant-baseline="hanging" >响应式证据 · 1024×768</text><text x="32" y="60" font-size="13" fill="#475467" font-weight="450" text-anchor="start" dominant-baseline="hanging" >折叠侧栏、上下布局、组件内滚动与等价列表。</text><rect x="62" y="118" width="1024" height="768" rx="12" fill="#FFFFFF" stroke="#0B2526" stroke-width="3"/><rect x="62" y="118" width="64" height="768" rx="0" fill="#F9FAFB" stroke="#D0D7DE" /><text x="144" y="142" font-size="22" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >04 来源与质量</text><rect x="144" y="186" width="920" height="64" rx="7" fill="#FDECEF" stroke="#FDECEF" /><text x="164" y="206" font-size="13" fill="#B4233C" font-weight="700" text-anchor="start" dominant-baseline="hanging" >当前真实：研究清单已批准 · 运行时来源 0 · connector 0 · 招聘实例 0</text><rect x="144" y="272" width="920" height="250" rx="8" fill="#FFFFFF" stroke="#D0D7DE" /><text x="166" y="292" font-size="16" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >来源政策×运行时矩阵</text><text x="166" y="332" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >组件内部允许横向滚动；页面整体不横滚</text><rect x="166" y="370" width="876" height="112" rx="6" fill="#F9FAFB" stroke="#D0D7DE" /><text x="184" y="390" font-size="12" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" >官方技术端点（13）　允许　未配置　最近成功 —</text><text x="184" y="430" font-size="12" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" >ATS 条件模板（3）　conditional　未配置　招聘实例 0</text><rect x="144" y="544" width="920" height="300" rx="8" fill="#FFFFFF" stroke="#D0D7DE" /><text x="166" y="566" font-size="16" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >等价列表</text><text x="166" y="608" font-size="14" fill="#17212B" font-weight="500" text-anchor="start" dominant-baseline="hanging" >来源身份 / 政策 / 运行时 / 权利条件 / 最近成功 / 失败原因</text><text x="166" y="627.88" font-size="14" fill="#17212B" font-weight="500" text-anchor="start" dominant-baseline="hanging" >图形与详情上下排列；焦点顺序保持标题→筛选→矩阵→列表。</text><text x="166" y="647.76" font-size="14" fill="#17212B" font-weight="500" text-anchor="start" dominant-baseline="hanging" >1024×768 逻辑视口，无内容遮挡，无整页横向滚动。</text><text x="1120" y="140" font-size="13" fill="#475467" font-weight="600" text-anchor="start" dominant-baseline="hanging" >实际导出画板 1440×1024；内部 1024×768 框按 1:1 CSS 逻辑像素绘制。</text></svg>