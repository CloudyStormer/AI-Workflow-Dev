<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc" ><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}*{shape-rendering:geometricPrecision;text-rendering:optimizeLegibility}</style><title id="title">25-09-dual-classification.svg</title><desc id="desc">Frontend Career Radar CR-UI-002 v1.2 机器可复核设计原型</desc><rect x="0" y="0" width="1440" height="1024" rx="0" fill="#F6F8FA" stroke="#F6F8FA" /><text x="32" y="24" font-size="28" fill="#17212B" font-weight="800" text-anchor="start" dominant-baseline="hanging" >图表 09 · 双轴分类面板</text><text x="32" y="62" font-size="14" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >页面 05 · 渠道与内容类型独立确认</text><rect x="32" y="96" width="1376" height="48" rx="8" fill="#FDECEF" stroke="#FDECEF" /><text x="52" y="111" font-size="14" fill="#B4233C" font-weight="750" text-anchor="start" dominant-baseline="hanging" >演示数据 · 用户提供</text><text x="1400" y="111" font-size="13" fill="#B4233C" font-weight="700" text-anchor="end" dominant-baseline="hanging" >CR-UI-002 v1.2</text><rect x="32" y="164" width="240" height="30" rx="15" fill="#EAF1FF" stroke="#EAF1FF" /><text x="152" y="171" font-size="13" fill="#1D4ED8" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >候选：当前输入；状态：待确认</text><rect x="32" y="210" width="1376" height="84" rx="10" fill="#FFFFFF" stroke="#C8D0DA" /><text x="50" y="226" font-size="17" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >坐标、单位与图例</text><text x="50" y="255" font-size="13" fill="#475467" font-weight="450" text-anchor="start" dominant-baseline="hanging" >左=来源渠道；右=内容类型　｜　建议/候选/人工确认用形状+文字</text><rect x="54" y="300" width="820" height="350" rx="8" fill="#FBFCFD" stroke="#C8D0DA" /><text x="72" y="316" font-size="14" fill="#475467" font-weight="700" text-anchor="start" dominant-baseline="hanging" >图形区</text><rect x="1