anging" >10 质量与恢复</text><text x="238" y="22" font-size="28" fill="#17212B" font-weight="760" text-anchor="start" dominant-baseline="hanging" >10 质量、刷新与恢复</text><text x="238" y="56" font-size="13" fill="#475467" font-weight="450" text-anchor="start" dominant-baseline="hanging" >真实状态优先；静态回退不能证明任何运行时能力。</text><rect x="226" y="78" width="1190" height="42" rx="7" fill="#FDECEF" stroke="#FDECEF" /><text x="244" y="90" font-size="13" fill="#B4233C" font-weight="800" text-anchor="start" dominant-baseline="hanging" >当前真实状态</text><text x="445" y="90" font-size="13" fill="#B4233C" font-weight="650" text-anchor="start" dominant-baseline="hanging" >研究清单已批准 · 运行时来源 0 · connector 0 · 招聘实例 0</text><text x="1210" y="90" font-size="12" fill="#B4233C" font-weight="700" text-anchor="start" dominant-baseline="hanging" >禁止冒充实时</text><rect x="244" y="140" width="160" height="28" rx="14" fill="#FDECEF" stroke="#FDECEF" /><text x="324" y="146" font-size="12" fill="#B4233C" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >当前状态：未就绪</text><rect x="416" y="140" width="140" height="28" rx="14" fill="#EAF1FF" stroke="#EAF1FF" /><text x="486" y="146" font-size="12" fill="#1D4ED8" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >静态内容可读</text><text x="570" y="147" font-size="13" fill="#B4233C" font-weight="700" text-anchor="start" dominant-baseline="hanging" >可读不等于服务健康、数据就绪或来源最新</text><rect x="240" y="190" width="1176" height="420" rx="10" fill="#FFFFFF" stroke="#D0D7DE" /><text x="258" y="206" font-size="16" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >健康、就绪与能力分离</text><text x="258" y="233" font-size="12" fill="#475467" font-weight="400" text-anchor="start" dominant-baseline="hanging" >全部用户可见状态使用简体中文；内部键仅作括注</text><text x="264" y="270" font-size="13" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >服务健康</text><rect x="472" y="264" width="210" height="28" rx="14" fill="#FDECEF" stroke="#FDECEF