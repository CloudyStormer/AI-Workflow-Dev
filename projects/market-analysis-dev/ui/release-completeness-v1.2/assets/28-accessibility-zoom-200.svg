<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc" ><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}*{shape-rendering:geometricPrecision;text-rendering:optimizeLegibility}</style><title id="title">28-accessibility-zoom-200.svg</title><desc id="desc">Frontend Career Radar CR-UI-002 v1.2 机器可复核设计原型</desc><rect x="0" y="0" width="1440" height="1024" rx="0" fill="#F6F8FA" stroke="#F6F8FA" /><text x="32" y="24" font-size="28" fill="#17212B" font-weight="800" text-anchor="start" dominant-baseline="hanging" >无障碍证据 · 真正 200% 文本与组件放大</text><text x="32" y="62" font-size="14" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >基准与放大后使用同一 720×900 CSS 逻辑视口；放大后单栏回流，无整页横滚或遮挡。</text><rect x="32" y="96" width="1376" height="48" rx="8" fill="#FDECEF" stroke="#FDECEF" /><text x="52" y="111" font-size="14" fill="#B4233C" font-weight="750" text-anchor="start" dominant-baseline="hanging" >演示数据 · 用户提供</text><text x="1400" y="111" font-size="13" fill="#B4233C" font-weight="700" text-anchor="end" dominant-baseline="hanging" >CR-UI-002 v1.2</text><rect x="32" y="166" width="650" height="808" rx="10" fill="#FFFFFF" stroke="#C8D0DA" /><text x="50" y="182" font-size="17" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >100% 基准</text><text x="50" y="211" font-size="13" fill="#475467" font-weight="450" text-anchor="start" dominant-baseline="hanging" >逻辑视口 720×900；正文 16px；触控 44px</text><rect x="54" y="230" width="606" height="690" rx="8" fill="#FFFFFF" stroke="#C8D0DA" /><text x="78" y="256" font-size="24" fill="#17212B" font-weight="800" text-anchor="start" dominant-baseline="hanging" >07 差距与成长路线</text><text x="78" y="300" font-size="16" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" >目标或证据不足，当前差距保持未知。</text><rect x="78" y="346" width="260" height="110" rx="8" fill="