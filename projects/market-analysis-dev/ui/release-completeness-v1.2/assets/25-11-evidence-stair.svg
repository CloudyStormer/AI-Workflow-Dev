<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc" ><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}*{shape-rendering:geometricPrecision;text-rendering:optimizeLegibility}</style><title id="title">25-11-evidence-stair.svg</title><desc id="desc">Frontend Career Radar CR-UI-002 v1.2 机器可复核设计原型</desc><rect x="0" y="0" width="1440" height="1024" rx="0" fill="#F6F8FA" stroke="#F6F8FA" /><text x="32" y="24" font-size="28" fill="#17212B" font-weight="800" text-anchor="start" dominant-baseline="hanging" >图表 11 · 证据阶梯</text><text x="32" y="62" font-size="14" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >页面 06 · 证据类型不是人的等级</text><rect x="32" y="96" width="1376" height="48" rx="8" fill="#FDECEF" stroke="#FDECEF" /><text x="52" y="111" font-size="14" fill="#B4233C" font-weight="750" text-anchor="start" dominant-baseline="hanging" >演示数据 · 用户提供</text><text x="1400" y="111" font-size="13" fill="#B4233C" font-weight="700" text-anchor="end" dominant-baseline="hanging" >CR-UI-002 v1.2</text><rect x="32" y="164" width="240" height="30" rx="15" fill="#EAF1FF" stroke="#EAF1FF" /><text x="152" y="171" font-size="13" fill="#1D4ED8" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >目标方向：产品型；状态：全部</text><rect x="32" y="210" width="1376" height="84" rx="10" fill="#FFFFFF" stroke="#C8D0DA" /><text x="50" y="226" font-size="17" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >坐标、单位与图例</text><text x="50" y="255" font-size="13" fill="#475467" font-weight="450" text-anchor="start" dominant-baseline="hanging" >阶梯=阅读→练习→项目→生产→同行审查　｜　高度=可核验性层次，不是个人得分</text><rect x="54" y="300" width="820" height="350" rx="8" fill="#FBFCFD" stroke="#C8D0DA" /><text x="72" y="316" font-size="14" fill="#475467" font-weight="700" text-anchor="start" dominant-baseline="hanging" >图形区</text><rect x="124" y="560" width="118" height="40" rx="5" fill="#EEF1F4" stroke="#C8D0DA" /><text x="183" y="570" font-size="14" fill="#17212B" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >1</text><rect x="264" y="512" width="118" height="40" rx="5" fill="#EEF1F4" stroke="#C8D0DA" /><text x="323" y="522" font-size="14" fill="#17212B" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >2</text><rect x="404" y="464" width="118" height="40" rx="5" fill="#EEF1F4" stroke="#C8D0DA" /><text x="463" y="474" font-size="14" fill="#17212B" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >3</text><rect x="544" y="416" width="118" height="40" rx="5" fill="#E8F5F2" stroke="#0B6B63" /><text x="603" y="426" font-size="14" fill="#17212B" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >4</text><rect x="684" y="368" width="118" height="40" rx="5" fill="#E8F5F2" stroke="#0B6B63" /><text x="743" y="378" font-size="14" fill="#17212B" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >5</text><rect x="900" y="300" width="508" height="350" rx="10" fill="#FFFFFF" stroke="#C8D0DA" /><text x="918" y="316" font-size="17" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >空态</text><text x="918" y="345" font-size="13" fill="#475467" font-weight="450" text-anchor="start" dominant-baseline="hanging" >相同筛选下必须有独立空态，不用 0 冒充未知</text><rect x="924" y="372" width="460" height="126" rx="8" fill="#EEF1F4" stroke="#C8D0DA" /><text x="1154" y="396" font-size="16" fill="#17212B" font-weight="750" text-anchor="middle" dominant-baseline="hanging" >当前条件下无可绘制数据</text><text x="1154" y="432" font-size="14" fill="#475467" font-weight="550" text-anchor="middle" dominant-baseline="hanging" >显示筛选、样本集合、来源覆盖与重置入口</text><rect x="1078" y="516" width="152" height="48" rx="8" fill="#FFFFFF" stroke="#C8D0DA" data-touch-target="true" data-touch-height="48"/><text x="1154" y="533" font-size="14" fill="#17212B" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >重置筛选</text><rect x="32" y="680" width="1376" height="294" rx="10" fill="#FFFFFF" stroke="#C8D0DA" /><text x="50" y="696" font-size="17" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >完整等价表</text><text x="50" y="725" font-size="13" fill="#475467" font-weight="450" text-anchor="start" dominant-baseline="hanging" >字段、关键值、状态和限制均可键盘读取；表格不是只写“查看数据表”的占位</text><text x="54" y="750" font-size="13" fill="#475467" font-weight="750" text-anchor="start" dominant-baseline="hanging" >证据类型</text><text x="384" y="750" font-size="13" fill="#475467" font-weight="750" text-anchor="start" dominant-baseline="hanging" >可核验材料</text><text x="714" y="750" font-size="13" fill="#475467" font-weight="750" text-anchor="start" dominant-baseline="hanging" >能否证明掌握</text><text x="1044" y="750" font-size="13" fill="#475467" font-weight="750" text-anchor="start" dominant-baseline="hanging" >状态</text><line x1="52" y1="780" x2="1386" y2="780" stroke="#C8D0DA" stroke-width="1" /><text x="54" y="808" font-size="13" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >阅读收藏</text><text x="384" y="808" font-size="13" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >记录</text><text x="714" y="808" font-size="13" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >不能</text><text x="1044" y="808" font-size="13" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >用户自述</text><line x1="52" y1="838" x2="1386" y2="838" stroke="#C8D0DA" stroke-width="1" /><text x="54" y="866" font-size="13" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >生产结果</text><text x="384" y="866" font-size="13" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >指标+贡献</text><text x="714" y="866" font-size="13" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >需审查</text><text x="1044" y="866" font-size="13" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >可核验</text><line x1="52" y1="896" x2="1386" y2="896" stroke="#C8D0DA" stroke-width="1" /></svg>