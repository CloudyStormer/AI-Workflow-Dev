</style><title id="title">12-flow-02-evidence-confirmation.svg</title><desc id="desc">Frontend Career Radar CR-UI-002 v1.2 可复核设计原型</desc><rect x="0" y="0" width="1440" height="1024" rx="0" fill="#F6F8FA" stroke="#F6F8FA" /><text x="32" y="24" font-size="28" fill="#17212B" font-weight="780" text-anchor="start" dominant-baseline="hanging" >流程 02 · 个人证据确认</text><text x="32" y="60" font-size="13" fill="#475467" font-weight="450" text-anchor="start" dominant-baseline="hanging" >1440×1024 逻辑画板 · 完整简体中文 · 可恢复交互</text><rect x="32" y="104" width="1376" height="72" rx="10" fill="#FFFFFF" stroke="#D0D7DE" /><text x="54" y="124" font-size="13" fill="#475467" font-weight="700" text-anchor="start" dominant-baseline="hanging" >流程边界</text><text x="150" y="124" font-size="14" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" >用户确认 ≠ 外部核验；冲突项先裁决</text><circle cx="60" cy="322" r="26" fill="#0B6B63" stroke="#0B6B63" stroke-width="3"/><text x="60" y="313" font-size="14" fill="#FFFFFF" font-weight="800" text-anchor="middle" dominant-baseline="hanging" >1</text><text x="60" y="368" font-size="13" fill="#17212B" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >候选证据</text><text x="60" y="394" font-size="11" fill="#475467" font-weight="500" text-anchor="middle" dominant-baseline="hanging" >用户自述</text><line x1="88" y1="322" x2="296" y2="322" stroke="#D0D7DE" stroke-width="3" /><circle cx="324" cy="322" r="26" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="3"/><text x="324" y="313" font-size="14" fill="#1D4ED8" font-weight="800" text-anchor="middle" dominant-baseline="hanging" >2</text><text x="324" y="368" font-size="13" fill="#17212B" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >逐条查看</text><text x="324" y="394" font-size="11" fill="#475467" font-weight="500" text-anchor="middle" dominant-baseline="hanging" >依据/时间</text><line x1="352" y1="322" x2="560" y2="322" stroke="#D0D7DE" stroke-width="3" /><circle cx="588" cy="322" r="26" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="3"/><text x="588" y="313" font-size="14" fill="#1D4ED8" font-weight="800" text-anchor="middle" dominant-baseline="hanging" >3</text><text x="588" y="368" font-size="13" fill="#17212B" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >接受/编辑</text><text x="588" y="394" font-size="11" fill="#475467" font-weight="500" text-anchor="middle" dominant-baseline="hanging" >不批量隐藏</text><line x1="616" y1="322" x2="824" y2="322" stroke="#D0D7DE" stroke-width="3" /><circle cx="852" cy="322" r="26" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="3"/><text x="852" y="313" font-size="14" fill="#1D4ED8" font-weight="800" text-anchor="middle" dominant-baseline="hanging" >4</text><text x="852" y="368" font-size="13" fill="#17212B" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >拒绝/未知</text><text x="852" y="394" font-size="11" fill="#475467" font-weight="500" text-anchor="middle" dominant-baseline="hanging" >不支持结论</text><line x1="880" y1="322" x2="1088" y2="322" stroke="#D0D7DE" stroke-width="3" /><circle cx="1116" cy="322" r="26" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="3"/><text x="1116" y="313" font-size="14" fill="#1D4ED8" font-weight="800" text-anchor="middle" dominant-baseline="hanging" >5</text><text x="1116" y="368" font-size="13" fill="#17212B" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >版本形成</text><text x="1116" y="394" font-size="11" fill="#475467" font-weight="500" text-anchor="middle" dominant-baseline="hanging" >保留历史</text><line x1="1144" y1="322" x2="1352" y2="322" stroke="#D0D7DE" stroke-width="3" /><circle cx="1380" cy="322" r="26" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="3"/><text x="1380" y="313" font-size="14" fill="#1D4ED8" font-weight="800" text-anchor="middle" dominant-baseline="hanging" >6</text><text x="1380" y="368" font-size="13" fill="#17212B" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >影响预览</text><text x="1380" y="394" font-size="11" fill="#475467" font-weight="500" text-anchor="middle" dominant-baseline="hanging" >再决定重算</text><rect x="80" y="520" width="1280" height="320" rx="10" fill="#FFFFFF" stroke="#D0D7DE" /><text x="98" y="536" font-size="16" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >状态与恢复</text><text x="98" y="563" font-size="12" fill="#475467" font-weight="400" text-anchor="start" dominant-baseline="hanging" >每一步都能返回、取消、保留输入或查看影响</text><text x="110" y="600" font-size="16" fill="#17212B" font-weight="500" text-anchor="start" dominant-baseline="hanging" >默认 / 焦点 / 加载 / 待确认 / 部分成功 / 失败 / 离线均使用文字+图标+形状。</text><text x="110" y="622.72" font-size="16" fill="#17212B" font-weight="500" text-anchor="start" dominant-baseline="hanging" >失败后只重试失败区域；已确认内容不得重复写入；危险操作默认焦点在取消。</text><text x="110" y="645.44" font-size="16" fill="#17212B" font-weight="500" text-anchor="start" dominant-baseline="hanging" >键盘与读屏按阶段播报，不逐字播报字符数。</text></svg>