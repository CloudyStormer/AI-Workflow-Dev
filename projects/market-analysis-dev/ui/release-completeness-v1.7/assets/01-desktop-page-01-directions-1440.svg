<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="a11y-title-01-desktop-page-01-directions-1440 a11y-desc-01-desktop-page-01-directions-1440" ><title id="a11y-title-01-desktop-page-01-directions-1440">职业方向总览桌面页面</title><desc id="a11y-desc-01-desktop-page-01-directions-1440">前端职业成长雷达发布完整性第七次修订：职业方向总览桌面页面。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}*{shape-rendering:geometricPrecision;text-rendering:optimizeLegibility}</style><rect x="0" y="0" width="1440" height="1024" rx="0" fill="#F6F8FA" stroke="#F6F8FA" /><text x="32" y="24" font-size="28" fill="#17212B" font-weight="800" text-anchor="start" dominant-baseline="hanging" >01 职业方向总览</text><text x="32" y="62" font-size="14" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >二维解释坐标只用于理解差异，不表示好坏、热度或个人适配度。</text><rect x="32" y="96" width="1376" height="48" rx="8" fill="#FDECEF" stroke="#FDECEF" /><text x="52" y="111" font-size="14" fill="#B4233C" font-weight="750" text-anchor="start" dominant-baseline="hanging" >研究清单已批准 · 来源 0 · 连接器 0 · 招聘实例 0</text><text x="1400" y="111" font-size="13" fill="#B4233C" font-weight="700" text-anchor="end" dominant-baseline="hanging" >CR-UI-002 v1.7</text><rect x="32" y="166" width="968" height="650" rx="10" fill="#FFFFFF" stroke="#C8D0DA" /><text x="50" y="182" font-size="17" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >8 个职业方向 · 二维解释坐标</text><text x="50" y="211" font-size="13" fill="#475467" font-weight="450" text-anchor="start" dominant-baseline="hanging" >X：产品交付协作深度；Y：平台／体验专项深度；节点大小：直接证据数；描边：置信度</text><g id="direction-plot" data-left="250" data-top="190" data-right="980" data-bottom="780" data-right-panel-left="1020"><line x1="250" y1="750" x2="950" y2="750" stroke="#475467" stroke-width="2" /><line x1="250" y1="750" x2="250" y2="235" stroke="#475467" stroke-width="2" /><text x="610" y="770" font-size="14" fill="#475467" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >产品交付协作深度 →</text><text x="200" y="500" font-size="14" fill="#475467" font-weight="650" text-anchor="middle" dominant-baseline="hanging" transform="rotate(-90 200 500)">平台／体验专项深度</text><g data-direction-node="product" data-x="430" data-y="650" data-label-x="455" data-label-width="180"><circle cx="430" cy="650" r="10" fill="#FFFFFF" stroke="#0B6B63" stroke-width="3" /><text x="455" y="640" font-size="13" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >产品型前端／应用工程</text></g><g data-direction-node="platform" data-x="520" data-y="310" data-label-x="545" data-label-width="185"><circle cx="520" cy="310" r="13" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="3" /><text x="545" y="300" font-size="13" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >平台／设计系统／DevEx</text></g><g data-direction-node="ai" data-x="790" data-y="560" data-label-x="605" data-label-width="180"><circle cx="790" cy="560" r="16" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="3" /><text x="605" y="550" font-size="13" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >AI 应用前端／AI 产品工程</text></g><g data-direction-node="dataviz" data-x="700" data-y="390" data-label-x="720" data-label-width="175"><circle cx="700" cy="390" r="10" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="3" /><text x="720" y="380" font-size="13" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >数据可视化／实时交互</text></g><g data-direction-node="cross" data-x="600" data-y="530" data-label-x="620" data-label-width="150"><circle cx="600" cy="530" r="13" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="3" /><text x="620" y="520" font-size="13" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >跨端／桌面／移动</text></g><g data-direction-node="fullstack" data-x="350" data-y="500" data-label-x="370" data-label-width="120"><circle cx="350" cy="500" r="16" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="3" /><text x="370" y="490" font-size="13" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >全栈产品协作</text></g><g data-direction-node="quality" data-x="420" data-y="260" data-label-x="440" data-label-width="125"><circle cx="420" cy="260" r="10" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="3" /><text x="440" y="250" font-size="13" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >Web 质量工程</text></g><g data-direction-node="ux" data-x="760" data-y="250" data-label-x="570" data-label-width="185"><circle cx="760" cy="250" r="13" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="3" /><text x="570" y="240" font-size="13" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >用户体验工程／设计开发融合</text></g></g><rect x="1020" y="166" width="388" height="650" rx="10" fill="#FFFFFF" stroke="#C8D0DA" /><text x="1038" y="182" font-size="17" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >方向列表与解释</text><text x="1038" y="211" font-size="13" fill="#475467" font-weight="450" text-anchor="start" dominant-baseline="hanging" >右栏独立边界；图中节点与标签不得侵入</text><rect x="1040" y="240" width="348" height="48" rx="8" fill="#E8F5F2" stroke="#0B6B63" /><text x="1056" y="254" font-size="13" fill="#0B6B63" font-weight="750" text-anchor="start" dominant-baseline="hanging" >01 产品型前端／应用工程</text><rect x="1040" y="304" width="348" height="48" rx="8" fill="#FFFFFF" stroke="#C8D0DA" /><text x="1056" y="318" font-size="13" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >02 平台／设计系统／DevEx</text><rect x="1040" y="368" width="348" height="48" rx="8" fill="#FFFFFF" stroke="#C8D0DA" /><text x="1056" y="382" font-size="13" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >03 AI 应用前端／AI 产品工程</text><rect x="1040" y="432" width="348" height="48" rx="8" fill="#FFFFFF" stroke="#C8D0DA" /><text x="1056" y="446" font-size="13" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >04 数据可视化／实时交互</text><rect x="1040" y="496" width="348" height="48" rx="8" fill="#FFFFFF" stroke="#C8D0DA" /><text x="1056" y="510" font-size="13" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >05 跨端／桌面／移动</text><rect x="1040" y="560" width="348" height="48" rx="8" fill="#FFFFFF" stroke="#C8D0DA" /><text x="1056" y="574" font-size="13" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >06 全栈产品协作</text><rect x="1040" y="624" width="348" height="48" rx="8" fill="#FFFFFF" stroke="#C8D0DA" /><text x="1056" y="638" font-size="13" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >07 Web 质量工程</text><rect x="1040" y="688" width="348" height="48" rx="8" fill="#FFFFFF" stroke="#C8D0DA" /><text x="1056" y="702" font-size="13" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >08 用户体验工程／设计开发融合</text><rect x="32" y="836" width="1376" height="144" rx="10" fill="#FFFFFF" stroke="#C8D0DA" /><text x="50" y="852" font-size="17" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >边界说明</text><text x="50" y="881" font-size="13" fill="#475467" font-weight="450" text-anchor="start" dominant-baseline="hanging" >获批历史研究快照 · 证据截止 2026-08-03 · 不是岗位排名或市场份额</text><text x="54" y="904" font-size="15" fill="#17212B" font-weight="650" text-anchor="start" dominant-baseline="hanging" >选择方向后进入 02 技术栈全景；无个人证据时不自动推荐“最适合你”。</text><rect x="1198" y="884" width="188" height="48" rx="8" fill="#0B6B63" stroke="#0B6B63" data-touch-target="true" data-touch-height="48"/><text x="1292" y="901" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >查看该方向技术栈</text></svg>