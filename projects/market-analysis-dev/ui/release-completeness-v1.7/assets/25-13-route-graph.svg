<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="a11y-title-25-13-route-graph a11y-desc-25-13-route-graph" data-record-count="5" data-chart-id="25-13-route-graph" data-visible-language="zh-CN" data-topology-edge-count="6"><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}*{shape-rendering:geometricPrecision;text-rendering:geometricPrecision}</style><title id="a11y-title-25-13-route-graph">成长路线依赖关系图</title><desc id="a11y-desc-25-13-route-graph">展示用户确认、公共要求、个人证据、三项输入齐全与成长路线之间的真实依赖拓扑；当前所有节点均处于阻断状态。</desc><rect x="0" y="0" width="1440" height="1024" rx="0" fill="#F5F7FA" stroke="#F5F7FA" /><text x="32" y="28" font-size="28" fill="#17212B" font-weight="800" text-anchor="start" dominant-baseline="hanging" >图表 13 · 路线依赖图</text><text x="32" y="72" font-size="14" fill="#475467" font-weight="550" text-anchor="start" dominant-baseline="hanging" >用户确认、公共要求与个人证据共同构成路线生成门禁。</text><rect x="32" y="106" width="1376" height="48" rx="8" fill="#FDECEF" stroke="#B4233C" data-complete-truth-strip="true" data-surface="private"/><text x="50" y="122" font-size="14" fill="#B4233C" font-weight="750" text-anchor="start" dominant-baseline="hanging" >演示数据 · 用户提供 · 非真实用户档案 · 未经授权不外发</text><rect x="32" y="174" width="1376" height="126" rx="10" fill="#FFFFFF" stroke="#B8C2CC" /><text x="52" y="192" font-size="14" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >当前：用户未确认 · 三项输入未齐全 · 成长路线未生成</text><text x="52" y="226" font-size="13" fill="#475467" font-weight="600" text-anchor="start" dominant-baseline="hanging" >节点=输入、门禁与输出 · 虚线边=模型真实依赖</text><text x="52" y="258" font-size="13" fill="#475467" font-weight="600" text-anchor="start" dominant-baseline="hanging" >锁符号+状态文字=当前阻断；虚线=模型依赖关系；三项输入未齐全时不生成路线</text><rect x="32" y="320" width="1376" height="330" rx="10" fill="#FBFCFD" stroke="#B8C2CC" data-chart-kind="route"/><line x1="300" y1="474" x2="360"