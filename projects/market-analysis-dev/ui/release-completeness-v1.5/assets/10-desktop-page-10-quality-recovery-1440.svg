ze="15" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >健康检查：未接通</text><text x="54" y="320" font-size="15" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >数据来源：0 · 连接器：0</text><text x="54" y="354" font-size="15" fill="#475467" font-weight="650" text-anchor="start" dominant-baseline="hanging" >最近成功刷新：—</text><rect x="482" y="170" width="430" height="250" rx="10" fill="#FFFFFF" stroke="#C8D0DA" /><text x="500" y="186" font-size="17" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >当前能力状态</text><text x="500" y="215" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >没有账号服务，不把空白误报为请求失败</text><rect x="504" y="238" width="210" height="30" rx="15" fill="#FDECEF" stroke="#FDECEF" /><text x="609" y="245" font-size="13" fill="#B4233C" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >不可用（不可用）</text><text x="504" y="286" font-size="15" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >账号 / 同步 / 导出服务：不可用</text><text x="504" y="320" font-size="15" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >入口保持禁用并说明原因</text><text x="504" y="354" font-size="15" fill="#475467" font-weight="650" text-anchor="start" dominant-baseline="hanging" >不会显示“重试失败请求”</text><rect x="932" y="170" width="476" height="250" rx="10" fill="#FFFFFF" stroke="#C8D0DA" /><text x="950" y="186" font-size="17" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >失败 的使用门槛</text><text x="950" y="215" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >只有真实请求已经执行并返回失败时使用</text><rect x="954" y="238" width="432" height="116" rx="8" fill="#EEF1F4" stroke="#C8D0DA" data-current-failed="false"/><text x="976" y="258" font-size="15" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >允许呈现的状态示例</text