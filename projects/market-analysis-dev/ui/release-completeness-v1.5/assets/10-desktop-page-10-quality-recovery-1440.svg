e="13" fill="#475467" font-weight="550" text-anchor="start" dominant-baseline="hanging" >显示请求 ID、保留输入和重试</text><rect x="1044" y="530" width="308" height="108" rx="8" fill="#FFFFFF" stroke="#C8D0DA" /><text x="1060" y="548" font-size="16" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >局部成功</text><text x="1060" y="578" font-size="14" fill="#1D4ED8" font-weight="700" text-anchor="start" dominant-baseline="hanging" >部分成功</text><text x="1060" y="606" font-size="13" fill="#475467" font-weight="550" text-anchor="start" dominant-baseline="hanging" >只重试失败分片</text><rect x="32" y="706" width="1376" height="274" rx="10" fill="#FFFFFF" stroke="#C8D0DA" /><text x="50" y="722" font-size="17" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >发布完成门</text><text x="50" y="751" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >静态可读、Mock、HTTP 200 或禁用入口均不等于真实服务完成</text><text x="54" y="780" font-size="16" fill="#17212B" font-weight="650" text-anchor="start" dominant-baseline="hanging" >完成必须同时具备：真实允许来源、运行时 连接器、时间戳/新鲜度、局部失败恢复、可追溯版本。</text><text x="54" y="814" font-size="16" fill="#17212B" font-weight="650" text-anchor="start" dominant-baseline="hanging" >当前结果：0 个运行时来源、0 个 连接器、0 个招聘实例；继续停在设计审查门。</text><rect x="1130" y="874" width="230" height="48" rx="8" fill="#0B6B63" stroke="#0B6B63" data-button-id="page10-state-table" data-touch-rect="true"/><text x="1245" y="890" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >查看状态等价表</text></svg>