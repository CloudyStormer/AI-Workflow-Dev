</style><title id="title">28-accessibility-zoom-200.svg</title><desc id="desc">Frontend Career Radar CR-UI-002 v1.1 可复核设计原型</desc><rect x="0" y="0" width="1440" height="1024" rx="0" fill="#F6F8FA" stroke="#F6F8FA" /><text x="32" y="24" font-size="28" fill="#17212B" font-weight="780" text-anchor="start" dominant-baseline="hanging" >200% 放大检查</text><text x="32" y="60" font-size="13" fill="#475467" font-weight="450" text-anchor="start" dominant-baseline="hanging" >逻辑视口不变，文本放大后按可用宽度重排；不以缩放截图冒充验证。</text><rect x="32" y="110" width="660" height="830" rx="10" fill="#FFFFFF" stroke="#D0D7DE" /><text x="50" y="126" font-size="16" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >100% · 1440 CSS px</text><text x="50" y="153" font-size="12" fill="#475467" font-weight="400" text-anchor="start" dominant-baseline="hanging" >12列 + 220px 侧栏</text><rect x="64" y="176" width="596" height="690" rx="10" fill="#FFFFFF" stroke="#0B2526" /><rect x="64" y="176" width="92" height="690" rx="0" fill="#F9FAFB" stroke="#D0D7DE" /><text x="178" y="202" font-size="18" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >07 差距与成长路线</text><rect x="178" y="242" width="178" height="28" rx="14" fill="#FDECEF" stroke="#FDECEF" /><text x="267" y="248" font-size="12" fill="#B4233C" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >当前差距保持未知</text><rect x="178" y="296" width="450" height="186" rx="8" fill="#F9FAFB" stroke="#D0D7DE" /><text x="204" y="326" font-size="14" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >三项输入并列</text><text x="204" y="372" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >未知时路线不生成</text><rect x="204" y="424" width="128" height="40" rx="8" fill="#0B6B63" stroke="#0B6B63" /><text x="268" y="435" font-size="14" fill="#FFFFFF" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >补充证据</text><rect x="724" y="110" width="684" height="830" rx="10" fill="#FFFFFF" stroke="#D0D7DE" /><text x="742" y="126" font-size="16" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >200% 文本放大</text><text x="742" y="153" font-size="12" fill="#475467" font-weight="400" text-anchor="start" dominant-baseline="hanging" >等效内容宽度约 720 CSS px；重排为单栏</text><rect x="756" y="176" width="620" height="690" rx="10" fill="#FFFFFF" stroke="#0B2526" /><text x="786" y="204" font-size="22" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >07 差距与成长路线</text><rect x="786" y="252" width="220" height="28" rx="14" fill="#FDECEF" stroke="#FDECEF" /><text x="896" y="258" font-size="12" fill="#B4233C" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >当前差距保持未知</text><rect x="786" y="304" width="560" height="122" rx="8" fill="#FFFFFF" stroke="#D0D7DE" /><text x="812" y="328" font-size="16" fill="#17212B" font-weight="650" text-anchor="start" dominant-baseline="hanging" >目标方向／层级：未确认</text><rect x="812" y="368" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#D0D7DE" /><text x="887" y="379" font-size="14" fill="#17212B" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >确认目标</text><rect x="786" y="446" width="560" height="122" rx="8" fill="#FFFFFF" stroke="#D0D7DE" /><text x="812" y="470" font-size="16" fill="#17212B" font-weight="650" text-anchor="start" dominant-baseline="hanging" >个人证据：不足</text><rect x="812" y="510" width="150" height="40" rx="8" fill="#0B6B63" stroke="#0B6B63" /><text x="887" y="521" font-size="14" fill="#FFFFFF" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >补充证据</text><rect x="786" y="588" width="560" height="186" rx="8" fill="#F9FAFB" stroke="#D0D7DE" /><text x="812" y="614" font-size="18" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >路线未生成</text><text x="812" y="658" font-size="14" fill="#475467" font-weight="550" text-anchor="start" dominant-baseline="hanging" >无横向滚动</text><text x="812" y="677.88" font-size="14" fill="#475467" font-weight="550" text-anchor="start" dominant-baseline="hanging" >操作顺序与焦点不丢失</text><text x="812" y="697.76" font-size="14" fill="#475467" font-weight="550" text-anchor="start" dominant-baseline="hanging" >正文、按钮和状态均未遮挡</text><text x="756" y="894" font-size="13" fill="#0B6B63" font-weight="700" text-anchor="start" dominant-baseline="hanging" >检查证据：内容重排，不缩小字体；主要操作可达；焦点环完整。</text></svg>