="538" font-size="12" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >#067647 on #FFFFFF</text><rect x="426" y="520" width="90" height="28" rx="14" fill="#E7F5EE" stroke="#E7F5EE" /><text x="471" y="526" font-size="12" fill="#067647" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >5.69:1</text><text x="536" y="528" font-size="12" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" >AA 普通文字</text><rect x="58" y="592" width="76" height="52" rx="7" fill="#8A4B08" stroke="#8A4B08" /><text x="154" y="596" font-size="13" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >警告</text><text x="154" y="620" font-size="12" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >#8A4B08 on #FFFFFF</text><rect x="426" y="602" width="90" height="28" rx="14" fill="#E7F5EE" stroke="#E7F5EE" /><text x="471" y="608" font-size="12" fill="#067647" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >6.79:1</text><text x="536" y="610" font-size="12" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" >AA 普通文字</text><rect x="58" y="674" width="76" height="52" rx="7" fill="#B4233C" stroke="#B4233C" /><text x="154" y="678" font-size="13" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >危险</text><text x="154" y="702" font-size="12" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >#B4233C on #FFFFFF</text><rect x="426" y="684" width="90" height="28" rx="14" fill="#E7F5EE" stroke="#E7F5EE" /><text x="471" y="690" font-size="12" fill="#067647" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >6.47:1</text><text x="536" y="692" font-size="12" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" >AA 普通文字</text><rect x="58" y="756" width="76" height="52" rx="7" fill="#5B4BC4" stroke="#5B4BC4" /><text x="154" y="760" font-size="13" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >系统推断</text><text x="154" y="784" font-size="12" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >#5B4BC4 on #FFFFFF</text><rect x="426" y="766" width="90" height="28" rx="14" fill="#E7F5EE" stroke="#E7F5EE" /><text x="471" y="772" font-size="12" fill="#067647" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >6.46:1</text><text x="536" y="774" font-size="12" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" >AA 普通文字</text><rect x="736" y="110" width="672" height="370" rx="10" fill="#FFFFFF" stroke="#D0D7DE" /><text x="754" y="126" font-size="16" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >排版、网格与形状</text><text x="754" y="153" font-size="12" fill="#475467" font-weight="400" text-anchor="start" dominant-baseline="hanging" >1440/1024/390/320 逻辑 CSS 像素</text><text x="764" y="182" font-size="14" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >字体：系统无衬线；正文 14–16，移动 ≥16 CSS px</text><text x="764" y="201.88" font-size="14" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >字号：H1 28 / H2 20 / H3 16 / 辅助 12–13</text><text x="764" y="221.76" font-size="14" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >间距：4 / 8 / 12 / 16 / 24 / 32 / 48</text><text x="764" y="241.64" font-size="14" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >圆角：8 / 10 / 12；阴影非默认，仅浮层使用</text><text x="764" y="261.52" font-size="14" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >桌面 12 列；1024 折叠侧栏；移动单栏</text><text x="764" y="281.4" font-size="14" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >焦点环：#1D4ED8 3px + 2px 间隔</text><text x="764" y="301.28" font-size="14" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >动效：150–220ms；支持减少动效</text><rect x="736" y="504" width="672" height="416" rx="10" fill="#FFFFFF" stroke="#D0D7DE" /><text x="754" y="520" font-size="16" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >非颜色唯一编码</text><text x="754" y="547" font-size="12" fill="#475467" font-weight="400" text-anchor="start" dominant-baseline="hanging" >图标 + 形状 + 中文文字</text><rect x="764" y="576" width="184" height="66" rx="8" fill="#FFFFFF" stroke="#D0D7DE" /><text x="778" y="588" font-size="14" fill="#0B6B63" font-weight="750" text-anchor="start" dominant-baseline="hanging" >● 实心圆</text><text x="778" y="614" font-size="12" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" >公共事实</text><rect x="970" y="576" width="184" height="66" rx="8" fill="#FFFFFF" stroke="#D0D7DE" /><text x="984" y="588" font-size="14" fill="#0B6B63" font-weight="750" text-anchor="start" dominant-baseline="hanging" >❝ 引号</text><text x="984" y="614" font-size="12" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" >来源观点</text><rect x="1176" y="576" width="184" height="66" rx="8" fill="#FFFFFF" stroke="#D0D7DE" /><text x="1190" y="588" font-size="14" fill="#5B4BC4" font-weight="750" text-anchor="start" dominant-baseline="hanging" >◇ 虚线菱形</text><text x="1190" y="614" font-size="12" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" >系统推断</text><rect x="764" y="668" width="184" height="66" rx="8" fill="#FFFFFF" stroke="#D0D7DE" /><text x="778" y="680" font-size="14" fill="#0B6B63" font-weight="750" text-anchor="start" dominant-baseline="hanging" >○ 空心圆</text><text x="778" y="706" font-size="12" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" >未知</text><rect x="970" y="668" width="184" height="66" rx="8" fill="#FFFFFF" stroke="#D0D7DE" /><text x="984" y="680" font-size="14" fill="#0B6B63" font-weight="750" text-anchor="start" dominant-baseline="hanging" >▤ 文档</text><text x="984" y="706" font-size="12" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" >用户提供</text><rect x="1176" y="668" width="184" height="66" rx="8" fill="#FFFFFF" stroke="#D0D7DE" /><text x="1190" y="680" font-size="14" fill="#0B6B63" font-weight="750" text-anchor="start" dominant-baseline="hanging" >✓ 印章</text><text x="1190" y="706" font-size="12" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" >用户确认</text><rect x="764" y="760" width="184" height="66" rx="8" fill="#FFFFFF" stroke="#D0D7DE" /><text x="778" y="772" font-size="14" fill="#0B6B63" font-weight="750" text-anchor="start" dominant-baseline="hanging" >⬡ 盾牌</text><text x="778" y="798" font-size="12" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" >外部核验</text><rect x="970" y="760" width="184" height="66" rx="8" fill="#FFFFFF" stroke="#D0D7DE" /><text x="984" y="772" font-size="14" fill="#B4233C" font-weight="750" text-anchor="start" dominant-baseline="hanging" >↔ 双向箭头</text><text x="984" y="798" font-size="12" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" >冲突</text><rect x="1176" y="760" width="184" height="66" rx="8" fill="#FFFFFF" stroke="#D0D7DE" /><text x="1190" y="772" font-size="14" fill="#0B6B63" font-weight="750" text-anchor="start" dominant-baseline="hanging" >▧ 斜纹底</text><text x="1190" y="798" font-size="12" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" >演示数据</text></svg>