</style><title id="title">26-foundation-contrast-tokens.svg</title><desc id="desc">Frontend Career Radar CR-UI-002 v1.1 可复核设计原型</desc><rect x="0" y="0" width="1440" height="1024" rx="0" fill="#F6F8FA" stroke="#F6F8FA" /><text x="32" y="24" font-size="28" fill="#17212B" font-weight="780" text-anchor="start" dominant-baseline="hanging" >视觉基础规范</text><text x="32" y="60" font-size="13" fill="#475467" font-weight="450" text-anchor="start" dominant-baseline="hanging" >action / info / success / warning / danger / unknown 统一到文档与系统板。</text><rect x="32" y="110" width="680" height="810" rx="10" fill="#FFFFFF" stroke="#D0D7DE" /><text x="50" y="126" font-size="16" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >颜色与机器可复核对比度</text><text x="50" y="153" font-size="12" fill="#475467" font-weight="400" text-anchor="start" dominant-baseline="hanging" >公式：WCAG relative luminance；普通文字目标 ≥4.5:1</text><rect x="58" y="182" width="76" height="52" rx="7" fill="#17212B" stroke="#17212B" /><text x="154" y="186" font-size="13" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >正文</text><text x="154" y="210" font-size="12" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >#17212B on #FFFFFF</text><rect x="426" y="192" width="90" height="28" rx="14" fill="#E7F5EE" stroke="#E7F5EE" /><text x="471" y="198" font-size="12" fill="#067647" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >16.29:1</text><text x="536" y="200" font-size="12" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" >AA 普通文字</text><rect x="58" y="264" width="76" height="52" rx="7" fill="#475467" stroke="#475467" /><text x="154" y="268" font-size="13" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >次正文/未知</text><text x="154" y="292" font-size="12" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >#475467 on #FFFFFF</text><r