324" width="72" height="28" rx="14" fill="#FDECEF" stroke="#FDECEF" /><text x="1212" y="330" font-size="12" fill="#B4233C" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >危险</text><text x="1176" y="364" font-size="12" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" >按钮 / 输入 / 标签</text><text x="62" y="468" font-size="16" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >删除确认</text><rect x="62" y="508" width="600" height="218" rx="10" fill="#FFFFFF" stroke="#B4233C" stroke-width="2"/><rect x="84" y="530" width="98" height="28" rx="14" fill="#FDECEF" stroke="#FDECEF" /><text x="133" y="536" font-size="12" fill="#B4233C" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >危险操作</text><text x="84" y="574" font-size="18" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >删除证据并重算？</text><text x="84" y="614" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >说明对象、影响、可恢复性与后续重算。</text><rect x="324" y="658" width="156" height="40" rx="8" fill="#FFFFFF" stroke="#D0D7DE" /><text x="402" y="669" font-size="14" fill="#17212B" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >取消（默认焦点）</text><rect x="494" y="658" width="140" height="40" rx="8" fill="#FFFFFF" stroke="#D0D7DE" /><text x="564" y="669" font-size="14" fill="#17212B" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >确认删除</text><rect x="318" y="652" width="168" height="52" rx="10" fill="none" stroke="#1D4ED8" stroke-width="3"/><text x="720" y="468" font-size="16" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >表单与状态播报</text><rect x="720" y="508" width="650" height="218" rx="10" fill="#FFFFFF" stroke="#D0D7DE" /><text x="742" y="530" font-size="13" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >来源 URL（可选）</text><rect x="742" y="562" width="606" height="44" rx="7" fill="#FFFFFF" stroke="#B4233C" stroke-width="2"/><text x="754" y="574" font-size="12" fill="#B4233C" font-weight="600" text-anchor="start" dominant-baseline="hanging" >仅 URL 不会自动抓取，请粘贴正文</text><rect x="742" y="628" width="606" height="62" rx="7" fill="#F9FAFB" stroke="#D0D7DE" /><text x="756" y="642" font-size="12" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >礼貌状态播报</text><text x="756" y="666" font-size="12" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >“摘要完成；保存失败；原输入仍保留。”</text><text x="62" y="772" font-size="14" fill="#17212B" font-weight="650" text-anchor="start" dominant-baseline="hanging" >触控目标 ≥44×44 CSS px　·　危险/普通操作间距 ≥12px　·　减少动效　·　Escape 取消非破坏操作</text><text x="62" y="816" font-size="14" fill="#0B6B63" font-weight="700" text-anchor="start" dominant-baseline="hanging" >正文与状态标签文字对比度 ≥4.5:1；焦点、图形边界 ≥3:1。</text></svg>