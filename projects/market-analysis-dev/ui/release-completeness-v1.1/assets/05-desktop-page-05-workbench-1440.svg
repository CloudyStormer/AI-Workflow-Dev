</style><title id="title">05-desktop-page-05-workbench-1440.svg</title><desc id="desc">Frontend Career Radar CR-UI-002 v1.1 可复核设计原型</desc><rect x="0" y="0" width="1440" height="1024" rx="0" fill="#F6F8FA" stroke="#F6F8FA" /><rect x="0" y="0" width="220" height="1024" rx="0" fill="#FFFFFF" stroke="#D0D7DE" /><text x="24" y="26" font-size="17" fill="#17212B" font-weight="800" text-anchor="start" dominant-baseline="hanging" >Frontend Career Radar</text><text x="24" y="54" font-size="12" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >发布完整性原型 v1.1</text><text x="30" y="132" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >01 职业方向总览</text><text x="30" y="180" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >02 技术栈全景</text><text x="30" y="228" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >03 市场证据与趋势</text><text x="30" y="276" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >04 来源与质量</text><rect x="18" y="316" width="188" height="36" rx="7" fill="#E8F5F2" stroke="#E8F5F2" /><text x="30" y="324" font-size="13" fill="#0B6B63" font-weight="750" text-anchor="start" dominant-baseline="hanging" >05 信息源工作台</text><text x="30" y="372" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >06 个人证据档案</text><text x="30" y="420" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >07 差距与成长路线</text><text x="30" y="468" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >08 未来方向与历史</text><text x="30" y="516" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >09 账号与数据权利</text><text x="30" y="564" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >10 质量与恢复</text><text x="238" y="22" font-size="28" fill="#17212B" font-weight="760" text-anchor="start" dominant-baseline="hanging" >05 信息源工作台</text><text x="238" y="56" font-size="13" fill="#475467" font-weight="450" text-anchor="start" dominant-baseline="hanging" >输入、双轴分类、研究关系和保存边界都需要人工确认。</text><rect x="226" y="78" width="1190" height="42" rx="7" fill="#FDECEF" stroke="#FDECEF" /><text x="244" y="90" font-size="13" fill="#B4233C" font-weight="800" text-anchor="start" dominant-baseline="hanging" >当前真实状态</text><text x="445" y="90" font-size="13" fill="#B4233C" font-weight="650" text-anchor="start" dominant-baseline="hanging" >研究清单已批准 · 运行时来源 0 · connector 0 · 招聘实例 0</text><text x="1210" y="90" font-size="12" fill="#B4233C" font-weight="700" text-anchor="start" dominant-baseline="hanging" >禁止冒充实时</text><rect x="244" y="140" width="185" height="28" rx="14" fill="#FFF3E0" stroke="#FFF3E0" /><text x="336.5" y="146" font-size="12" fill="#8A4B08" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >演示数据 · 用户提供</text><rect x="442" y="140" width="185" height="28" rx="14" fill="#E8F5F2" stroke="#E8F5F2" /><text x="534.5" y="146" font-size="12" fill="#0B6B63" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >仅本次处理（推荐）</text><text x="650" y="147" font-size="13" fill="#475467" font-weight="600" text-anchor="start" dominant-baseline="hanging" >关闭会话后不进入长期档案 · 未授权第三方发送</text><rect x="240" y="190" width="1176" height="92" rx="10" fill="#FFFFFF" stroke="#D0D7DE" /><text x="258" y="206" font-size="16" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >六步工作台</text><text x="258" y="233" font-size="12" fill="#475467" font-weight="400" text-anchor="start" dominant-baseline="hanging" >1 粘贴 → 2 保存模式 → 3 双轴确认 → 4 摘要 → 5 对照 → 6 合并</text><circle cx="270" cy="252" r="14" fill="#0B6B63" stroke="#0B6B63" stroke-width="2"/><text x="293" y="243" font-size="12" fill="#0B6B63" font-weight="700" text-anchor="start" dominant-baseline="hanging" >粘贴</text><line x1="352" y1="252" x2="435" y2="252" stroke="#D0D7DE" stroke-width="2" /><circle cx="450" cy="252" r="14" fill="#0B6B63" stroke="#0B6B63" stroke-width="2"/><text x="473" y="243" font-size="12" fill="#0B6B63" font-weight="700" text-anchor="start" dominant-baseline="hanging" >保存模式</text><line x1="532" y1="252" x2="615" y2="252" stroke="#D0D7DE" stroke-width="2" /><circle cx="630" cy="252" r="14" fill="#0B6B63" stroke="#0B6B63" stroke-width="2"/><text x="653" y="243" font-size="12" fill="#0B6B63" font-weight="700" text-anchor="start" dominant-baseline="hanging" >双轴确认</text><line x1="712" y1="252" x2="795" y2="252" stroke="#D0D7DE" stroke-width="2" /><circle cx="810" cy="252" r="14" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="2"/><text x="833" y="243" font-size="12" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >摘要</text><line x1="892" y1="252" x2="975" y2="252" stroke="#D0D7DE" stroke-width="2" /><circle cx="990" cy="252" r="14" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="2"/><text x="1013" y="243" font-size="12" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >对照</text><line x1="1072" y1="252" x2="1155" y2="252" stroke="#D0D7DE" stroke-width="2" /><circle cx="1170" cy="252" r="14" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="2"/><text x="1193" y="243" font-size="12" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >合并</text><rect x="240" y="300" width="560" height="320" rx="10" fill="#FFFFFF" stroke="#D0D7DE" /><text x="258" y="316" font-size="16" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >输入正文</text><text x="258" y="343" font-size="12" fill="#475467" font-weight="400" text-anchor="start" dominant-baseline="hanging" >支持文章、招聘/面试、简历、经历、项目材料</text><rect x="260" y="366" width="520" height="154" rx="8" fill="#FFFFFF" stroke="#D0D7DE" /><text x="278" y="386" font-size="14" fill="#475467" font-weight="450" text-anchor="start" dominant-baseline="hanging" >粘贴正文；仅 URL 时不会自动抓取。</text><text x="278" y="405.88" font-size="14" fill="#475467" font-weight="450" text-anchor="start" dominant-baseline="hanging" >字符按 Unicode 计数，超限不截断。</text><text x="278" y="490" font-size="12" fill="#0B6B63" font-weight="700" text-anchor="start" dominant-baseline="hanging" >1–100,000 Unicode</text><text x="762" y="490" font-size="12" fill="#475467" font-weight="600" text-anchor="end" dominant-baseline="hanging" >328 / 100,000</text><rect x="260" y="540" width="18" height="18" rx="4" fill="#0B6B63" stroke="#0B6B63" /><text x="269" y="542" font-size="12" fill="#FFFFFF" font-weight="800" text-anchor="middle" dominant-baseline="hanging" >✓</text><text x="288" y="541" font-size="13" fill="#17212B" font-weight="500" text-anchor="start" dominant-baseline="hanging" >我有权将此内容用于个人研究</text><text x="260" y="576" font-size="12" fill="#8A4B08" font-weight="650" text-anchor="start" dominant-baseline="hanging" >敏感信息：检测到联系方式（约第 5 行），不回显完整值</text><rect x="820" y="300" width="596" height="320" rx="10" fill="#FFFFFF" stroke="#D0D7DE" /><text x="838" y="316" font-size="16" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >双轴人工确认</text><text x="838" y="343" font-size="12" fill="#475467" font-weight="400" text-anchor="start" dominant-baseline="hanging" >两个维度分别选择；确认前保持待确认</text><text x="842" y="366" font-size="13" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >来源渠道（可多属性）</text><rect x="842" y="394" width="120" height="28" rx="14" fill="#EAF1FF" stroke="#EAF1FF" /><text x="902" y="400" font-size="12" fill="#1D4ED8" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >公司招聘页</text><rect x="972" y="394" width="106" height="28" rx="14" fill="#EEF1F4" stroke="#EEF1F4" /><text x="1025" y="400" font-size="12" fill="#475467" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >搜索引擎</text><text x="842" y="432" font-size="13" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >内容类型（可多属性）</text><rect x="842" y="460" width="106" height="28" rx="14" fill="#EAF1FF" stroke="#EAF1FF" /><text x="895" y="466" font-size="12" fill="#1D4ED8" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >职位描述</text><rect x="958" y="460" width="106" height="28" rx="14" fill="#EEF1F4" stroke="#EEF1F4" /><text x="1011" y="466" font-size="12" fill="#475467" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >面试要求</text><text x="842" y="508" font-size="12" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >建议置信度 0.72 · 依据：职位职责、公司域名</text><rect x="842" y="550" width="132" height="40" rx="8" fill="#0B6B63" stroke="#0B6B63" /><text x="908" y="561" font-size="14" fill="#FFFFFF" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >确认分类</text><rect x="986" y="550" width="132" height="40" rx="8" fill="#FFFFFF" stroke="#D0D7DE" /><text x="1052" y="561" font-size="14" fill="#17212B" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >纠正建议</text><rect x="240" y="640" width="1176" height="300" rx="10" fill="#FFFFFF" stroke="#D0D7DE" /><text x="258" y="656" font-size="16" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >研究关系：每条候选必须且只能选择一种</text><text x="258" y="683" font-size="12" fill="#475467" font-weight="400" text-anchor="start" dominant-baseline="hanging" >互斥单选；不是“可多选”</text><circle cx="281" cy="725" r="9" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="2"/><text x="298" y="717" font-size="13" fill="#17212B" font-weight="500" text-anchor="start" dominant-baseline="hanging" >新增证据</text><circle cx="459" cy="725" r="9" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="2"/><text x="476" y="717" font-size="13" fill="#17212B" font-weight="500" text-anchor="start" dominant-baseline="hanging" >相互印证</text><circle cx="637" cy="725" r="9" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="2"/><text x="654" y="717" font-size="13" fill="#17212B" font-weight="500" text-anchor="start" dominant-baseline="hanging" >重复</text><circle cx="815" cy="725" r="9" fill="#FFFFFF" stroke="#0B6B63" stroke-width="2"/><circle cx="815" cy="725" r="4" fill="#0B6B63" stroke="#0B6B63" stroke-width="1"/><text x="832" y="717" font-size="13" fill="#17212B" font-weight="500" text-anchor="start" dominant-baseline="hanging" >冲突</text><circle cx="993" cy="725" r="9" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="2"/><text x="1010" y="717" font-size="13" fill="#17212B" font-weight="500" text-anchor="start" dominant-baseline="hanging" >证据不足</text><circle cx="1171" cy="725" r="9" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="2"/><text x="1188" y="717" font-size="13" fill="#17212B" font-weight="500" text-anchor="start" dominant-baseline="hanging" >不适用</text><rect x="260" y="768" width="1136" height="104" rx="7" fill="#FFF8F0" stroke="#D0D7DE" /><text x="280" y="786" font-size="13" fill="#17212B" font-weight="650" text-anchor="start" dominant-baseline="hanging" >候选 01 · 用户主张：该岗位要求 TypeScript 5.x</text><rect x="280" y="820" width="72" height="28" rx="14" fill="#FDECEF" stroke="#FDECEF" /><text x="316" y="826" font-size="12" fill="#B4233C" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >冲突</text><text x="370" y="825" font-size="13" fill="#17212B" font-weight="500" text-anchor="start" dominant-baseline="hanging" >公共研究只记录 TypeScript 要求，未记录 5.x；并列保留，等待证据。</text><rect x="1180" y="812" width="180" height="40" rx="8" fill="#E5E7EB" stroke="#E5E7EB" /><text x="1270" y="823" font-size="14" fill="#475467" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >逐条合并</text><text x="260" y="896" font-size="12" fill="#B4233C" font-weight="650" text-anchor="start" dominant-baseline="hanging" >处理失败时保留原输入；分类、摘要或保存失败不得自动确认。</text><line x1="226" y1="992" x2="1190" y2="992" stroke="#D0D7DE" stroke-width="1" /><text x="226" y="998" font-size="11" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >待审设计 · 非业务实现</text><text x="1416" y="998" font-size="11" fill="#475467" font-weight="500" text-anchor="end" dominant-baseline="hanging" >CR-UI-002 v1.1</text></svg>