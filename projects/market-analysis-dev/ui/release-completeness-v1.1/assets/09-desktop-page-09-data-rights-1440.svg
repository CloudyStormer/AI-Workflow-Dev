</style><title id="title">09-desktop-page-09-data-rights-1440.svg</title><desc id="desc">Frontend Career Radar CR-UI-002 v1.1 可复核设计原型</desc><rect x="0" y="0" width="1440" height="1024" rx="0" fill="#F6F8FA" stroke="#F6F8FA" /><rect x="0" y="0" width="220" height="1024" rx="0" fill="#FFFFFF" stroke="#D0D7DE" /><text x="24" y="26" font-size="17" fill="#17212B" font-weight="800" text-anchor="start" dominant-baseline="hanging" >Frontend Career Radar</text><text x="24" y="54" font-size="12" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >发布完整性原型 v1.1</text><text x="30" y="132" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >01 职业方向总览</text><text x="30" y="180" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >02 技术栈全景</text><text x="30" y="228" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >03 市场证据与趋势</text><text x="30" y="276" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >04 来源与质量</text><text x="30" y="324" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >05 信息源工作台</text><text x="30" y="372" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >06 个人证据档案</text><text x="30" y="420" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >07 差距与成长路线</text><text x="30" y="468" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >08 未来方向与历史</text><rect x="18" y="508" width="188" height="36" rx="7" fill="#E8F5F2" stroke="#E8F5F2" /><text x="30" y="516" font-size="13" fill="#0B6B63" font-weight="750" text-anchor="start" dominant-baseline="hanging" >09 账号与数据权利</text><text x="30" y="564" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >10 质量与恢复</text><text x="238" y="22" font-size="28" fill="#17212B" font-weight="760" text-anchor="start" dominant-baseline="hanging" >09 账号与数据权利</text><text x="238" y="56" font-size="13" fill="#475467" font-weight="450" text-anchor="start" dominant-baseline="hanging" >保存、同步、导出与删除必须分范围、分状态、可撤销。</text><rect x="226" y="78" width="1190" height="42" rx="7" fill="#FFF3E0" stroke="#FFF3E0" /><text x="244" y="90" font-size="13" fill="#8A4B08" font-weight="800" text-anchor="start" dominant-baseline="hanging" >目标态演示 · 当前未接通</text><text x="445" y="90" font-size="13" fill="#8A4B08" font-weight="650" text-anchor="start" dominant-baseline="hanging" >研究清单已批准 · 运行时来源 0 · connector 0 · 招聘实例 0</text><text x="1210" y="90" font-size="12" fill="#8A4B08" font-weight="700" text-anchor="start" dominant-baseline="hanging" >禁止冒充实时</text><rect x="244" y="140" width="225" height="28" rx="14" fill="#FFF3E0" stroke="#FFF3E0" /><text x="356.5" y="146" font-size="12" fill="#8A4B08" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >目标态演示 · 当前未接通</text><rect x="482" y="140" width="185" height="28" rx="14" fill="#FFF3E0" stroke="#FFF3E0" /><text x="574.5" y="146" font-size="12" fill="#8A4B08" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >演示数据 · 用户提供</text><text x="680" y="147" font-size="13" fill="#8A4B08" font-weight="700" text-anchor="start" dominant-baseline="hanging" >账号、同步、导出和删除尚非运行时能力</text><rect x="240" y="190" width="380" height="300" rx="10" fill="#FFFFFF" stroke="#D0D7DE" /><text x="258" y="206" font-size="16" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >数据保存清单</text><text x="258" y="233" font-size="12" fill="#475467" font-weight="400" text-anchor="start" dominant-baseline="hanging" >目标态演示</text><text x="262" y="264" font-size="13" fill="#17212B" font-weight="650" text-anchor="start" dominant-baseline="hanging" >仅本次处理</text><text x="416" y="264" font-size="13" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >2 条</text><text x="480" y="264" font-size="12" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >会话关闭即不保留</text><text x="262" y="322" font-size="13" fill="#17212B" font-weight="650" text-anchor="start" dominant-baseline="hanging" >私有原文</text><text x="416" y="322" font-size="13" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >1 条</text><text x="480" y="322" font-size="12" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >明确选择保存</text><text x="262" y="380" font-size="13" fill="#17212B" font-weight="650" text-anchor="start" dominant-baseline="hanging" >结构化证据</text><text x="416" y="380" font-size="13" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >3 条</text><text x="480" y="380" font-size="12" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >逐条确认</text><text x="262" y="438" font-size="13" fill="#17212B" font-weight="650" text-anchor="start" dominant-baseline="hanging" >第三方处理</text><text x="416" y="438" font-size="13" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >0 次</text><text x="480" y="438" font-size="12" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >未授权，未发送</text><rect x="640" y="190" width="380" height="300" rx="10" fill="#FFFFFF" stroke="#D0D7DE" /><text x="658" y="206" font-size="16" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >设备与同步</text><text x="658" y="233" font-size="12" fill="#475467" font-weight="400" text-anchor="start" dominant-baseline="hanging" >目标态演示 · 当前未接通</text><rect x="662" y="264" width="225" height="28" rx="14" fill="#FDECEF" stroke="#FDECEF" /><text x="774.5" y="270" font-size="12" fill="#B4233C" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >数据尚未就绪（not_ready）</text><text x="662" y="312" font-size="13" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" >最近成功同步：—</text><text x="662" y="348" font-size="13" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" >在线设备：0</text><text x="662" y="384" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >未保存变更：演示 2</text><rect x="662" y="428" width="132" height="40" rx="8" fill="#FFFFFF" stroke="#D0D7DE" /><text x="728" y="439" font-size="14" fill="#17212B" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >重试检查</text><rect x="1040" y="190" width="376" height="300" rx="10" fill="#FFFFFF" stroke="#D0D7DE" /><text x="1058" y="206" font-size="16" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >导出</text><text x="1058" y="233" font-size="12" fill="#475467" font-weight="400" text-anchor="start" dominant-baseline="hanging" >人类可读 + 机器可读</text><circle cx="1071" cy="273" r="9" fill="#FFFFFF" stroke="#0B6B63" stroke-width="2"/><circle cx="1071" cy="273" r="4" fill="#0B6B63" stroke="#0B6B63" stroke-width="1"/><text x="1088" y="265" font-size="13" fill="#17212B" font-weight="500" text-anchor="start" dominant-baseline="hanging" >人类可读摘要</text><circle cx="1071" cy="315" r="9" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="2"/><text x="1088" y="307" font-size="13" fill="#17212B" font-weight="500" text-anchor="start" dominant-baseline="hanging" >机器可读数据</text><text x="1062" y="352" font-size="12" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >范围、版本、生成时间均需可见</text><rect x="1062" y="410" width="138" height="40" rx="8" fill="#E5E7EB" stroke="#E5E7EB" /><text x="1131" y="421" font-size="14" fill="#475467" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >生成导出</text><rect x="240" y="514" width="1176" height="426" rx="10" fill="#FFFFFF" stroke="#D0D7DE" /><text x="258" y="530" font-size="16" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >删除账号确认</text><text x="258" y="557" font-size="12" fill="#475467" font-weight="400" text-anchor="start" dominant-baseline="hanging" >独立危险流程；默认焦点在“取消”</text><rect x="480" y="590" width="696" height="270" rx="10" fill="#FFFFFF" stroke="#B4233C" stroke-width="2"/><rect x="510" y="616" width="100" height="28" rx="14" fill="#FDECEF" stroke="#FDECEF" /><text x="560" y="622" font-size="12" fill="#B4233C" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >危险操作</text><text x="510" y="662" font-size="20" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >删除账号与全部私有数据？</text><text x="510" y="706" font-size="14" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >登录立即失效；活动个人数据目标 24 小时内删除。</text><text x="510" y="725.88" font-size="14" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >备份残留最长 30 天到期，不恢复为活动账号。</text><text x="510" y="745.76" font-size="14" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >删除单条证据会单独展示差距/路线重算范围。</text><rect x="770" y="800" width="170" height="40" rx="8" fill="#FFFFFF" stroke="#D0D7DE" /><text x="855" y="811" font-size="14" fill="#17212B" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >取消（默认焦点）</text><rect x="956" y="800" width="170" height="40" rx="8" fill="#FFFFFF" stroke="#D0D7DE" /><text x="1041" y="811" font-size="14" fill="#17212B" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >确认删除账号</text><rect x="764" y="794" width="182" height="52" rx="10" fill="none" stroke="#1D4ED8" stroke-width="3"/><line x1="226" y1="992" x2="1190" y2="992" stroke="#D0D7DE" stroke-width="1" /><text x="226" y="998" font-size="11" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >目标态演示 · 当前未接通 · 演示数据 · 用户提供 · 非真实账号</text><text x="1416" y="998" font-size="11" fill="#475467" font-weight="500" text-anchor="end" dominant-baseline="hanging" >CR-UI-002 v1.1</text></sv