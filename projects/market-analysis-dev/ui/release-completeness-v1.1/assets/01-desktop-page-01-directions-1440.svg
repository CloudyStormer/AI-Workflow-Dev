</style><title id="title">01-desktop-page-01-directions-1440.svg</title><desc id="desc">Frontend Career Radar CR-UI-002 v1.1 可复核设计原型</desc><rect x="0" y="0" width="1440" height="1024" rx="0" fill="#F6F8FA" stroke="#F6F8FA" /><rect x="0" y="0" width="220" height="1024" rx="0" fill="#FFFFFF" stroke="#D0D7DE" /><text x="24" y="26" font-size="17" fill="#17212B" font-weight="800" text-anchor="start" dominant-baseline="hanging" >Frontend Career Radar</text><text x="24" y="54" font-size="12" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >发布完整性原型 v1.1</text><rect x="18" y="124" width="188" height="36" rx="7" fill="#E8F5F2" stroke="#E8F5F2" /><text x="30" y="132" font-size="13" fill="#0B6B63" font-weight="750" text-anchor="start" dominant-baseline="hanging" >01 职业方向总览</text><text x="30" y="180" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >02 技术栈全景</text><text x="30" y="228" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >03 市场证据与趋势</text><text x="30" y="276" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >04 来源与质量</text><text x="30" y="324" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >05 信息源工作台</text><text x="30" y="372" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >06 个人证据档案</text><text x="30" y="420" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >07 差距与成长路线</text><text x="30" y="468" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >08 未来方向与历史</text><text x="30" y="516" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >09 账号与数据权利</text><text x="30" y="564" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >10 质量与恢复</text><text x="238" y="22" font-size="28" fill="#17212B" font-weight="760" text-anchor="start" dominant-baseline="hanging" >01 职业方向总览</text><text x="238" y="56" font-size="13" fill="#475467" font-weight="450" text-anchor="start" dominant-baseline="hanging" >先理解方向，再进入技术栈；二维坐标只解释差异。</text><rect x="226" y="78" width="1190" height="42" rx="7" fill="#FDECEF" stroke="#FDECEF" /><text x="244" y="90" font-size="13" fill="#B4233C" font-weight="800" text-anchor="start" dominant-baseline="hanging" >当前真实状态</text><text x="445" y="90" font-size="13" fill="#B4233C" font-weight="650" text-anchor="start" dominant-baseline="hanging" >研究清单已批准 · 运行时来源 0 · connector 0 · 招聘实例 0</text><text x="1210" y="90" font-size="12" fill="#B4233C" font-weight="700" text-anchor="start" dominant-baseline="hanging" >禁止冒充实时</text><rect x="240" y="140" width="830" height="610" rx="10" fill="#FFFFFF" stroke="#D0D7DE" /><text x="258" y="156" font-size="16" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >二维解释坐标图</text><text x="258" y="183" font-size="12" fill="#475467" font-weight="400" text-anchor="start" dominant-baseline="hanging" >横轴：产品交付协作深度；纵轴：平台／体验专项深度（均非好坏或排名）</text><line x1="315" y1="690" x2="1015" y2="690" stroke="#475467" stroke-width="2" /><line x1="315" y1="690" x2="315" y2="230" stroke="#475467" stroke-width="2" /><text x="665" y="710" font-size="12" fill="#475467" font-weight="600" text-anchor="middle" dominant-baseline="hanging" >产品交付协作深度 →</text><text x="270" y="420" font-size="12" fill="#475467" font-weight="600" text-anchor="middle" dominant-baseline="hanging" transform="rotate(-90 270 420)">专项深度</text><circle cx="520" cy="300" r="10" fill="#FFFFFF" stroke="#0B6B63" stroke-width="3"/><text x="538" y="292" font-size="12" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >产品型前端／应用工程</text><circle cx="720" cy="230" r="13" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="3"/><text x="738" y="222" font-size="12" fill="#17212B" font-weight="500" text-anchor="start" dominant-baseline="hanging" >平台／设计系统／DevEx</text><circle cx="930" cy="315" r="16" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="3"/><text x="948" y="307" font-size="12" fill="#17212B" font-weight="500" text-anchor="start" dominant-baseline="hanging" >AI 应用前端／AI 产品工程</text><circle cx="1025" cy="460" r="10" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="3"/><text x="1043" y="452" font-size="12" fill="#17212B" font-weight="500" text-anchor="start" dominant-baseline="hanging" >数据可视化／实时交互</text><circle cx="820" cy="520" r="13" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="3"/><text x="838" y="512" font-size="12" fill="#17212B" font-weight="500" text-anchor="start" dominant-baseline="hanging" >跨端／桌面／移动</text><circle cx="635" cy="460" r="16" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="3"/><text x="653" y="452" font-size="12" fill="#17212B" font-weight="500" text-anchor="start" dominant-baseline="hanging" >全栈产品协作</text><circle cx="460" cy="560" r="10" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="3"/><text x="478" y="552" font-size="12" fill="#17212B" font-weight="500" text-anchor="start" dominant-baseline="hanging" >Web 质量工程</text><circle cx="1080" cy="235" r="13" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="3"/><text x="1098" y="227" font-size="12" fill="#17212B" font-weight="500" text-anchor="start" dominant-baseline="hanging" >UX Engineering／设计开发融合</text><rect x="260" y="648" width="155" height="28" rx="14" fill="#EAF1FF" stroke="#EAF1FF" /><text x="337.5" y="654" font-size="12" fill="#1D4ED8" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >获批历史研究快照</text><text x="428" y="655" font-size="12" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >证据截止 2026-08-03 · 节点大小=直接证据数 · 描边=置信度</text><rect x="1090" y="140" width="326" height="610" rx="10" fill="#FFFFFF" stroke="#D0D7DE" /><text x="1108" y="156" font-size="16" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >8 个方向</text><text x="1108" y="183" font-size="12" fill="#475467" font-weight="400" text-anchor="start" dominant-baseline="hanging" >选中方向只显示定义、证据和限制，不生成适配分</text><rect x="1108" y="214" width="290" height="40" rx="7" fill="#E8F5F2" stroke="#0B6B63" /><text x="1122" y="225" font-size="12" fill="#0B6B63" font-weight="700" text-anchor="start" dominant-baseline="hanging" >01 产品型前端／应用工程</text><rect x="1108" y="266" width="290" height="40" rx="7" fill="#FFFFFF" stroke="#D0D7DE" /><text x="1122" y="277" font-size="12" fill="#17212B" font-weight="500" text-anchor="start" dominant-baseline="hanging" >02 平台／设计系统／DevEx</text><rect x="1108" y="318" width="290" height="40" rx="7" fill="#FFFFFF" stroke="#D0D7DE" /><text x="1122" y="329" font-size="12" fill="#17212B" font-weight="500" text-anchor="start" dominant-baseline="hanging" >03 AI 应用前端／AI 产品工程</text><rect x="1108" y="370" width="290" height="40" rx="7" fill="#FFFFFF" stroke="#D0D7DE" /><text x="1122" y="381" font-size="12" fill="#17212B" font-weight="500" text-anchor="start" dominant-baseline="hanging" >04 数据可视化／实时交互</text><rect x="1108" y="422" width="290" height="40" rx="7" fill="#FFFFFF" stroke="#D0D7DE" /><text x="1122" y="433" font-size="12" fill="#17212B" font-weight="500" text-anchor="start" dominant-baseline="hanging" >05 跨端／桌面／移动</text><rect x="1108" y="474" width="290" height="40" rx="7" fill="#FFFFFF" stroke="#D0D7DE" /><text x="1122" y="485" font-size="12" fill="#17212B" font-weight="500" text-anchor="start" dominant-baseline="hanging" >06 全栈产品协作</text><rect x="1108" y="526" width="290" height="40" rx="7" fill="#FFFFFF" stroke="#D0D7DE" /><text x="1122" y="537" font-size="12" fill="#17212B" font-weight="500" text-anchor="start" dominant-baseline="hanging" >07 Web 质量工程</text><rect x="1108" y="578" width="290" height="40" rx="7" fill="#FFFFFF" stroke="#D0D7DE" /><text x="1122" y="589" font-size="12" fill="#17212B" font-weight="500" text-anchor="start" dominant-baseline="hanging" >08 UX Engineering／设计开发融合</text><rect x="240" y="770" width="1176" height="190" rx="10" fill="#FFFFFF" stroke="#D0D7DE" /><text x="258" y="786" font-size="16" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >已选：产品型前端／应用工程</text><text x="258" y="813" font-size="12" fill="#475467" font-weight="400" text-anchor="start" dominant-baseline="hanging" >公共研究信息 · 不是个人推荐</text><text x="260" y="834" font-size="14" fill="#17212B" font-weight="650" text-anchor="start" dominant-baseline="hanging" >价值：围绕真实用户问题完成可发布 Web 产品</text><text x="260" y="866" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >主要能力域：Web 平台、框架与数据、工程化、产品质量、协作</text><rect x="260" y="902" width="80" height="28" rx="14" fill="#FFF3E0" stroke="#FFF3E0" /><text x="300" y="908" font-size="12" fill="#8A4B08" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >证据有限</text><text x="370" y="908" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >限制：目的抽样偏中高级；不得外推岗位总量或市场份额</text><rect x="1228" y="896" width="150" height="40" rx="8" fill="#0B6B63" stroke="#0B6B63" /><text x="1303" y="907" font-size="14" fill="#FFFFFF" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >查看技术栈</text><line x1="226" y1="992" x2="1190" y2="992" stroke="#D0D7DE" stroke-width="1" /><text x="226" y="998" font-size="11" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >待审设计 · 非业务实现</text><text x="1416" y="998" font-size="11" fill="#475467" font-weight="500" text-anchor="end" dominant-baseline="hanging" >CR-UI-002 v1.1</text></svg>