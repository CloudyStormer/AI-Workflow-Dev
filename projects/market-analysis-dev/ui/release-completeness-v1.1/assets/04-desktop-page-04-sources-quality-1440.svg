</style><title id="title">04-desktop-page-04-sources-quality-1440.svg</title><desc id="desc">Frontend Career Radar CR-UI-002 v1.1 可复核设计原型</desc><rect x="0" y="0" width="1440" height="1024" rx="0" fill="#F6F8FA" stroke="#F6F8FA" /><rect x="0" y="0" width="220" height="1024" rx="0" fill="#FFFFFF" stroke="#D0D7DE" /><text x="24" y="26" font-size="17" fill="#17212B" font-weight="800" text-anchor="start" dominant-baseline="hanging" >Frontend Career Radar</text><text x="24" y="54" font-size="12" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >发布完整性原型 v1.1</text><text x="30" y="132" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >01 职业方向总览</text><text x="30" y="180" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >02 技术栈全景</text><text x="30" y="228" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >03 市场证据与趋势</text><rect x="18" y="268" width="188" height="36" rx="7" fill="#E8F5F2" stroke="#E8F5F2" /><text x="30" y="276" font-size="13" fill="#0B6B63" font-weight="750" text-anchor="start" dominant-baseline="hanging" >04 来源与质量</text><text x="30" y="324" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >05 信息源工作台</text><text x="30" y="372" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >06 个人证据档案</text><text x="30" y="420" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >07 差距与成长路线</text><text x="30" y="468" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >08 未来方向与历史</text><text x="30" y="516" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >09 账号与数据权利</text><text x="30" y="564" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >10 质量与恢复</text><text x="238" y="22" font-size="28" fill="#17212B" font-weight="760" text-anchor="start" dominant-baseline="hanging" >04 来源与质量</text><text x="238" y="56" font-size="13" fill="#475467" font-weight="450" text-anchor="start" dominant-baseline="hanging" >研究批准 ≠ 运行时接入；来源政策与运行时状态双轴呈现。</text><rect x="226" y="78" width="1190" height="42" rx="7" fill="#FDECEF" stroke="#FDECEF" /><text x="244" y="90" font-size="13" fill="#B4233C" font-weight="800" text-anchor="start" dominant-baseline="hanging" >当前真实状态</text><text x="445" y="90" font-size="13" fill="#B4233C" font-weight="650" text-anchor="start" dominant-baseline="hanging" >研究清单已批准 · 运行时来源 0 · connector 0 · 招聘实例 0</text><text x="1210" y="90" font-size="12" fill="#B4233C" font-weight="700" text-anchor="start" dominant-baseline="hanging" >禁止冒充实时</text><rect x="244" y="140" width="135" height="28" rx="14" fill="#EAF1FF" stroke="#EAF1FF" /><text x="311.5" y="146" font-size="12" fill="#1D4ED8" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >60 条来源记录</text><rect x="390" y="140" width="145" height="28" rx="14" fill="#EAF1FF" stroke="#EAF1FF" /><text x="462.5" y="146" font-size="12" fill="#1D4ED8" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >16 个端点裁决</text><rect x="546" y="140" width="190" height="28" rx="14" fill="#E7F5EE" stroke="#E7F5EE" /><text x="641" y="146" font-size="12" fill="#067647" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >13 个 allow 技术端点</text><rect x="748" y="140" width="220" height="28" rx="14" fill="#FFF3E0" stroke="#FFF3E0" /><text x="858" y="146" font-size="12" fill="#8A4B08" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >3 个 conditional ATS 模板</text><rect x="980" y="140" width="180" height="28" rx="14" fill="#FDECEF" stroke="#FDECEF" /><text x="1070" y="146" font-size="12" fill="#B4233C" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >运行时 connector 0</text><rect x="1172" y="140" width="130" height="28" rx="14" fill="#FDECEF" stroke="#FDECEF" /><text x="1237" y="146" font-size="12" fill="#B4233C" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >招聘实例 0</text><rect x="240" y="190" width="1176" height="590" rx="10" fill="#FFFFFF" stroke="#D0D7DE" /><text x="258" y="206" font-size="16" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >来源政策轴 × 运行时轴</text><text x="258" y="233" font-size="12" fill="#475467" font-weight="400" text-anchor="start" dominant-baseline="hanging" >政策批准与运行时接入必须分列，不能合并为一个绿点</text><text x="260" y="260" font-size="12" fill="#475467" font-weight="700" text-anchor="start" dominant-baseline="hanging" >来源／端点</text><text x="520" y="260" font-size="12" fill="#475467" font-weight="700" text-anchor="start" dominant-baseline="hanging" >政策决定</text><text x="660" y="260" font-size="12" fill="#475467" font-weight="700" text-anchor="start" dominant-baseline="hanging" >运行时状态</text><text x="820" y="260" font-size="12" fill="#475467" font-weight="700" text-anchor="start" dominant-baseline="hanging" >权利/条件</text><text x="1040" y="260" font-size="12" fill="#475467" font-weight="700" text-anchor="start" dominant-baseline="hanging" >刷新节奏</text><text x="1155" y="260" font-size="12" fill="#475467" font-weight="700" text-anchor="start" dominant-baseline="hanging" >最近成功</text><text x="1260" y="260" font-size="12" fill="#475467" font-weight="700" text-anchor="start" dominant-baseline="hanging" >允许操作</text><line x1="258" y1="286" x2="1396" y2="286" stroke="#D0D7DE" stroke-width="1" /><text x="260" y="310" font-size="12" fill="#17212B" font-weight="500" text-anchor="start" dominant-baseline="hanging" >官方技术发布端点（13）</text><text x="520" y="310" font-size="12" fill="#067647" font-weight="700" text-anchor="start" dominant-baseline="hanging" >允许 allow</text><text x="660" y="310" font-size="12" fill="#B4233C" font-weight="700" text-anchor="start" dominant-baseline="hanging" >未配置</text><text x="820" y="310" font-size