</style><title id="title">08-desktop-page-08-future-history-1440.svg</title><desc id="desc">Frontend Career Radar CR-UI-002 v1.3 可复核设计原型</desc><rect x="0" y="0" width="1440" height="1024" rx="0" fill="#F6F8FA" stroke="#F6F8FA" /><rect x="0" y="0" width="220" height="1024" rx="0" fill="#FFFFFF" stroke="#D0D7DE" /><text x="24" y="26" font-size="17" fill="#17212B" font-weight="800" text-anchor="start" dominant-baseline="hanging" >Frontend Career Radar</text><text x="24" y="54" font-size="12" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >发布完整性原型 v1.3</text><text x="30" y="132" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >01 职业方向总览</text><text x="30" y="180" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >02 技术栈全景</text><text x="30" y="228" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >03 市场证据与趋势</text><text x="30" y="276" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >04 来源与质量</text><text x="30" y="324" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >05 信息源工作台</text><text x="30" y="372" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >06 个人证据档案</text><text x="30" y="420" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >07 差距与成长路线</text><rect x="18" y="460" width="188" height="36" rx="7" fill="#E8F5F2" stroke="#E8F5F2" /><text x="30" y="468" font-size="13" fill="#0B6B63" font-weight="750" text-anchor="start" dominant-baseline="hanging" >08 未来方向与历史</text><text x="30" y="516" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >09 账号与数据权利</text><text x="30" y="564" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >10 质量与恢复</text><text x="238" y="22" font-size="28" fill="#17212B" font-weight="760" text-anchor="start" dominant-baseline="hanging" >08 未来方向与历史</text><text x="238" y="56" font-size="13" fill="#475467" font-weight="450" text-anchor="start" dominant-baseline="hanging" >缺实时趋势时不生成未来建议；历史版本仍可追溯。</text><rect x="226" y="78" width="1190" height="42" rx="7" fill="#FDECEF" stroke="#FDECEF" /><text x="244" y="90" font-size="13" fill="#B4233C" font-weight="800" text-anchor="start" dominant-baseline="hanging" >当前真实状态</text><text x="445" y="90" font-size="13" fill="#B4233C" font-weight="650" text-anchor="start" dominant-baseline="hanging" >研究清单已批准 · 运行时来源 0 · connector 0 · 招聘实例 0</text><text x="1210" y="90" font-size="12" fill="#B4233C" font-weight="700" text-anchor="start" dominant-baseline="hanging" >禁止冒充实时</text><rect x="244" y="140" width="160" height="28" rx="14" fill="#EAF1FF" stroke="#EAF1FF" /><text x="324" y="146" font-size="12" fill="#1D4ED8" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >获批历史研究快照</text><rect x="416" y="140" width="190" height="28" rx="14" fill="#FDECEF" stroke="#FDECEF" /><text x="511" y="146" font-size="12" fill="#B4233C" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >未来建议：暂不可生成</text><text x="620" y="147" font-size="13" fill="#B4233C" font-weight="700" text-anchor="start" dominant-baseline="hanging" >持续来源 0，7/30/90 日趋势不可用</text><rect x="240" y="190" width="566" height="360" rx="10" fill="#FFFFFF" stroke="#D0D7DE" /><text x="258" y="206" font-size="16" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >未来方向</text><text x="258" y="233" font-size="12" fill="#475467" font-weight="400" text-anchor="start" dominant-baseline="hanging" >系统推断要求当前趋势、目标和邻接证据</text><rect x="260" y="266" width="526" height="210" rx="8" fill="#F9FAFB" stroke="#D0D7DE" /><rect x="282" y="288" width="230" height="28" rx="14" fill="#F0EDFF" stroke="#F0EDFF" /><text x="397" y="294" font-size="12" fill="#5B4BC4" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >系统推断（system-inferred）</text><text x="282" y="332" font-size="20" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >当前未生成建议</text><text x="282" y="372" font-size="14" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >缺少已接入来源趋势（7/30/90 日）。</text><text x="282" y="391.88" font-size="14" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >不会补造置信度、薪资或成功保证。</text><text x="282" y="411.76" font-size="14" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >可查看未来建议所需证据清单。</text><rect x="282" y="438" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#D0D7DE" /><text x="357" y="449" font-size="14" fill="#17212B" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >查看所需证据</text><rect x="826" y="190" width="590" height="360" rx="10" fill="#FFFFFF" stroke="#D0D7DE" /><text x="844" y="206" font-size="16" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >变化概览</text><text x="844" y="233" font-size="12" fill="#475467" font-weight="400" text-anchor="start" dominant-baseline="hanging" >公共历史可读；个人变化为演示数据</text><text x="850" y="270" font-size="13" fill="#1D4ED8" font-weight="700" text-anchor="start" dominant-baseline="hanging" >2026-08-03</text><text x="960" y="270" font-size="14" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >获批研究快照 v1.0</text><text x="850" y="318" font-size="13" fill="#1D4ED8" font-weight="700" text-anchor="start" dominant-baseline="hanging" >2026-08-14</text><text x="960" y="318" font-size="14" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >来源研究清单获批（research-only）</text><text x="850" y="366" font-size="13" fill="#B4233C" font-weight="700" text-anchor="start" dominant-baseline="hanging" >当前</text><text x="960" y="366" font-size="14" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >运行时来源 0 · 招聘实例 0</text><rect x="850" y="416" width="185" height="28" rx="14" fill="#FFF3E0" stroke="#FFF3E0" /><text x="942.5" y="422" font-size="12" fill="#8A4B08" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >演示数据 · 用户提供</text><text x="1048" y="423" font-size="13" fill="#475467" font-weight="600" text-anchor="start" dominant-baseline="hanging" >个人路线历史未接通</text><rect x="240" y="572" width="1176" height="366" rx="10" fill="#FFFFFF" stroke="#D0D7DE" /><text x="258" y="588" font-size="16" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >历史时间线与“当时依据”</text><text x="258" y="615" font-size="12" fill="#475467" font-weight="400" text-anchor="start" dominant-baseline="hanging" >发生时间、发现时间、公共快照、个人版本和规则版本分开保存</text><circle cx="286" cy="664" r="8" fill="#1D4ED8" stroke="#1D4ED8" stroke-width="2"/><line x1="286" y1="672" x2="286" y2="738" stroke="#D0D7DE" stroke-width="2" /><text x="316" y="650" font-size="12" fill="#475467" font-weight="600" text-anchor="start" dominant-baseline="hanging" >发生 08-03 · 发现 08-03</text><text x="540" y="650" font-size="14" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >公共快照 research-20260803</text><text x="900" y="650" font-size="13" fill="#17212B" font-weight="500" text-anchor="start" dominant-baseline="hanging" >证据截止、样本边界、规则 r1</text><text x="1284" y="650" font-size="12" fill="#0B6B63" font-weight="700" text-anchor="start" dominant-baseline="hanging" >当时依据</text><circle cx="286" cy="746" r="8" fill="#1D4ED8" stroke="#1D4ED8" stroke-width="2"/><line x1="286" y1="754" x2="286" y2="820" stroke="#D0D7DE" stroke-width="2" /><text x="316" y="732" font-size="12" fill="#475467" font-weight="600" text-anchor="start" dominant-baseline="hanging" >发生 08-14 · 发现 08-14</text><text x="540" y="732" font-size="14" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >来源清单 source-allowlist-v1</text><text x="900" y="732" font-size="13" fill="#17212B" font-weight="500" text-anchor="start" dominant-baseline="hanging" >政策允许，不代表接入</text><text x="1284" y="732" font-size="12" fill="#0B6B63" font-weight="700" text-anchor="start" dominant-baseline="hanging" >当时依据</text><circle cx="286" cy="828" r="8" fill="#8A4B08" stroke="#8A4B08" stroke-width="2"/><text x="316" y="814" font-size="12" fill="#475467" font-weight="600" text-anchor="start" dominant-baseline="hanging" >目标态演示 · 当前未接通</text><text x="540" y="814" font-size="14" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >个人事实版本 user-v3</text><text x="900" y="814" font-size="13" fill="#17212B" font-weight="500" text-anchor="start" dominant-baseline="hanging" >演示数据 · 用户提供</text><text x="1284" y="814" font-size="12" fill="#0B6B63" font-weight="700" text-anchor="start" dominant-baseline="hanging" >当时依据</text><line x1="226" y1="992" x2="1190" y2="992" stroke="#D0D7DE" stroke-width="1" /><text x="226" y="998" font-size="11" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >待审设计 · 非业务实现</text><text x="1416" y="998" font-size="11" fill="#475467" font-weight="500" text-anchor="end" dominant-baseline="hanging" >CR-UI-002 v1.3</text><g id="v1-3-complete-truth-overlay"><rect x="32" y="96" width="1376" height="52" rx="8" fill="#FDECEF" stroke="#B4233C" data-complete-truth-strip="true" data-surface="mixed"/><text x="52" y="113" font-size="14" fill="#B4233C" font-weight="750" text-anchor="start" dominant-baseline="hanging" >公共：获批历史研究快照（运行时来源 0） · 个人：演示数据·用户提供 · 规则：系统配置</text><text x="1390" y="113" font-size="13" fill="#B4233C" font-weight="700" text-anchor="end" dominant-baseline="hanging" >CR-UI-002 v1.3</text></g></svg>