<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc" ><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}*{shape-rendering:geometricPrecision;text-rendering:optimizeLegibility}</style><title id="title">24-components-states.svg</title><desc id="desc">Frontend Career Radar CR-UI-002 v1.3 可追溯设计原型</desc><rect x="0" y="0" width="1440" height="1024" rx="0" fill="#F6F8FA" stroke="#F6F8FA" /><text x="32" y="24" font-size="28" fill="#17212B" font-weight="800" text-anchor="start" dominant-baseline="hanging" >组件与状态规范</text><text x="32" y="62" font-size="14" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >触控区域以实际矩形为准；焦点环只是可见反馈，不能代替 44px 触控面积。</text><rect x="32" y="96" width="1376" height="52" rx="8" fill="#FDECEF" stroke="#B4233C" data-complete-truth-strip="true" data-surface="mixed"/><text x="52" y="113" font-size="14" fill="#B4233C" font-weight="750" text-anchor="start" dominant-baseline="hanging" >公共：获批历史研究快照（运行时来源 0） · 个人：演示数据·用户提供 · 规则：系统配置</text><text x="1390" y="113" font-size="13" fill="#B4233C" font-weight="700" text-anchor="end" dominant-baseline="hanging" >CR-UI-002 v1.3</text><rect x="32" y="170" width="650" height="320" rx="10" fill="#FFFFFF" stroke="#C8D0DA" /><text x="50" y="186" font-size="17" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >确认弹窗按钮</text><text x="50" y="215" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >取消默认焦点；两个实际按钮均为 48px 高</text><rect x="54" y="246" width="606" height="190" rx="10" fill="#FFFFFF" stroke="#C8D0DA" id="confirmation-dialog"/><text x="76" y="268" font-size="18" fill="#17212B" font-weight="800" text-anchor="start" dominant-baseline="hanging" >确认删除这条证据？</text><text x="76" y="306" font-size="14" fill="#475467" font-weight="600" text-anchor="start" dominant-baseline="hanging" >删除后相关差距将回到未知并等待重算。</text><rect x="72" y="346" width="202" height="60" rx="10" fill="none" stroke="#1D4ED8" stroke-width="3" data-focus-ring-for="cancel"/><rect x="78" y="352" width="190" height="48" rx="8" fill="#FFFFFF" stroke="#C8D0DA" data-button-id="cancel" data-touch-rect="true"/><text x="173" y="368" font-size="16" fill="#17212B" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >取消</text><rect x="450" y="352" width="190" height="48" rx="8" fill="#FFFFFF" stroke="#C8D0DA" data-button-id="confirm" data-touch-rect="true"/><text x="545" y="368" font-size="16" fill="#17212B" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >确认删除</text><rect x="710" y="170" width="698" height="320" rx="10" fill="#FFFFFF" stroke="#C8D0DA" /><text x="728" y="186" font-size="17" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >状态与播报</text><text x="728" y="215" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >颜色、图形和简中文字同时存在</text><rect x="734" y="246" width="112" height="30" rx="15" fill="#FFF3E0" stroke="#FFF3E0" /><text x="790" y="253" font-size="13" fill="#8A4B08" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >未就绪</text><rect x="860" y="246" width="112" height="30" rx="15" fill="#FDECEF" stroke="#FDECEF" /><text x="916" y="253" font-size="13" fill="#B4233C" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >不可用</text><rect x="986" y="246" width="112" height="30" rx="15" fill="#EAF1FF" stroke="#EAF1FF" /><text x="1042" y="253" font-size="13" fill="#1D4ED8" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >处理中</text><rect x="1112" y="246" width="112" height="30" rx="15" fill="#E7F5EE" stroke="#E7F5EE" /><text x="1168" y="253" font-size="13" fill="#067647" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >已保存</text><text x="734" y="304" font-size="15" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" >读屏：状态变化礼貌播报</text><text x="734" y="342" font-size="15" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" >错误：关联字段并移动焦点</text><text x="734" y="380" font-size="15" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" >减少动效：移除位移，保留反馈</text><rect x="32" y="522" width="1376" height="432" rx="10" fill="#FFFFFF" stroke="#C8D0DA" /><text x="50" y="538" font-size="17" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >输入、按钮与空态尺寸</text><text x="50" y="567" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >正文16px；辅助14px；触控区域≥44px；键盘焦点清晰可见</text><rect x="54" y="604" width="622" height="64" rx="8" fill="#FFFFFF" stroke="#C8D0DA" /><text x="72" y="622" font-size="16" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" >输入框默认态 · 1–100,000 Unicode</text><rect x="54" y="696" width="622" height="64" rx="8" fill="#FFFFFF" stroke="#B4233C" /><text x="72" y="714" font-size="16" fill="#B4233C" font-weight="700" text-anchor="start" dominant-baseline="hanging" >错误态 · 请删除敏感内容或取消处理</text><rect x="732" y="604" width="190" height="48" rx="8" fill="#0B6B63" stroke="#0B6B63" data-button-id="primary" data-touch-rect="true"/><text x="827" y="620" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >主操作</text><rect x="940" y="604" width="190" height="48" rx="8" fill="#FFFFFF" stroke="#C8D0DA" data-button-id="secondary" data-touch-rect="true"/><text x="1035" y="620" font-size="16" fill="#17212B" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >次操作</text><rect x="732" y="696" width="620" height="124" rx="8" fill="#EEF1F4" stroke="#C8D0DA" /><text x="1042" y="724" font-size="16" fill="#17212B" font-weight="750" text-anchor="middle" dominant-baseline="hanging" >当前条件下暂无数据</text><text x="1042" y="758" font-size="14" fill="#475467" font-weight="600" text-anchor="middle" dominant-baseline="hanging" >显示原因、保留筛选，并提供重置入口</text></svg>