<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc" data-step-label-mode="single"><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}*{shape-rendering:geometricPrecision;text-rendering:optimizeLegibility}</style><title id="title">11-flow-01-workbench-six-step.svg</title><desc id="desc">Frontend Career Radar CR-UI-002 v1.3 可追溯设计原型</desc><rect x="0" y="0" width="1440" height="1024" rx="0" fill="#F6F8FA" stroke="#F6F8FA" /><text x="32" y="24" font-size="28" fill="#17212B" font-weight="800" text-anchor="start" dominant-baseline="hanging" >关键流程 01 · 信息源六步工作台</text><text x="32" y="62" font-size="14" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >每一步只出现一次；失败保留输入并局部重试。</text><rect x="32" y="96" width="1376" height="52" rx="8" fill="#FDECEF" stroke="#B4233C" data-complete-truth-strip="true" data-surface="private"/><text x="52" y="113" font-size="14" fill="#B4233C" font-weight="750" text-anchor="start" dominant-baseline="hanging" >演示数据 · 用户提供 · 非真实用户档案 · 未经授权不外发</text><text x="1390" y="113" font-size="13" fill="#B4233C" font-weight="700" text-anchor="end" dominant-baseline="hanging" >CR-UI-002 v1.3</text><g data-flow-step="1"><rect x="38" y="214" width="208" height="150" rx="10" fill="#E8F5F2" stroke="#0B6B63" /><circle cx="68" cy="242" r="18" fill="#0B6B63" stroke="#0B6B63" stroke-width="2" /><text x="68" y="233" font-size="14" fill="#FFFFFF" font-weight="800" text-anchor="middle" dominant-baseline="hanging" >1</text><text x="58" y="286" font-size="16" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >输入内容</text><text x="58" y="320" font-size="13" fill="#475467" font-weight="550" text-anchor="start" dominant-baseline="hanging" >完成后进入下一步</text></g><line x1="246" y1="289" x2="269" y2="289" stroke="#C8D0DA" stroke-width="3" /><g data-flow-step="2"><rect x="269" y="214" width="208" height="150" rx="10" fill="#FFFFFF" stroke="#C8D0DA" /><circle cx="299" cy="242" r="18" fill="#FFFFFF" stroke="#C8D0DA" stroke-width="2" /><text x="299" y="233" font-size="14" fill="#17212B" font-weight="800" text-anchor="middle" dominant-baseline="hanging" >2</text><text x="289" y="286" font-size="16" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >补充元数据</text><text x="289" y="320" font-size="13" fill="#475467" font-weight="550" text-anchor="start" dominant-baseline="hanging" >完成后进入下一步</text></g><line x1="477" y1="289" x2="500" y2="289" stroke="#C8D0DA" stroke-width="3" /><g data-flow-step="3"><rect x="500" y="214" width="208" height="150" rx="10" fill="#FFFFFF" stroke="#C8D0DA" /><circle cx="530" cy="242" r="18" fill="#FFFFFF" stroke="#C8D0DA" stroke-width="2" /><text x="530" y="233" font-size="14" fill="#17212B" font-weight="800" text-anchor="middle" dominant-baseline="hanging" >3</text><text x="520" y="286" font-size="16" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >双轴建议</text><text x="520" y="320" font-size="13" fill="#475467" font-weight="550" text-anchor="start" dominant-baseline="hanging" >完成后进入下一步</text></g><line x1="708" y1="289" x2="731" y2="289" stroke="#C8D0DA" stroke-width="3" /><g data-flow-step="4"><rect x="731" y="214" width="208" height="150" rx="10" fill="#FFFFFF" stroke="#C8D0DA" /><circle cx="761" cy="242" r="18" fill="#FFFFFF" stroke="#C8D0DA" stroke-width="2" /><text x="761" y="233" font-size="14" fill="#17212B" font-weight="800" text-anchor="middle" dominant-baseline="hanging" >4</text><text x="751" y="286" font-size="16" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >人工确认</text><text x="751" y="320" font-size="13" fill="#475467" font-weight="550" text-anchor="start" dominant-baseline="hanging" >完成后进入下一步</text></g><line x1="939" y1="289" x2="962" y2="289" stroke="#C8D0DA" stroke-width="3" /><g data-flow-step="5"><rect x="962" y="214" width="208" height="150" rx="10" fill="#FFFFFF" stroke="#C8D0DA" /><circle cx="992" cy="242" r="18" fill="#FFFFFF" stroke="#C8D0DA" stroke-width="2" /><text x="992" y="233" font-size="14" fill="#17212B" font-weight="800" text-anchor="middle" dominant-baseline="hanging" >5</text><text x="982" y="286" font-size="16" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >互斥关系</text><text x="982" y="320" font-size="13" fill="#475467" font-weight="550" text-anchor="start" dominant-baseline="hanging" >完成后进入下一步</text></g><line x1="1170" y1="289" x2="1193" y2="289" stroke="#C8D0DA" stroke-width="3" /><g data-flow-step="6"><rect x="1193" y="214" width="208" height="150" rx="10" fill="#FFFFFF" stroke="#C8D0DA" /><circle cx="1223" cy="242" r="18" fill="#FFFFFF" stroke="#C8D0DA" stroke-width="2" /><text x="1223" y="233" font-size="14" fill="#17212B" font-weight="800" text-anchor="middle" dominant-baseline="hanging" >6</text><text x="1213" y="286" font-size="16" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >保存或仅本次</text><text x="1213" y="320" font-size="13" fill="#475467" font-weight="550" text-anchor="start" dominant-baseline="hanging" >明确保存边界</text></g><rect x="32" y="400" width="880" height="250" rx="10" fill="#FFFFFF" stroke="#C8D0DA" /><text x="50" y="416" font-size="17" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >当前步骤 · 输入内容</text><text x="50" y="445" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >1–100,000 Unicode；空白、URL-only、超长、敏感信息均给明确状态</text><rect x="54" y="476" width="836" height="112" rx="8" fill="#FFFFFF" stroke="#C8D0DA" /><text x="72" y="494" font-size="15" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >粘贴职位描述、招聘网址、简历片段或学习记录…</text><text x="872" y="556" font-size="14" fill="#475467" font-weight="650" text-anchor="end" dominant-baseline="hanging" >0 / 100,000 Unicode</text><rect x="694" y="602" width="196" height="48" rx="8" fill="#0B6B63" stroke="#0B6B63" data-button-id="workbench-next" data-touch-rect="true"/><text x="792" y="618" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >继续：补充元数据</text><rect x="936" y="400" width="472" height="250" rx="10" fill="#FFFFFF" stroke="#C8D0DA" /><text x="954" y="416" font-size="17" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >恢复规则</text><text x="954" y="445" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >不会从头重跑已成功步骤</text><text x="958" y="474" font-size="15" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" >· 处理中：逐步播报当前阶段</text><text x="958" y="508" font-size="15" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" >· 部分成功：保留成功项</text><text x="958" y="542" font-size="15" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" >· 失败：保留输入与人工修正</text><text x="958" y="576" font-size="15" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" >· 重试：只重试失败步骤</text><rect x="32" y="678" width="1376" height="302" rx="10" fill="#FFFFFF" stroke="#C8D0DA" /><text x="50" y="694" font-size="17" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >流程边界</text><text x="50" y="723" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >六类研究关系互斥；未知差距不生成路线；未经授权不长期保存或第三方传输</text><rect x="54" y="760" width="150" height="30" rx="15" fill="#EAF1FF" stroke="#EAF1FF" /><text x="129" y="767" font-size="13" fill="#1D4ED8" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >当前步骤 1 / 6</text><rect x="220" y="760" width="120" height="30" rx="15" fill="#EEF1F4" stroke="#EEF1F4" /><text x="280" y="767" font-size="13" fill="#475467" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >已完成 0</text><rect x="356" y="760" width="120" height="30" rx="15" fill="#FFF3E0" stroke="#FFF3E0" /><text x="416" y="767" font-size="13" fill="#8A4B08" font-weight="700" text-anchor="middle" dominant-baseline="hanging" >待处理 5</text><text x="54" y="820" font-size="15" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" >键盘：Tab 顺序与视觉顺序一致；Escape 关闭非破坏弹窗。</text><text x="54" y="852" font-size="15" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" >读屏：步骤、状态、错误和重试结果使用礼貌状态播报。</text></svg>