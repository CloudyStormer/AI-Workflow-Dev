<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc" data-browser-zoom="200" data-horizontal-scroll="false" data-overlap="false"><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}*{shape-rendering:geometricPrecision;text-rendering:optimizeLegibility}</style><title id="title">28-accessibility-zoom-200.svg</title><desc id="desc">Frontend Career Radar CR-UI-002 v1.3 可追溯设计原型</desc><rect x="0" y="0" width="1440" height="1024" rx="0" fill="#F6F8FA" stroke="#F6F8FA" /><text x="32" y="24" font-size="28" fill="#17212B" font-weight="800" text-anchor="start" dominant-baseline="hanging" >浏览器 200%：有效 CSS 视口减半并回流</text><text x="32" y="64" font-size="14" fill="#475467" font-weight="600" text-anchor="start" dominant-baseline="hanging" >同一 base token 计算；右侧物理渲染值必须等于左侧基准值 ×2。</text><rect x="32" y="118" width="600" height="820" rx="8" fill="#FFFFFF" stroke="#C8D0DA" id="zoom-base-card" stroke-width="1"/><text x="48" y="136" font-size="24" fill="#17212B" font-weight="800" text-anchor="start" dominant-baseline="hanging" id="zoom-base-title">100% 基准 token</text><text x="48" y="184" font-size="16" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" id="zoom-base-body">CSS 视口 720px · 物理缩放 1×</text><rect x="48" y="232" width="568" height="214" rx="8" fill="#EEF1F4" stroke="#C8D0DA" id="zoom-base-inner" stroke-width="1"/><text x="64" y="248" font-size="16" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >卡片内容</text><text x="64" y="286" font-size="16" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" >正文 16px · 辅助 14px</text><text x="64" y="326" font-size="14" fill="#475467" font-weight="600" text-anchor="start" dominant-baseline="hanging" id="zoom-base-helper">padding 16 · radius 8 · border 1</text><rect x="64" y="374" width="220" height="44" rx="8" fill="#0B6B63" strok