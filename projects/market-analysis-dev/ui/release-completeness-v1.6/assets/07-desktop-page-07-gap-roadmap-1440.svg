</style><title id="title">07-desktop-page-07-gap-roadmap-1440.svg</title><desc id="desc">Frontend Career Radar CR-UI-002 v1.6 可复核设计原型</desc><rect x="0" y="0" width="1440" height="1024" rx="0" fill="#F6F8FA" stroke="#F6F8FA" /><rect x="0" y="0" width="220" height="1024" rx="0" fill="#FFFFFF" stroke="#D0D7DE" /><text x="24" y="26" font-size="17" fill="#17212B" font-weight="800" text-anchor="start" dominant-baseline="hanging" >Frontend Career Radar</text><text x="24" y="54" font-size="12" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >发布完整性原型 v1.2</text><text x="30" y="132" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >01 职业方向总览</text><text x="30" y="180" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >02 技术栈全景</text><text x="30" y="228" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >03 市场证据与趋势</text><text x="30" y="276" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >04 来源与质量</text><text x="30" y="324" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >05 信息源工作台</text><text x="30" y="372" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >06 个人证据档案</text><rect x="18" y="412" width="188" height="36" rx="7" fill="#E8F5F2" stroke="#E8F5F2" /><text x="30" y="420" font-size="13" fill="#0B6B63" font-weight="750" text-anchor="start" dominant-baseline="hanging" >07 差距与成长路线</text><text x="30" y="468" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >08 未来方向与历史</text><text x="30" y="516" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >09 账号与数据权利</text><text x="30" y="564" font-size="13" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >10 质量与恢复</text><text x="238" y="22" font-size="28" fill="#17212B" font-weight="760" text-anchor="start" dominant-baseline="hanging" >07 差距与成长路线</text><text x="238" y="56" font-size="13" fill="#475467" font-weight="450" text-anchor="start" dominant-baseline="hanging" >未知态先补输入；证据不足时绝不生成确定路线。</text><rect x="226" y="78" width="1190" height="42" rx="7" fill="#FDECEF" stroke="#FDECEF" /><text x="244" y="90" font-size="13" fill="#B4233C" font-weight="800" text-anchor="start" dominant-baseline="hanging" >当前真实状态</text><text x="445" y="90" font-size="13" fill="#B4233C" font-weight="650" text-anchor="start" dominant-baseline="hanging" >研究清单已批准 · 运行时来源 0 · 连接器 0 · 招聘实例 0</text><text x="1210" y="90" font-size="12" fill="#B4233C" font-weight="700" text-anchor="start" dominant-baseline="hanging" >禁止冒充实时</text><rect x="244" y="140" width="185" height="28" rx="14" fill="#FFF3E0" stroke="#FFF3E0" /><text x="336.5" y="146" font-size="12" fill="#8A4B08" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >演示数据 · 用户提供</text><rect x="442" y="140" width="190" height="28" rx="14" fill="#FDECEF" stroke="#FDECEF" /><text x="537" y="146" font-size="12" fill="#B4233C" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >当前差距保持未知</text><text x="646" y="147" font-size="13" fill="#B4233C" font-weight="700" text-anchor="start" dominant-baseline="hanging" >缺少任一输入时，不生成路线、优先级或个人分数</text><rect x="240" y="190" width="1176" height="205" rx="10" fill="#FFFFFF" stroke="#D0D7DE" /><text x="258" y="206" font-size="16" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >差距计算的三个必要输入</text><text x="258" y="233" font-size="12" fill="#475467" font-weight="400" text-anchor="start" dominant-baseline="hanging" >三项必须同时成立</text><rect x="260" y="260" width="350" height="104" rx="8" fill="#FFFFFF" stroke="#D0D7DE" /><text x="278" y="278" font-size="13" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >目标方向／层级</text><rect x="278" y="314" width="110" height="28" rx="14" fill="#FDECEF" stroke="#FDECEF" /><text x="333" y="320" font-size="12" fill="#B4233C" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >未确认</text><rect x="462" y="306" width="128" height="40" rx="8" fill="#FFFFFF" stroke="#D0D7DE" /><text x="526" y="317" font-size="14" fill="#17212B" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >确认目标</text><rect x="638" y="260" width="350" height="104" rx="8" fill="#FFFFFF" stroke="#D0D7DE" /><text x="656" y="278" font-size="13" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >公共能力要求版本</text><rect x="656" y="314" width="110" height="28" rx="14" fill="#E7F5EE" stroke="#E7F5EE" /><text x="711" y="320" font-size="12" fill="#067647" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >获批历史快照</text><rect x="840" y="306" width="128" height="40" rx="8" fill="#FFFFFF" stroke="#D0D7DE" /><text x="904" y="317" font-size="14" fill="#17212B" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >查看版本</text><rect x="1016" y="260" width="350" height="104" rx="8" fill="#FFFFFF" stroke="#D0D7DE" /><text x="1034" y="278" font-size="13" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >个人可用证据</text><rect x="1034" y="314" width="110" height="28" rx="14" fill="#FDECEF" stroke="#FDECEF" /><text x="1089" y="320" font-size="12" fill="#B4233C" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >不足</text><rect x="1218" y="306" width="128" height="40" rx="8" fill="#FFFFFF" stroke="#D0D7DE" /><text x="1282" y="317" font-size="14" fill="#17212B" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >补充证据</text><rect x="240" y="418" width="1176" height="350" rx="10" fill="#FFFFFF" stroke="#D0D7DE" /><text x="258" y="434" font-size="16" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >未知态：路线不得生成</text><text x="258" y="461" font-size="12" fill="#475467" font-weight="400" text-anchor="start" dominant-baseline="hanging" >只提供补证据与确认入口</text><rect x="262" y="486" width="1132" height="210" rx="8" fill="#F9FAFB" stroke="#D0D7DE" /><circle cx="430" cy="590" r="52" fill="#FFFFFF" stroke="#475467" stroke-width="3"/><text x="430" y="570" font-size="32" fill="#475467" font-weight="800" text-anchor="middle" dominant-baseline="hanging" >?</text><text x="520" y="520" font-size="22" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >当前无法判断差距</text><text x="520" y="562" font-size="15" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >目标方向或层级尚未确认；个人证据不足。</text><text x="520" y="583.3" font-size="15" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >系统不会生成三步路线、学习优先级或“已掌握”结论。</text><text x="520" y="604.6" font-size="15" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >补齐后才进入差距矩阵与路线草案。</text><rect x="520" y="650" width="132" height="40" rx="8" fill="#0B6B63" stroke="#0B6B63" /><text x="586" y="661" font-size="14" fill="#FFFFFF" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >确认目标</text><rect x="666" y="650" width="132" height="40" rx="8" fill="#FFFFFF" stroke="#D0D7DE" /><text x="732" y="661" font-size="14" fill="#17212B" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >补充证据</text><rect x="240" y="790" width="1176" height="150" rx="10" fill="#FFFFFF" stroke="#D0D7DE" /><text x="258" y="806" font-size="16" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >路线区域</text><text x="258" y="833" font-size="12" fill="#475467" font-weight="400" text-anchor="start" dominant-baseline="hanging" >未生成</text><rect x="260" y="852" width="205" height="28" rx="14" fill="#EEF1F4" stroke="#EEF1F4" /><text x="362.5" y="858" font-size="12" fill="#475467" font-weight="650" text-anchor="middle" dominant-baseline="hanging" >暂无路线（证据不足）</text><text x="486" y="858" font-size="13" fill="#475467" font-weight="600" text-anchor="start" dominant-baseline="hanging" >允许动作：补证据、确认目标、查看公共要求；不允许生成确定路线。</text><line x1="226" y1="992" x2="1190" y2="992" stroke="#D0D7DE" stroke-width="1" /><text x="226" y="998" font-size="11" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >待审设计 · 非业务实现</text><text x="1416" y="998" font-size="11" fill="#475467" font-weight="500" text-anchor="end" dominant-baseline="hanging" >CR-UI-002 v1.6</text></svg>