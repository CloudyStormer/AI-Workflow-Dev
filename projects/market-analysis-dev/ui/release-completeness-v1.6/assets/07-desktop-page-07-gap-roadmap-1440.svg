<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc" ><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}*{shape-rendering:geometricPrecision;text-rendering:optimizeLegibility}</style><title id="title">07-desktop-page-07-gap-roadmap-1440.svg</title><desc id="desc">Frontend Career Radar CR-UI-002 v1.6 机器可复核设计原型</desc><style>
