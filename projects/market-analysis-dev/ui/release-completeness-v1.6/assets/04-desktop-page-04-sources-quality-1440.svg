<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc" data-desktop-page="04" data-overlap-guard="computed"><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}*{shape-rendering:geometricPrecision;text-rendering:geometricPrecision}</style><title id="title">04 来源与质量</title><desc id="desc">前端职业成长雷达发布完整性 v1.6 版本化设计原型</desc><rect x="0" y="0" width="1440" height="1024" rx="0" fill="#F5F7FA" stroke="#F5F7FA" /><rect x="32" y="22" width="1376" height="44" rx="0" fill="#F5F7FA" stroke="#F5F7FA" id="header-title" data-layout-container="true" /><text x="32" y="28" font-size="28" fill="#17212B" font-weight="800" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="header-title" >04 来源与质量</text><rect x="32" y="68" width="1376" height="28" rx="0" fill="#F5F7FA" stroke="#F5F7FA" id="header-subtitle" data-layout-container="true" /><text x="32" y="72" font-size="14" fill="#475467" font-weight="550" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="header-subtitle" >研究政策与运行时事实分轴呈现；状态条、筛选器和内容卡互不遮挡。</text><rect x="32" y="106" width="1376" height="48" rx="8" fill="#FDECEF" stroke="#B4233C" id="truth-strip" data-layout-container="true" data-complete-truth-strip="true" data-surface="public"/><text x="50" y="122" font-size="14" fill="#B4233C" font-weight="750" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="truth-strip" >研究清单已批准 · 当前来源 0 · 连接器 0 · 招聘实例 0</text><text x="1390" y="122" font-size="13" fill="#B4233C" font-weight="700" text-anchor="end" dominant-baseline="hanging" data-layout-text="true" data-container-ref="truth-strip" >CR-UI-002 v1.6</text><rect x="32" y="174" width="1376" height="76" rx="10" fill="#FFFFFF" stroke="#B8C2CC" id="filters-04" data-layout-container="true" /><rect x="52" y="194" width="210" height="36" rx="18" fill="#EAF1FF" stroke="#1849A9" id="chip-04-0" data-layout-container="true" /><text x="157" y="217" font-size="14" fill="#1849A9" font-weight="700" text-anchor="middle" dominant-baseline="middle" data-layout-text="true" data-container-ref="chip-04-0" data-authored-baseline-offset="5">政策：全部</text><rect x="282" y="194" width="210" height="36" rx="18" fill="#EAF1FF" stroke="#1849A9" id="chip-04-1" data-layout-container="true" /><text x="387" y="217" font-size="14" fill="#1849A9" font-weight="700" text-anchor="middle" dominant-baseline="middle" data-layout-text="true" data-container-ref="chip-04-1" data-authored-baseline-offset="5">运行时：未配置</text><rect x="512" y="194" width="210" height="36" rx="18" fill="#EAF1FF" stroke="#1849A9" id="chip-04-2" data-layout-container="true" /><text x="617" y="217" font-size="14" fill="#1849A9" font-weight="700" text-anchor="middle" dominant-baseline="middle" data-layout-text="true" data-container-ref="chip-04-2" data-authored-baseline-offset="5">窗口：48小时</text><rect x="32" y="282" width="435" height="270" rx="10" fill="#FFFFFF" stroke="#B8C2CC" id="card-04-0" data-layout-container="true" /><text x="54" y="304" font-size="20" fill="#17212B" font-weight="800" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="card-04-0" >政策清单</text><text x="54" y="350" font-size="15" fill="#17212B" font-weight="650" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="card-04-0" >技术端点 13 · 条件模板 3</text><text x="54" y="392" font-size="14" fill="#475467" font-weight="550" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="card-04-0" >批准只代表研究使用范围</text><rect x="491" y="282" width="435" height="270" rx="10" fill="#FFFFFF" stroke="#B8C2CC" id="card-04-1" data-layout-container="true" /><text x="513" y="304" font-size="20" fill="#17212B" font-weight="800" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="card-04-1" >运行时来源</text><text x="513" y="350" font-size="15" fill="#17212B" font-weight="650" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="card-04-1" >0 个来源 · 0 个连接器</text><text x="513" y="392" font-size="14" fill="#475467" font-weight="550" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="card-04-1" >尚未接入，不显示成功时间块</text><rect x="950" y="282" width="435" height="270" rx="10" fill="#FFFFFF" stroke="#B8C2CC" id="card-04-2" data-layout-container="true" /><text x="972" y="304" font-size="20" fill="#17212B" font-weight="800" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="card-04-2" >质量说明</text><text x="972" y="350" font-size="15" fill="#17212B" font-weight="650" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="card-04-2" >招聘实例 0</text><text x="972" y="392" font-size="14" fill="#475467" font-weight="550" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="card-04-2" >不可外推市场份额</text><rect x="32" y="584" width="1376" height="360" rx="10" fill="#FFFFFF" stroke="#B8C2CC" id="detail-04" data-layout-container="true" /><text x="54" y="608" font-size="18" fill="#17212B" font-weight="800" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="detail-04" >当前页面说明</text><text x="54" y="656" font-size="16" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="detail-04" >所有状态同时使用文字、形状和图标，不以颜色作为唯一编码。</text><text x="54" y="704" font-size="16" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="detail-04" >键盘焦点顺序与视觉顺序一致；状态变化使用礼貌播报。</text><text x="54" y="752" font-size="16" fill="#B4233C" font-weight="700" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="detail-04" >当前无真实运行时来源、真实账号服务或获批招聘实例。</text></svg>