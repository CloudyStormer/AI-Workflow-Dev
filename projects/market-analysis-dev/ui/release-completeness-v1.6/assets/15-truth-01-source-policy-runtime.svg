<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc" ><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}*{shape-rendering:geometricPrecision;text-rendering:optimizeLegibility}</style><title id="title">15-truth-01-source-policy-runtime.svg</title><desc id="desc">Frontend Career Radar CR-UI-002 v1.6 机器可复核设计原型</desc><rect x="0" y="0" width="1440" height="1024" rx="0" fill="#F6F8FA" stroke="#F6F8FA" /><text x="32" y="24" font-size="28" fill="#17212B" font-weight="800" text-anchor="start" dominant-baseline="hanging" >真相态 01 · 来源政策轴 × 运行时轴</text><text x="32" y="62" font-size="14" fill="#475467" font-weight="500" text-anchor="start" dominant-baseline="hanging" >失败与停用仅是允许呈现的状态示例；当前没有连接器运行历史。</text><rect x="32" y="96" width="1376" height="48" rx="8" fill="#FDECEF" stroke="#FDECEF" /><text x="52" y="111" font-size="14" fill="#B4233C" font-weight="750" text-anchor="start" dominant-baseline="hanging" >研究清单已批准 · 来源 0 · 连接器 0 · 招聘实例 0</text><text x="1400" y="111" font-size="13" fill="#B4233C" font-weight="700" text-anchor="end" dominant-baseline="hanging" >CR-UI-002 v1.6</text><rect x="32" y="166" width="1376" height="740" rx="10" fill="#FFFFFF" stroke="#C8D0DA" /><text x="50" y="182" font-size="17" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" >政策决策与运行时必须分列</text><text x="50" y="211" font-size="13" fill="#475467" font-weight="450" text-anchor="start" dominant-baseline="hanging" >当前事实：13 个 允许 技术端点、3 个 有条件允许 ATS 模板、连接器 0、招聘实例 0</text><text x="58" y="238" font-size="14" fill="#475467" font-weight="750" text-anchor="start" dominant-baseline="hanging" >来源类别</text><text x="350" y="238" font-size="14" fill="#475467" font-weight="750" text-anchor="start" dominant-baseline="hanging" >政策轴</text><text x="610" y="238" font-size="14" fill="#475467" font-weight="750" text-anchor="start" dominant-baseline="hanging" >运行时轴</text><text x="850" y="238" font-size="14" fill="#475467" font-weight="750" text-anchor="start" dominant-baseline="hanging" >是否有运行历史</text><text x="1080" y="238" font-size="14" fill="#475467" font-weight="750" text-anchor="start" dominant-baseline="hanging" >允许呈现的解释</text><text x="58" y="304" font-size="14" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >官方技术端点（13）</text><text x="350" y="304" font-size="14" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >允许</text><text x="610" y="304" font-size="14" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >未配置</text><text x="850" y="304" font-size="14" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >无</text><text x="1080" y="304" font-size="14" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >研究允许；尚未接入</text><line x1="54" y1="358" x2="1386" y2="358" stroke="#C8D0DA" stroke-width="1" /><text x="58" y="404" font-size="14" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >ATS 条件模板（3）</text><text x="350" y="404" font-size="14" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >有条件允许</text><text x="610" y="404" font-size="14" fill="#17212B" font-weight="700" text-anchor="start" dominant-baseline="hanging" >未配置</text><text x="850" y="404" font-size="14" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >无</text><text x="1080" y="404" font-size="14" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >缺公司/board/site 允许清单</text><line x1="54" y1="458" x2="1386" y2="458" stroke="#C8D0DA" stroke-width="1" /><text x="58" y="504" font-size="14" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >受限来源</text><text x="350" y="504" font-size="14" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >停用</text><text x="610" y="504" font-size="14" fill="#8A4B08" font-weight="700" text-anchor="start" dominant-baseline="hanging" >已停用（示例）</text><text x="850" y="504" font-size="14" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >无</text><text x="1080" y="504" font-size="14" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >允许呈现的状态示例 · 无运行历史</text><line x1="54" y1="558" x2="1386" y2="558" stroke="#C8D0DA" stroke-width="1" /><text x="58" y="604" font-size="14" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >未来技术连接器</text><text x="350" y="604" font-size="14" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >允许</text><text x="610" y="604" font-size="14" fill="#8A4B08" font-weight="700" text-anchor="start" dominant-baseline="hanging" >部分失败（示例）</text><text x="850" y="604" font-size="14" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >无</text><text x="1080" y="604" font-size="14" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >允许呈现的状态示例 · 当前未接通</text><line x1="54" y1="658" x2="1386" y2="658" stroke="#C8D0DA" stroke-width="1" /><text x="58" y="704" font-size="14" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >未来招聘连接器</text><text x="350" y="704" font-size="14" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >有条件允许</text><text x="610" y="704" font-size="14" fill="#8A4B08" font-weight="700" text-anchor="start" dominant-baseline="hanging" >失败（示例）</text><text x="850" y="704" font-size="14" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >无</text><text x="1080" y="704" font-size="14" fill="#17212B" font-weight="550" text-anchor="start" dominant-baseline="hanging" >允许呈现的状态示例 · 当前无实例</text><line x1="54" y1="758" x2="1386" y2="758" stroke="#C8D0DA" stroke-width="1" /><rect x="54" y="802" width="1332" height="76" rx="8" fill="#FFF3E0" stroke="#8A4B08" /><text x="76" y="824" font-size="16" fill="#8A4B08" font-weight="800" text-anchor="start" dominant-baseline="hanging" >状态示例不是遥测记录：不得据此声称发生过失败、停用、刷新或恢复。</text></svg>