nant-baseline="hanging" data-layout-text="true" data-container-ref="page05-step-5" >待处理</text><rect x="1134" y="668" width="190" height="96" rx="8" fill="#FFFFFF" stroke="#B8C2CC" id="page05-step-6" data-layout-container="true" data-page05-step="6"/><text x="1152" y="684" font-size="15" fill="#17212B" font-weight="750" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="page05-step-6" >6. 保存边界</text><text x="1152" y="718" font-size="13" fill="#475467" font-weight="650" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="page05-step-6" >待处理</text><rect x="54" y="802" width="1288" height="96" rx="8" fill="#FFF3E0" stroke="#854A0E" id="page05-footer" data-layout-container="true" /><text x="72" y="820" font-size="15" fill="#854A0E" font-weight="700" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="page05-footer" >关系必须六选一；未知差距不生成路线；失败时保留输入并只重试失败步骤。</text></svg>