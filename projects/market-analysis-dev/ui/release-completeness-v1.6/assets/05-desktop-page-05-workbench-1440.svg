<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc" data-desktop-page="05" data-overlap-guard="computed"><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}*{shape-rendering:geometricPrecision;text-rendering:geometricPrecision}</style><title id="title">05 用户信息源工作台</title><desc id="desc">前端职业成长雷达发布完整性 v1.6 版本化设计原型</desc><rect x="0" y="0" width="1440" height="1024" rx="0" fill="#F5F7FA" stroke="#F5F7FA" /><rect x="32" y="22" width="1376" height="44" rx="0" fill="#F5F7FA" stroke="#F5F7FA" id="header-title" data-layout-container="true" /><text x="32" y="28" font-size="28" fill="#17212B" font-weight="800" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="header-title" >05 用户信息源工作台</text><rect x="32" y="68" width="1376" height="28" rx="0" fill="#F5F7FA" stroke="#F5F7FA" id="header-subtitle" data-layout-container="true" /><text x="32" y="72" font-size="14" fill="#475467" font-weight="550" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="header-subtitle" >六步流程只出现一次；来源渠道与内容类型分别确认。</text><rect x="32" y="106" width="1376" height="48" rx="8" fill="#FDECEF" stroke="#B4233C" id="truth-strip" data-layout-container="true" data-complete-truth-strip="true" data-surface="private"/><text x="50" y="122" font-size="14" fill="#B4233C" font-weight="750" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="truth-strip" >演示数据 · 用户提供 · 非真实用户档案 · 未经授权不外发</text><text x="1390" y="122" font-size="13" fill="#B4233C" font-weight="700" text-anchor="end" dominant-baseline="hanging" data-layout-text="true" data-container-ref="truth-strip" >CR-UI-002 v1.6</text><rect x="32" y="174" width="1376" height="76" rx="10" fill="#FFFFFF" stroke="#B8C2CC" id="filters-05" data-layout-container="true" /><rect x="52" y="194" width="210" height="36" rx="18" fill=