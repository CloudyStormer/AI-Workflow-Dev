<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc" data-desktop-page="06" data-overlap-guard="computed"><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}*{shape-rendering:geometricPrecision;text-rendering:geometricPrecision}</style><title id="title">06 个人事实与证据</title><desc id="desc">前端职业成长雷达发布完整性 v1.4 版本化设计原型</desc><rect x="0" y="0" width="1440" height="1024" rx="0" fill="#F5F7FA" stroke="#F5F7FA" /><rect x="32" y="22" width="1376" height="44" rx="0" fill="#F5F7FA" stroke="#F5F7FA" id="header-title" data-layout-container="true" /><text x="32" y="28" font-size="28" fill="#17212B" font-weight="800" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="header-title" >06 个人事实与证据</text><rect x="32" y="68" width="1376" height="28" rx="0" fill="#F5F7FA" stroke="#F5F7FA" id="header-subtitle" data-layout-container="true" /><text x="32" y="72" font-size="14" fill="#475467" font-weight="550" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="header-subtitle" >用户自述、可核验证据、系统评估与推断保持分层。</text><rect x="32" y="106" width="1376" height="48" rx="8" fill="#FDECEF" stroke="#B4233C" id="truth-strip" data-layout-container="true" data-complete-truth-strip="true" data-surface="private"/><text x="50" y="122" font-size="14" fill="#B4233C" font-weight="750" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="truth-strip" >演示数据 · 用户提供 · 非真实用户档案 · 未经授权不外发</text><text x="1390" y="122" font-size="13" fill="#B4233C" font-weight="700" text-anchor="end" dominant-baseline="hanging" data-layout-text="true" data-container-ref="truth-strip" >CR-UI-002 v1.4</text><rect x="32" y="174" width="1376" height="76" rx="10" fill="#FFFFFF" stroke="#B8C2CC" id="filters-06" data-layout-container="true" /><rect x="52" y="194" width="210" height="36" rx="18" fill="#EAF1FF" stroke="#1849A9" id="chip-06-0" data-layout-container="true" /><text x="157" y="203" font-size="14" fill="#1849A9" font-weight="700" text-anchor="middle" dominant-baseline="hanging" data-layout-text="true" data-container-ref="chip-06-0" >账号：演示 A</text><rect x="282" y="194" width="210" height="36" rx="18" fill="#EAF1FF" stroke="#1849A9" id="chip-06-1" data-layout-container="true" /><text x="387" y="203" font-size="14" fill="#1849A9" font-weight="700" text-anchor="middle" dominant-baseline="hanging" data-layout-text="true" data-container-ref="chip-06-1" >证据：待核验</text><rect x="512" y="194" width="210" height="36" rx="18" fill="#EAF1FF" stroke="#1849A9" id="chip-06-2" data-layout-container="true" /><text x="617" y="203" font-size="14" fill="#1849A9" font-weight="700" text-anchor="middle" dominant-baseline="hanging" data-layout-text="true" data-container-ref="chip-06-2" >未经授权不外发</text><rect x="32" y="282" width="435" height="270" rx="10" fill="#FFFFFF" stroke="#B8C2CC" id="card-06-0" data-layout-container="true" /><text x="54" y="304" font-size="20" fill="#17212B" font-weight="800" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="card-06-0" >用户自述</text><text x="54" y="350" font-size="15" fill="#17212B" font-weight="650" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="card-06-0" >熟悉 React 与 TypeScript</text><text x="54" y="392" font-size="14" fill="#475467" font-weight="550" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="card-06-0" >不能直接等同已掌握</text><rect x="491" y="282" width="435" height="270" rx="10" fill="#FFFFFF" stroke="#B8C2CC" id="card-06-1" data-layout-container="true" /><text x="513" y="304" font-size="20" fill="#17212B" font-weight="800" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="card-06-1" >可核验证据</text><text x="513" y="350" font-size="15" fill="#17212B" font-weight="650" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="card-06-1" >仓库、演示、指标与评审记录</text><text x="513" y="392" font-size="14" fill="#475467" font-weight="550" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="card-06-1" >核验状态单独显示</text><rect x="950" y="282" width="435" height="270" rx="10" fill="#FFFFFF" stroke="#B8C2CC" id="card-06-2" data-layout-container="true" /><text x="972" y="304" font-size="20" fill="#17212B" font-weight="800" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="card-06-2" >系统推断</text><text x="972" y="350" font-size="15" fill="#17212B" font-weight="650" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="card-06-2" >仅提供待确认建议</text><text x="972" y="392" font-size="14" fill="#475467" font-weight="550" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="card-06-2" >不得冒充用户事实</text><rect x="32" y="584" width="1376" height="360" rx="10" fill="#FFFFFF" stroke="#B8C2CC" id="detail-06" data-layout-container="true" /><text x="54" y="608" font-size="18" fill="#17212B" font-weight="800" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="detail-06" >当前页面说明</text><text x="54" y="656" font-size="16" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="detail-06" >所有状态同时使用文字、形状和图标，不以颜色作为唯一编码。</text><text x="54" y="704" font-size="16" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="detail-06" >键盘焦点顺序与视觉顺序一致；状态变化使用礼貌播报。</text><text x="54" y="752" font-size="16" fill="#B4233C" font-weight="700" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="detail-06" >当前无真实运行时来源、真实账号服务或获批招聘实例。</text></svg>