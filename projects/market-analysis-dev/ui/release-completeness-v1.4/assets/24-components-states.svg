<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc" data-pill-count="4"><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}*{shape-rendering:geometricPrecision;text-rendering:geometricPrecision}</style><title id="title">组件与状态规范</title><desc id="desc">前端职业成长雷达发布完整性 v1.4 版本化设计原型</desc><rect x="0" y="0" width="1440" height="1024" rx="0" fill="#F5F7FA" stroke="#F5F7FA" /><rect x="32" y="22" width="1376" height="44" rx="0" fill="#F5F7FA" stroke="#F5F7FA" id="header-title" data-layout-container="true" /><text x="32" y="28" font-size="28" fill="#17212B" font-weight="800" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="header-title" >24 组件与状态规范</text><rect x="32" y="68" width="1376" height="28" rx="0" fill="#F5F7FA" stroke="#F5F7FA" id="header-subtitle" data-layout-container="true" /><text x="32" y="72" font-size="14" fill="#475467" font-weight="550" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="header-subtitle" >状态胶囊文字按真实字体包围盒垂直居中；按钮触控区不小于 44px。</text><rect x="32" y="106" width="1376" height="48" rx="8" fill="#FDECEF" stroke="#B4233C" id="truth-strip" data-layout-container="true" data-complete-truth-strip="true" data-surface="mixed"/><text x="50" y="122" font-size="14" fill="#B4233C" font-weight="750" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="truth-strip" >公共：获批历史研究快照 · 个人：演示数据·用户提供 · 规则：系统配置</text><text x="1390" y="122" font-size="13" fill="#B4233C" font-weight="700" text-anchor="end" dominant-baseline="hanging" data-layout-text="true" data-container-ref="truth-strip" >CR-UI-002 v1.4</text><rect x="52" y="208" width="292" height="36" rx="18" fill="#FFF3E0" stroke="#854A0E" id="state-pill-0" data-layout-container="true" data-pill="true"/><text x="198" y="226" font-size="13" fill="#854A0E" font-weight="750" text-anchor="middle" dominant-baseline="middle" data-layout-text="true" data-container-ref="state-pill-0" data-pill-label="true">未就绪</text><rect x="382" y="208" width="292" height="36" rx="18" fill="#FDECEF" stroke="#B4233C" id="state-pill-1" data-layout-container="true" data-pill="true"/><text x="528" y="226" font-size="13" fill="#B4233C" font-weight="750" text-anchor="middle" dominant-baseline="middle" data-layout-text="true" data-container-ref="state-pill-1" data-pill-label="true">证据不足</text><rect x="712" y="208" width="292" height="36" rx="18" fill="#EAF1FF" stroke="#1849A9" id="state-pill-2" data-layout-container="true" data-pill="true"/><text x="858" y="226" font-size="13" fill="#1849A9" font-weight="750" text-anchor="middle" dominant-baseline="middle" data-layout-text="true" data-container-ref="state-pill-2" data-pill-label="true">待确认</text><rect x="1042" y="208" width="292" height="36" rx="18" fill="#E8F5F2" stroke="#0B6B63" id="state-pill-3" data-layout-container="true" data-pill="true"/><text x="1188" y="226" font-size="13" fill="#0B6B63" font-weight="750" text-anchor="middle" dominant-baseline="middle" data-layout-text="true" data-container-ref="state-pill-3" data-pill-label="true">已核验</text><rect x="320" y="330" width="800" height="430" rx="12" fill="#FFFFFF" stroke="#B8C2CC" id="component-dialog" data-layout-container="true" /><text x="352" y="362" font-size="24" fill="#17212B" font-weight="800" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="component-dialog" >确认删除个人记录？</text><text x="352" y="414" font-size="16" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="component-dialog" >此操作需要再次确认；当前只展示设计状态，不执行删除。</text><rect x="352" y="476" width="736" height="102" rx="8" fill="#FFF3E0" stroke="#854A0E" id="component-note" data-layout-container="true" /><text x="372" y="498" font-size="15" fill="#854A0E" font-weight="700" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="component-note" >影响：演示记录、路线草稿与导出历史将被移除。</text><text x="372" y="534" font-size="14" fill="#854A0E" font-weight="600" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="component-note" >账号 A 与账号 B 仍保持零可见性。</text><rect x="646" y="640" width="190" height="48" rx="8" fill="#FFFFFF" stroke="#B8C2CC" id="cancel-button" data-layout-container="true" data-button-id="cancel" data-touch-rect="true"/><text x="741" y="655" font-size="16" fill="#17212B" font-weight="750" text-anchor="middle" dominant-baseline="hanging" data-layout-text="true" data-container-ref="cancel-button" >取消</text><rect x="858" y="640" width="230" height="48" rx="8" fill="#B4233C" stroke="#B4233C" id="confirm-button" data-layout-container="true" data-button-id="confirm" data-touch-rect="true"/><text x="973" y="655" font-size="16" fill="#FFFFFF" font-weight="750" text-anchor="middle" dominant-baseline="hanging" data-layout-text="true" data-container-ref="confirm-button" >确认删除</text></svg>