<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc" data-desktop-page="08" data-overlap-guard="computed"><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}*{shape-rendering:geometricPrecision;text-rendering:geometricPrecision}</style><title id="title">08 未来方向与历史</title><desc id="desc">前端职业成长雷达发布完整性 v1.4 版本化设计原型</desc><rect x="0" y="0" width="1440" height="1024" rx="0" fill="#F5F7FA" stroke="#F5F7FA" /><rect x="32" y="22" width="1376" height="44" rx="0" fill="#F5F7FA" stroke="#F5F7FA" id="header-title" data-layout-container="true" /><text x="32" y="28" font-size="28" fill="#17212B" font-weight="800" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="header-title" >08 未来方向与历史</text><rect x="32" y="68" width="1376" height="28" rx="0" fill="#F5F7FA" stroke="#F5F7FA" id="header-subtitle" data-layout-container="true" /><text x="32" y="72" font-size="14" fill="#475467" font-weight="550" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="header-subtitle" >公共快照、个人记录、规则版本使用三条独立来源轨道。</text><rect x="32" y="106" width="1376" height="48" rx="8" fill="#FDECEF" stroke="#B4233C" id="truth-strip" data-layout-container="true" data-complete-truth-strip="true" data-surface="mixed"/><text x="50" y="122" font-size="14" fill="#B4233C" font-weight="750" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="truth-strip" >公共：获批历史研究快照 · 个人：演示数据·用户提供 · 规则：系统配置</text><text x="1390" y="122" font-size="13" fill="#B4233C" font-weight="700" text-anchor="end" dominant-baseline="hanging" data-layout-text="true" data-container-ref="truth-strip" >CR-UI-002 v1.4</text><rect x="32" y="174" width="1376" height="76" rx="10" fill="#FFFFFF" stroke="#B8C2CC" id="filters-08" data-layout-container="true" /><rect x="52" y="194" width="210" height="36" rx="18" fill="#EAF1FF" stroke="#1849A9" id="chip-08-0" data-layout-container="true" /><text x="157" y="203" font-size="14" fill="#1849A9" font-weight="700" text-anchor="middle" dominant-baseline="hanging" data-layout-text="true" data-container-ref="chip-08-0" >窗口：90日</text><rect x="282" y="194" width="210" height="36" rx="18" fill="#EAF1FF" stroke="#1849A9" id="chip-08-1" data-layout-container="true" /><text x="387" y="203" font-size="14" fill="#1849A9" font-weight="700" text-anchor="middle" dominant-baseline="hanging" data-layout-text="true" data-container-ref="chip-08-1" >三轨分别标注</text><rect x="512" y="194" width="210" height="36" rx="18" fill="#EAF1FF" stroke="#1849A9" id="chip-08-2" data-layout-container="true" /><text x="617" y="203" font-size="14" fill="#1849A9" font-weight="700" text-anchor="middle" dominant-baseline="hanging" data-layout-text="true" data-container-ref="chip-08-2" >按版本回看</text><rect x="32" y="282" width="435" height="270" rx="10" fill="#FFFFFF" stroke="#B8C2CC" id="card-08-0" data-layout-container="true" /><text x="54" y="304" font-size="20" fill="#17212B" font-weight="800" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="card-08-0" >公共快照</text><text x="54" y="350" font-size="15" fill="#17212B" font-weight="650" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="card-08-0" >获批历史研究快照</text><text x="54" y="392" font-size="14" fill="#475467" font-weight="550" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="card-08-0" >运行时来源仍为 0</text><rect x="491" y="282" width="435" height="270" rx="10" fill="#FFFFFF" stroke="#B8C2CC" id="card-08-1" data-layout-container="true" /><text x="513" y="304" font-size="20" fill="#17212B" font-weight="800" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="card-08-1" >个人记录</text><text x="513" y="350" font-size="15" fill="#17212B" font-weight="650" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="card-08-1" >演示数据 · 用户提供</text><text x="513" y="392" font-size="14" fill="#475467" font-weight="550" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="card-08-1" >不代表真实用户档案</text><rect x="950" y="282" width="435" height="270" rx="10" fill="#FFFFFF" stroke="#B8C2CC" id="card-08-2" data-layout-container="true" /><text x="972" y="304" font-size="20" fill="#17212B" font-weight="800" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="card-08-2" >规则版本</text><text x="972" y="350" font-size="15" fill="#17212B" font-weight="650" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="card-08-2" >系统配置与规则变更</text><text x="972" y="392" font-size="14" fill="#475467" font-weight="550" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="card-08-2" >保留版本与时间</text><rect x="32" y="584" width="1376" height="360" rx="10" fill="#FFFFFF" stroke="#B8C2CC" id="detail-08" data-layout-container="true" /><text x="54" y="608" font-size="18" fill="#17212B" font-weight="800" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="detail-08" >当前页面说明</text><text x="54" y="656" font-size="16" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="detail-08" >所有状态同时使用文字、形状和图标，不以颜色作为唯一编码。</text><text x="54" y="704" font-size="16" fill="#17212B" font-weight="600" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="detail-08" >键盘焦点顺序与视觉顺序一致；状态变化使用礼貌播报。</text><text x="54" y="752" font-size="16" fill="#B4233C" font-weight="700" text-anchor="start" dominant-baseline="hanging" data-layout-text="true" data-container-ref="detail-08" >当前无真实运行时来源、真实账号服务或获批招聘实例。</text></svg>