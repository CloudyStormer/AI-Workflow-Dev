schema_version: 1
project:
  id: "ai-model-radar"
  name: "AI Model Radar"
  kind: "product"
  profile: "split-web"
governance:
  project_skill: "skills/project-ai-model-radar/SKILL.md"
  shared_skills_source: "../../skill"
  workflow_state: "workflow/state.yaml"
  approvals: "workflow/approvals.yaml"
  artifacts: "workflow/artifacts.yaml"
  events: "workflow/events.jsonl"
entrypoints:
  dev:
    cwd: "frontend"
    command: "npm run dev -- --host 127.0.0.1"
  build:
    cwd: "frontend"
    command: "npm run build"
  test:
    cwd: "frontend"
    command: "npm run test"
  lint:
    cwd: "frontend"
    command: "npm run lint"
modules:
  - name: "frontend"
    path: "frontend"
  - name: "backend"
    path: "backend"
  - name: "deployment"
    path: "docker"
  - name: "ui"
    path: "ui"
