  <title>AI Model Radar｜逐条中文对照设计原型</title>
  <style>
    :root {
      --canvas:#f5f7fa; --surface:#fff; --muted:#eef2f7; --primary:#312e81;
      --primary-hover:#26236b; --link:#174ea6; --success:#087f5b; --info:#1d4ed8;
      --warning:#7a4108; --danger:#a61b32; --text:#172033; --secondary:#475467;
      --border:#cbd3df; --focus:#1d4ed8; --shadow:0 12px 32px rgba(23,32,51,.14);
      --r-sm:6px; --r-md:8px; --r-lg:12px;
    }
    * { box-sizing:border-box; }
    html { color-scheme:light; }
    body { margin:0; min-width:320px; background:var(--canvas); color:var(--text); font-family:"PingFang SC","Source Han Sans SC",Inter,system-ui,sans-serif; font-size:15px; line-height:1.6; }
    button,input,select { font:inherit; color:inherit; }
    button,a,input,select { outline:none; }
    button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible { box-shadow:0 0 0 3px var(--focus); border-color:var(--focus)!important; }
    a { color:var(--link); text-decoration-thickness:1px; text-underline-offset:3px; }
    code,.mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; overflow-wrap:anywhere; }
    .skip { position:fixed; left:16px; top:-80px; z-index:100; background:var(--surface); padding:12px 16px; border:2px solid var(--focus); border-radius:8px; }
    .skip:focus { top:16px; }
    .app { min-height:100vh; display:grid; grid-template-columns:248px minmax(0,1fr); }
    .sidebar { position:sticky; top:0; height:100vh; padding:24px 16px; background:#17164a; color:#fff; display:flex; flex-direction:column; gap:24px; }
    .brand { padding:0 12px; }
    .brand strong { display:block; font-size:18px; letter-spacing:.01em; }
    .brand span { display:block; color:#c9c8ef; font-size:13px; margin-top:2px; }
    .nav { display:grid; gap:5px; }
    .nav button { width:100%; min-height:44px; border:0; border-radius:8px; padding:10px 12px; text-align:left; color:#deddfa; background:transparent; cursor:pointer; display:flex; align-items:center; gap:10px; }
    .nav button:hover { background:#262560; color:#fff; }
    .nav button[aria-current="page"] { background:#fff; color:#201f67; font-weight:650; }
    .nav .glyph { width:22px; height:22px; border:1.5px solid currentColor; border-radius:6px; display:grid; place-items:center; font-size:11px; flex:none; }
    .sidebar-note { margin-top:auto; padding:12px; border:1px solid #454482; border-radius:10px; color:#d6d5f3; font-size:13px; }
    .shell { min-width:0; }
    .demo-banner { min-height:42px; padding:8px 28px; background:#fff3df; color:#6c3705; border-bottom:1px solid #e2b878; display:flex; align-items:center; justify-content:center; gap:8px; font-weight:650; text-align:center; }
    .demo-banner .shape { width:13px; height:13px; border:2px solid currentColor; transform:rotate(45deg); flex:none; }
    .topbar { min-height:72px; padding:14px 32px; background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:10; }
    .search { position:relative; flex:1; max-width:520px; }
    .search input { width:100%; min-height:44px; border:1px solid var(--border); border-radius:8px; padding:9px 42px 9px 14px; background:#fff; }
    .search kbd { position:absolute; right:11px; top:10px; min-width:26px; text-align:center; border:1px solid var(--border); border-radius:5px; color:var(--secondary); font-size:12px; background:var(--canvas); }
    .control { min-height:44px; border:1px solid var(--border); border-radius:8px; background:#fff; padding:9px 12px; cursor:pointer; }
    .control:hover { border-color:#8f9aaa; background:#fafbfc; }
    .control.primary { background:var(--primary); color:#fff; border-color:var(--primary); }
    .control.primary:hover { background:var(--primary-hover); }
    .content { max-width:1248px; margin:0 auto; padding:28px 32px 80px; }
    .truth { background:#eef4ff; border:1px solid #b7c8eb; border-left:5px solid var(--info); border-radius:10px; padding:14px 16px; display:flex; gap:18px; align-items:flex-start; margin-bottom:22px; }
    .truth strong { white-space:nowrap; }
    .truth dl { margin:0; display:flex; flex-wrap:wrap; gap:8px 22px; }
    .truth dl div { display:flex; gap:6px; }
    .truth dt { color:var(--secondary); }
    .truth dd { margin:0; font-weight:600; }
    .page-head { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:22px; }
    .page-head h1 { margin:0; font-size:30px; line-height:1.3; }
    .page-head p { margin:5px 0 0; color:var(--secondary); }
    .actions { display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; }
    .grid { display:grid; gap:16px; }
    .cols-4 { grid-template-columns:repeat(4,minmax(0,1fr)); }
    .cols-3 { grid-template-columns:repeat(3,minmax(0,1fr)); }
    .cols-2 { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .main-aside { grid-template-columns:minmax(0,2fr) minmax(280px,1fr); }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px; min-width:0; }
    .card h2,.card h3 { margin:0 0 8px; line-height:1.45; }
    .card h2 { font-size:20px; }
    .card h3 { font-size:16px; }
    .card p { margin:6px 0; }
    .metric b { display:block; font-size:26px; line-height:1.25; margin-top:4px; }
    .metric small { color:var(--secondary); }
    .section-title { display:flex; align-items:center; justify-content:space-between; gap:16px; margin:28px 0 12px; }
    .section-title h2 { margin:0; font-size:20px; }
    .section-title p { color:var(--secondary); margin:0; }
    .tag-row { display:flex; flex-wrap:wrap; gap:7px; align-items:center; }
    .tag { display:inline-flex; align-items:center; gap:6px; min-height:28px; padding:3px 9px; border:1px solid var(--border); border-radius:6px; background:#fff; color:#344054; font-size:13px; font-weight:600; }
    .tag::before { content:""; width:8px; height:8px; border:1.5px solid currentColor; border-radius:2px; }
    .tag.human { color:#5c2f91; background:#f8f0ff; border-color:#d3b6ed; }
    .tag.machine { color:#1d4ed8; background:#edf4ff; border-color:#b7c8eb; }
    .tag.rule { color:#08634a; background:#eaf8f2; border-color:#a8d8c8; }
    .tag.none { color:#5b6573; background:#f2f4f7; }
    .tag.warn { color:#7a4108; background:#fff4e8; border-color:#d9ab78; }
    .tag.danger { color:#a61b32; background:#fff0f2; border-color:#e3a7b2; }
    .tag.fact { color:#28557c; background:#f1f7fc; border-style:dashed; }
    .event-card { padding:20px; }
    .event-top { display:flex; justify-content:space-between; gap:16px; align-items:flex-start; }
    .event-card h2 { font-size:19px; margin:10px 0 3px; }
    .original-title { margin:0!important; color:var(--secondary); font-family:Inter,system-ui,sans-serif; line-height:1.45; }
    .summary { padding-top:14px; margin-top:14px; border-top:1px solid #e2e7ee; }
    .summary-label { display:block; font-size:13px; color:var(--secondary); font-weight:650; }
    .meta { display:flex; flex-wrap:wrap; gap:7px 16px; color:var(--secondary); font-size:13px; margin-top:14px; }
    .text-button { border:0; background:transparent; padding:4px 0; color:var(--link); cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
    .original-summary { margin-top:10px; padding:12px; background:#f7f9fb; border-left:3px solid #8d97a8; color:#344054; }
    .hidden { display:none!important; }
    .status-panel { border-left:5px solid var(--warning); background:#fff8ef; }
    .status-panel.danger { border-left-color:var(--danger); background:#fff2f4; }
    .status-panel.info { border-left-color:var(--info); background:#f2f6ff; }
    .split { display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
    .split .card { height:100%; }
    .pane-label { text-transform:none; color:var(--secondary); font-size:13px; font-weight:700; letter-spacing:.02em; }
    .key-points { margin:10px 0 0; padding-left:20px; }
    .system-eval { margin-top:16px; padding:14px; border:1px dashed #8aa1cc; border-radius:9px; background:#f4f7ff; }
    .timeline { position:relative; display:grid; gap:15px; padding-left:26px; }
    .timeline::before { content:""; position:absolute; left:8px; top:7px; bottom:7px; border-left:2px solid #bdc6d3; }
    .timeline-item { position:relative; }
    .timeline-item::before { content:""; position:absolute; left:-23px; top:6px; width:10px; height:10px; border:2px solid var(--primary); background:#fff; border-radius:50%; }
    .timeline-item.current::before { background:var(--primary); }
    .timeline-item.failed::before { border-color:var(--danger); border-radius:1px; transform:rotate(45deg); }
    .timeline-item time { display:block; color:var(--secondary); font-size:13px; }
    .chart { min-height:280px; display:flex; align-items:flex-end; gap:14px; padding:38px 12px 36px; border-left:1px solid var(--border); border-bottom:1px solid var(--border); position:relative; }
    .bar { flex:1; min-width:20px; max-width:58px; height:var(--h); background:var(--primary); border:2px solid #211f6d; border-radius:7px 7px 0 0; position:relative; }
    .bar span { position:absolute; left:50%; transform:translateX(-50%); bottom:-29px; white-space:nowrap; font-size:12px; color:var(--secondary); }
    .bar b { position:absolute; left:50%; transform:translateX(-50%); top:-29px; font-size:13px; }
    .chart-note { position:absolute; top:4px; left:12px; color:var(--secondary); font-size:13px; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th,td { text-align:left; padding:10px 12px; border-bottom:1px solid #dce2ea; vertical-align:top; }
    th { background:#f1f4f8; font-weight:700; }
    .filter-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
    .filter-row button { min-height:40px; border:1px solid var(--border); background:#fff; border-radius:8px; padding:7px 11px; cursor:pointer; }
    .filter-row button[aria-pressed="true"] { color:#fff; background:var(--primary); border-color:var(--primary); }
    .source-row { display:grid; grid-template-columns:1.3fr .8fr .8fr 1fr; gap:12px; align-items:center; padding:14px 0; border-bottom:1px solid #e1e6ed; }
    .source-row:last-child { border-bottom:0; }
    .state-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
    .state-swatch { border-top:4px solid var(--border); }
    .state-swatch.warn { border-top-color:var(--warning); }
    .state-swatch.danger { border-top-color:var(--danger); }
    .state-swatch.info { border-top-color:var(--info); }
    .state-swatch.success { border-top-color:var(--success); }
    .empty { text-align:center; padding:44px 20px; border:1px dashed #9ca7b5; border-radius:10px; background:#fafbfc; }
    .empty .shape { width:34px; height:34px; border:2px solid #667085; border-radius:8px; margin:0 auto 12px; display:grid; place-items:center; }
    .mobile-only { display:none; }
    .toast { position:fixed; right:24px; bottom:24px; z-index:50; max-width:360px; padding:13px 16px; color:#fff; background:#25304a; border-radius:9px; box-shadow:var(--shadow); }
    footer { margin-top:30px; color:var(--secondary); font-size:13px; text-align:center; }

    @media (max-width:1100px) {
      .app { grid-template-columns:68px minmax(0,1fr); }
      .sidebar { padding:20px 8px; align-items:center; }
      .brand strong { font-size:0; }
      .brand strong::after { content:"AMR"; font-size:15px; }
      .brand span,.nav .label,.sidebar-note { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
      .nav button { padding:10px; justify-content:center; }
      .topbar { padding-inline:24px; }
      .content { padding-inline:24px; }
      .cols-4 { grid-template-columns:repeat(2,minmax(0,1fr)); }
    }
    @media (max-width:760px) {
      body { font-size:16px; line-height:1.5; }
      .app { display:block; }
      .sidebar { position:fixed; z-index:30; left:0; right:0; bottom:0; top:auto; height:72px; padding:7px 6px env(safe-area-inset-bottom); display:block; border-top:1px solid #454482; }
      .brand,.sidebar-note { display:none; }
      .nav { grid-template-columns:repeat(5,1fr); gap:2px; height:100%; }
      .nav button { min-height:56px; padding:5px 2px; border-radius:7px; flex-direction:column; gap:2px; font-size:14px; text-align:center; }
      .nav .label { position:static; width:auto; height:auto; overflow:visible; clip:auto; line-height:1.1; }
      .nav button:nth-child(n+6) { display:none; }
      .nav .glyph { width:22px; height:22px; }
      .demo-banner { min-height:50px; padding:8px 14px; font-size:14px; }
      .topbar { position:static; padding:10px 16px; flex-wrap:wrap; }
      .search { flex-basis:100%; max-width:none; order:2; }
      .topbar .desktop-control { display:none; }
      .mobile-only { display:inline-flex; }
      .content { padding:20px 16px 100px; }
      .truth { display:block; padding:13px 14px; }
      .truth strong { display:block; white-space:normal; margin-bottom:7px; }
      .truth dl { display:grid; grid-template-columns:1fr 1fr; gap:6px 10px; }
      .truth dl div { display:block; }
      .truth dt,.truth dd { font-size:14px; }
      .page-head { display:block; }
      .page-head h1 { font-size:24px; line-height:1.35; }
      .actions { justify-content:flex-start; margin-top:14px; }
      .control { min-height:44px; }
      .grid,.cols-4,.cols-3,.cols-2,.main-aside,.state-grid,.split { grid-template-columns:1fr; }
      .card { padding:16px; }
      .event-top { display:block; }
      .event-top .tag-row { margin-top:10px; }
      .event-card h2 { font-size:18px; }
      .original-title { font-size:16px; }
      .meta { font-size:14px; }
      .source-row { grid-template-columns:1fr; gap:4px; }
      .source-row > *:not(:first-child) { padding-left:12px; border-left:2px solid #d7dde6; }
      .chart { overflow-x:auto; gap:10px; }
      .bar { min-width:38px; }
      .toast { left:16px; right:16px; bottom:90px; }
      th,td { padding:9px 10px; }
    }
    @media (max-width:350px) {
      .content { padding-inline:12px; }
      .topbar { padding-inline:12px; }
      .truth dl { grid-template-columns:1fr; }
      .nav button { font-size:14px; }
      .card { padding:14px; }
      .tag { font-size:12px; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition:none!important; } }
  </style>
</head>

  <script>
    const labels={today:'今日雷达',events:'全部事件',detail:'事件详情',trends:'趋势与版本',open:'开源与发布',history:'历史快照与修订',sources:'来源与质量',states:'状态组件'};
    const view=document.querySelector('#view'); const announce=document.querySelector('#announcer');
    function showToast(message){ const old=document.querySelector('.toast'); if(old) old.remove(); const toast=document.createElement('div'); toast.className='toast'; toast.setAttribute('role','status'); toast.textContent=message; document.body.appendChild(toast); setTimeout(()=>toast.remove(),2600); }
    function render(name, push=true){ if(!labels[name]) name='today'; view.replaceChildren(document.querySelector(`#${name}-view`).content.cloneNode(true)); document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-current',b.dataset.view===name?'page':'false')); if(push) history.replaceState(null,'',`#${name}`); document.title=`${labels[name]}｜AI Model Radar 设计原型`; announce.textContent=`已切换到${labels[name]}`; bindView(); document.querySelector('#main').focus({preventScroll:true}); }
    function bindView(){
      document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>render(b.dataset.view));
      document.querySelectorAll('[data-toggle-original]').forEach(b=>b.onclick=()=>{const p=b.nextElementSibling; const open=b.getAttribute('aria-expanded')==='true'; b.setAttribute('aria-expanded',String(!open)); p.classList.toggle('hidden',open); b.textContent=open?'展开原文摘要':'收起原文摘要'; announce.textContent=open?'原文摘要已收起':'原文摘要已展开';});
      document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>filterEvents(b.dataset.status,b));
      document.querySelectorAll('[data-clear-filter]').forEach(b=>b.onclick=()=>filterEvents('all',document.querySelector('[data-status="all"]')));
      document.querySelectorAll('[data-table-toggle]').forEach(b=>b.onclick=()=>{const t=document.querySelector('[data-equivalent-table]'); const open=b.getAttribute('aria-expanded')==='true'; b.setAttribute('aria-expanded',String(!open)); t.classList.toggle('hidden',open); b.textContent=open?'显示等价表':'隐藏等价表'; announce.textContent=open?'等价表已隐藏':'等价表已显示';});
    }
    function filterEvents(status,button){ const cards=[...document.querySelectorAll('[data-status-value]')]; if(!cards.length)return; document.querySelectorAll('[data-status]').forEach(x=>x.setAttribute('aria-pressed',String(x===button))); let count=0; cards.forEach(c=>{const show=status==='all'||c.dataset.statusValue===status; c.classList.toggle('hidden',!show); if(show)count++;}); const empty=document.querySelector('#no-results'); if(empty)empty.classList.toggle('hidden',count>0); const label=document.querySelector('#result-label'); if(label)label.textContent=`${count} 条界面演示内容`; announce.textContent=`筛选完成，共 ${count} 条结果`; }
    document.querySelector('#global-search').addEventListener('input',e=>{ const q=e.target.value.trim().toLowerCase(); const cards=[...document.querySelectorAll('[data-search-value]')]; if(!cards.length)return; let count=0; cards.forEach(c=>{const show=!q||c.dataset.searchValue.includes(q)||c.textContent.toLowerCase().includes(q); c.classList.toggle('hidden',!show); if(show)count++;}); const label=document.querySelector('#result-label'); if(label)label.textContent=`${count} 条匹配结果`; announce.textContent=`搜索完成，共 ${count} 条匹配结果`; });
    document.addEventListener('keydown',e=>{ if(e.key==='/' && document.activeElement.tagName!=='INPUT'){ e.preventDefault(); document.querySelector('#global-search').focus(); } if(e.key==='Escape' && document.activeElement===document.querySelector('#global-search')){ document.querySelector('#global-search').value=''; document.querySelector('#global-search').dispatchEvent(new Event('input')); document.querySelector('#global-search').blur(); showToast('搜索已清除'); }});
    window.addEventListener('hashchange',()=>render(location.hash.slice(1)||'today',false));
    render(location.hash.slice(1)||'today',false);
  </script>
